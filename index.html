<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neam">
<meta name="theme-color" content="#F5F5F5">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="/bilder/neam-robot.png">
<title>Neam</title>
<link rel="stylesheet" href="/felles-rot.css?v=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  /* Sidespesifikke variabler. Palett og typeskala ligger i
     felles-rot.css. */
  :root{
    --shadow-lift:0 14px 30px rgba(44,62,80,.16);
  }

/* iPad: leses paa avstand, alt et hakk opp */

/* PC: naert oeye, taaler tett informasjon - tilbake til mobilskalaen,
   men klokka blir staaende stor. */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}
body{
  font-family:'Archivo',sans-serif;color:var(--ink);
  background:var(--side-bakgrunn);
  background-attachment:fixed;
  padding:28px 28px calc(28px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;
}
.shell{max-width:1180px;margin:0 auto}

/* ---------- Topplinje ---------- */
/* Tre spor med 1fr paa hver side holder merket i midten av linja uansett
   hvor bred klokka blir. Med flex og margin:auto ville klokka dyttet det
   ut av senter. */
.top{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
  padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px;
}
.brand{grid-column:2;display:flex;align-items:center;justify-content:center;min-width:0}
/* Samme frie ramme som flisene under: merket har eget omriss og egen bunn,
   saa ingen sirkel, luft eller skygge rundt. Navnet staar i selve bildet,
   derfor er teksten ved siden av fjernet - innlogget bruker vises i bunnen.
   Bredden foelger fliseikonene: et fliseikon er 194px paa full skjerm og
   125px paa telefon, og clamp treffer begge endene. Den kan ikke matche
   overalt - mellom 700 og 1000px blir flisene 220-274px fordi rutenettet
   da har faerre kolonner paa samme bredde, og et merke paa 274px i
   topplinja ville tatt over hele skjermen. Der bremser 17vw. */
.brand-icon{width:clamp(120px, 17vw, 195px);height:auto;flex-shrink:0}
.brand-icon img{width:100%;height:auto;display:block}
.clock{grid-column:3;justify-self:end;text-align:right;line-height:1}
.clock-time{
  font-size:var(--t-display);font-weight:700;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.clock-date{
  font-size:var(--t-brod);color:var(--ink-soft);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;margin-top:6px;
}

/* ---------- Rutenett ---------- */
/* Index er landingssiden: klokke, overskrift og appene. Ingenting mer. */
.grid{display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

/* ---------- Telefon ----------
   .top er en flex-rad der .brand hadde flex-shrink:0 og aldri ga etter,
   mens klokka er 52px og datoen staar i versaler med luft mellom. Til
   sammen bredere enn en telefonskjerm - derfor startet siden forskjovet. */
@media(max-width:560px){
  .top{gap:10px;padding-bottom:14px;margin-bottom:18px}
  .clock{min-width:0}
  .clock-date{margin-top:3px;letter-spacing:.05em}
  /* Vaerknappen legger seg paa egen linje under merket og klokka. */
  .app-name{letter-spacing:.02em}
  .app-icon{margin-bottom:9px}
  .app{padding:16px 8px 14px}
  .panel{padding:16px;border-radius:16px}
  .grid{gap:16px}
}

.panel{
  background:var(--paper);border-radius:18px;padding:22px;
  box-shadow:var(--shadow);
}
.panel-head{
  display:flex;align-items:baseline;gap:10px;margin-bottom:16px;
}
.panel-title{
  font-size:var(--t-meta);font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink);
}
.panel-note{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-etikett);color:var(--ink-soft);opacity:.75;
}

/* ---------- Snarveier ---------- */
/* Tre kolonner og tre rader = ni fliser synlig. Resten naas ved aa rulle
   inne i panelet, saa den tiende ikke blir staaende og kikke opp nederst
   paa siden. Fast radhoeyde gjoer at kuttet havner mellom rader. */
.apps{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  grid-auto-rows:auto;gap:16px;
}
/* Med full bredde er det plass til fem per rad, saa alle ti staar framme
   uten aa rulle - og ingen halv flis kikker opp nederst. */
@media(max-width:1000px){ .apps{grid-template-columns:repeat(3,minmax(0,1fr))} }
/* Maa staa ETTER 1000px-regelen for aa vinne. Den gamle toklonners-regelen
   laa foer den og ble overstyrt, saa telefonen fikk tre smale fliser. */
@media(max-width:700px){ .apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }
.panel-apper{position:relative}
.app{min-width:0}

/* Vaeret i toppraden */

.app{
  /* Kvadrat: hoeyden foelger bredden. Var 186px fast, som ga en hoey smal
     boks naar kolonnen krympet - og da maatte navnet brekkes i tre. */
  aspect-ratio:1;justify-content:center;min-height:0;
  text-decoration:none;color:inherit;background:var(--bg-2);
  border:1px solid var(--line);border-radius:16px;
  padding:22px 14px 18px;text-align:center;
  display:flex;flex-direction:column;align-items:center;
  transition:transform .18s ease,box-shadow .18s ease;
}
.app:active{transform:scale(.97)}
@media(hover:hover){.app:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}}
.app-icon{
  width:54%;max-width:110px;aspect-ratio:1;height:auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;margin-bottom:12px;
}
.app-icon img{width:100%;height:auto;display:block}

/* Telefon i landskap: ca. 840x390. Kvadratiske fliser blir da hoeyere enn
   det synlige omraadet. Kvadratet slippes naar hoeyden er knapp, og flisen
   blir bare saa hoey som innholdet krever.
   MERK: denne blokka MAA staa etter .app og .app-icon over. Laa den foer,
   ble den stille overstyrt av dem - lik spesifisitet, siste regel vinner. */
@media(max-height:600px){
  .app{aspect-ratio:auto;padding:14px 10px 12px}
  .app-icon{width:auto;height:54px;max-width:none}
}

/* Fliser der navnet allerede staar i selve merkelappen (NEAM-bildene).
   Etiketten under er fjernet, og bildet fyller flisen i stedet.
   Sirkelklippet er slaatt av her: merkelappene har eget omriss og
   gjennomsiktige hjoerner, og baandet nederst ble kappet av
   border-radius:50% + overflow:hidden.
   MERK: .app.merke (0,2,0) slaar .app inne i mediesporringene over, saa
   dette maa gjentas i en egen mediesporring for lav skjermhoeyde. */
.app.merke{padding:10px}
.app.merke .app-icon{
  width:100%;max-width:none;margin-bottom:0;
  border-radius:0;overflow:visible;
}
@media(max-height:600px){
  .app.merke{padding:8px}
  .app.merke .app-icon{width:auto;height:74px;max-width:100%}
}
.app-name{
  font-size:var(--t-brod);font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;line-height:1.2;
  /* "ARBEIDSOPPGAVER" i versaler med bokstavavstand er bredere enn en
     flis paa telefon. Uten en bryteregel presser ordet rutenettsporet ut
     over skjermkanten, og hele siden starter forskjovet.
     MERK: her sto "overflow-wrap:anywhere", som bryter hvor som helst og
     ogsaa naar det er plass - det ga "NEAM DASH-BOAR D". "break-word"
     bryter bare naar ordet faktisk ikke faar plass, og lar hyphens:auto
     dele paa stavelse foerst (html lang="no" er satt). */
  overflow-wrap:break-word;-webkit-hyphens:manual;hyphens:manual;max-width:100%;
}
.app.soon{opacity:.42}

/* ---------- Planlagte fliser ----------
   De seks flisene som ikke er bygd enda ligger skjult til vanlig, saa de
   ferdige appene faar hele bredden. Bryteren setter en klasse paa rutenettet
   i stedet for hidden-attributtet: .app har display:flex, og det ville
   overstyrt [hidden] stille. */
.apps.skjul-planlagte .app.planlagt{display:none}
.planlagt-knapp{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-etikett);text-transform:uppercase;letter-spacing:.08em;
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;color:var(--ink-soft);cursor:pointer;
}
.planlagt-knapp:active{background:var(--bg-1)}
.app-badge{
  margin-top:6px;font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-etikett);letter-spacing:.08em;color:var(--ink-soft);
  text-transform:uppercase;
}

/* ---------- Vær ---------- */

.msg{font-size:var(--t-brod);color:var(--ink-soft);padding:8px 0;line-height:1.5}
.msg.err{color:#B4443A}

/* ---------- Bunn ---------- */

/* ---------- Innloggingsport ---------- */
#port{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
/* display:flex over overstyrer [hidden], så vi sier det eksplisitt */
#port[hidden]{ display:none; }
#port .kort{
  background:var(--paper);border-radius:20px;padding:44px 30px 38px;
  box-shadow:var(--shadow);text-align:center;max-width:460px;width:100%;
}
#port .ikon{
  width:200px;max-width:60vw;
  margin:0 auto 22px;
  display:flex;align-items:center;justify-content:center;
}
#port .ikon img{width:100%;height:auto;display:block}
#port h1{
  font-size:var(--t-stor);font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;line-height:1.2;
}
#port p{font-size:var(--t-brod);color:var(--ink-soft);line-height:1.6;margin:14px auto 26px}
#port .logginn{
  display:flex;align-items:center;justify-content:center;
  width:58px;height:58px;margin:6px auto 0;
  background:var(--ink);color:#fff;border:none;border-radius:50%;
  cursor:pointer;box-shadow:0 4px 14px rgba(44,62,80,.28);
  transition:transform .12s ease, box-shadow .12s ease;
}
#port .logginn:hover{box-shadow:0 6px 18px rgba(44,62,80,.34)}
#port .logginn:active{transform:scale(.94)}
#port .logginn svg{display:block}
#port small{
  display:block;margin-top:24px;font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-etikett);color:var(--ink-soft);line-height:1.7;
}
#port small.feil{color:#B4443A}
.ut{
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;color:var(--ink-soft);cursor:pointer;
}
.bruker{
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);
  color:var(--ink-soft);text-align:right;line-height:1.5;
}
.bruker b{display:block;font-family:'Archivo',sans-serif;font-size:var(--t-meta);color:var(--ink);font-weight:700}

footer{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);
}
.refresh{
  margin-left:auto;font-family:inherit;font-size:var(--t-etikett);
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;color:var(--ink-soft);cursor:pointer;
}
.refresh:active{background:var(--bg-1)}

/* ---------- Laast ramme ----------
   Siden skal ikke kunne dras sidelengs eller zoomes ved uhell.
   Merk: iOS Safari overstyrer user-scalable og slipper knipezoom likevel -
   det som faktisk virker er touch-action mot dobbelttrykk, og 16px i
   skjemafelt saa iOS ikke zoomer inn naar man trykker i dem. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{touch-action:manipulation}
input,select,textarea{font-size:16px}
</style>
</head>
<body>

<div id="port" hidden>
  <div class="kort">
    <div class="ikon"><img src="/bilder/neam-robot.png" alt="NEAM" width="160" height="158"></div>
    <button class="logginn" onclick="loggInn()" aria-label="Logg inn">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
           stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <path d="M12 5l7 7-7 7"></path>

<div class="shell" id="shell" hidden>

  <div class="top">

          <span class="app-name">Økonomi</span>

          <span class="app-name">Sikker&shy;het</span>

    <button class="ut" onclick="loggUt()">Logg ut</button>

</div>

<script>
/* ============================================================
   Innlogging — samme Azure-app og samme lagring som kalenderen,
   slik at én pålogging gjelder alle sidene på dette domenet.
   ============================================================ */
const CFG = {
  clientId : 'ccab6959-abc2-4d09-9212-4b33c0db025c',
  authority: 'common',
  scopes   : 'openid profile offline_access User.Read Calendars.Read Calendars.ReadWrite'
};
const REDIRECT  = location.origin + location.pathname;
const AUTH_BASE = 'https://login.microsoftonline.com/' + CFG.authority + '/oauth2/v2.0';

/* Godkjent-liste. Tom liste = alle Microsoft-kontoer slipper inn.
   Med adresser her stoppes alle andre ved porten (403). */
const SLIPP_INN = [
  'magne@neam.no',
  'nina@neam.no',
  'nmidttun@hotmail.com',
  'emma@neam.no',
  'andrea@neam.no',
  'kitchen@neam.no',
  'sys@neam.no'
];

const A = { token:null, refresh:null, expires:0, me:null };

function randStr(n){
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return Array.from(a, b => ('0'+b.toString(16)).slice(-2)).join('');
}
async function challenge(v){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function loggInn(){
  const verifier = randStr(48), stateTok = randStr(8);
  sessionStorage.setItem('fh_verifier', verifier);
  sessionStorage.setItem('fh_state', stateTok);
  const p = new URLSearchParams({
    client_id: CFG.clientId,
    response_type: 'code',
    redirect_uri: REDIRECT,
    response_mode: 'query',
    scope: CFG.scopes,
    state: stateTok,
    code_challenge: await challenge(verifier),
    code_challenge_method: 'S256'
  });
  location.href = AUTH_BASE + '/authorize?' + p;
}

async function bytt(body){
  const base = { client_id: CFG.clientId, redirect_uri: REDIRECT };
  for(const k in body) base[k] = body[k];
  const r = await fetch(AUTH_BASE + '/token', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams(base)
  });
  const txt = await r.text();
  let d;
  try{ d = JSON.parse(txt); }catch(e){ throw new Error('Uventet svar fra Microsoft'); }
  if(!r.ok) throw new Error(d.error_description || d.error || 'Innlogging feilet');
  return d;
}

function lagre(d){
  A.token   = d.access_token;
  A.refresh = d.refresh_token || A.refresh;
  A.expires = Date.now() + (d.expires_in || 3600)*1000 - 60000;
  try{
    localStorage.setItem('fh_cal_auth',
      JSON.stringify({refresh:A.refresh, token:A.token, expires:A.expires}));
  }catch(e){}
}
function hent(){
  try{
    const raw = localStorage.getItem('fh_cal_auth');
    if(!raw) return false;
    const d = JSON.parse(raw);
    A.token = d.token; A.refresh = d.refresh; A.expires = d.expires || 0;
    return !!(A.token || A.refresh);
  }catch(e){ return false; }
}
async function gyldigToken(){
  if(A.token && Date.now() < A.expires) return A.token;
  if(!A.refresh) return null;
  const d = await bytt({grant_type:'refresh_token', refresh_token:A.refresh, scope:CFG.scopes});
  lagre(d);
  return A.token;
}
function loggUt(){
  try{ localStorage.removeItem('fh_cal_auth'); localStorage.removeItem('fh_navn'); localStorage.removeItem('fh_bilde'); sessionStorage.clear(); }catch(_){}
  A.token = null; A.refresh = null; A.me = null; A.expires = 0;
  /* To sesjoner maa avsluttes: Microsoft-kontoen og Cloudflare Access.
     Vi kan ikke sende Microsoft rett til /cdn-cgi/access/logout, for den
     URL-en maa vaere registrert i Azure — er den ikke det, nekter Microsoft
     og Access-sesjonen overlever (da viser toppen feil navn).
     I stedet returnerer vi til vaar egen side, som allerede er registrert,
     og tar Access-utloggingen derfra. Da fungerer det uansett. */
  try{ sessionStorage.setItem('fh_ut', '1'); }catch(_){}
  location.href = 'https://login.microsoftonline.com/common/oauth2/v2.0/logout?post_logout_redirect_uri=' +
    encodeURIComponent(location.origin + location.pathname);
}

/* Andre etappe av utloggingen: rydder Access-sesjonen naar vi er
   tilbake fra Microsoft. Kjoerer foer alt annet paa siden. */
(function fullfoerUtlogging(){
  let flagg = null;
  try{ flagg = sessionStorage.getItem('fh_ut'); }catch(_){}
  if(!flagg) return;
  try{ sessionStorage.removeItem('fh_ut'); }catch(_){}
  location.replace('/cdn-cgi/access/logout');
})();

function portNote(tekst, feil){
  const el = document.getElementById('portNote');
  el.textContent = tekst || '';
  el.className = feil ? 'feil' : '';
  if(tekst){ document.getElementById('port').hidden = false; }
}

function slippInn(){
  const p = document.getElementById('port');
  p.hidden = true;
  p.style.display = 'none';
  const s = document.getElementById('shell');
  s.hidden = false;
  s.style.display = '';
  if(A.me){
    const fullt = A.me.displayName || '';
    document.getElementById('hvem').textContent = fullt || 'Neam';
    /* Samme kilde som bunnteksten — den er riktig hver gang.
       Lagres slik at oppskrifter og handleliste kan bruke den ogsaa,
       siden de ikke selv snakker med Microsoft Graph. */
    if(typeof settToppNavn === 'function') settToppNavn(fullt);
    if(typeof vurderDashFlis === 'function') vurderDashFlis().catch(function(){});
    try{ if(fullt) localStorage.setItem('fh_navn', fullt); }catch(_){}
  }
  start();
}

async function hentMeg(){
  const t = await gyldigToken();
  if(!t) return null;
  const r = await fetch('https://graph.microsoft.com/v1.0/me', {
    headers:{ Authorization: 'Bearer ' + t }
  });
  if(!r.ok) return null;
  return r.json();
}

/* Personlige Microsoft-kontoer kan levere userPrincipalName i «gjeste»-format,
   f.eks. nmidttun_hotmail.com#EXT#@tenant.onmicrosoft.com. Vi av-mangler det
   (siste _ før #EXT# blir @) og sjekker alle formene mot lista. */
function avMangle(upn){
  if(!upn || upn.indexOf('#EXT#') < 0) return null;
  const del = upn.split('#EXT#')[0];      // nmidttun_hotmail.com
  const i = del.lastIndexOf('_');
  if(i < 0) return null;
  return del.slice(0, i) + '@' + del.slice(i + 1);
}
async function sjekkTilgang(){
  A.me = await hentMeg();
  if(!A.me) return false;
  if(!SLIPP_INN.length) return true;
  const kandidater = [
    A.me.userPrincipalName,
    A.me.mail,
    avMangle(A.me.userPrincipalName)
  ].filter(Boolean).map(function(x){ return x.toLowerCase(); });
  const lista = SLIPP_INN.map(function(x){ return x.toLowerCase(); });
  return kandidater.some(function(k){ return lista.indexOf(k) >= 0; });
}

(async function oppstart(){
  const q = new URLSearchParams(location.search);

  if(q.get('error')){
    history.replaceState({}, '', REDIRECT);
    portNote('Microsoft svarte: ' + (q.get('error_description') || q.get('error')), true);
    return;
  }

  if(q.get('code')){
    const verifier = sessionStorage.getItem('fh_verifier');
    const vent     = sessionStorage.getItem('fh_state');
    history.replaceState({}, '', REDIRECT);
    if(!verifier || q.get('state') !== vent){
      portNote('Innloggingen ble avbrutt. Prøv på nytt.', true);
      return;
    }
    try{
      const d = await bytt({
        grant_type:'authorization_code',
        code:q.get('code'),
        code_verifier:verifier,
        scope:CFG.scopes
      });
      lagre(d);
      sessionStorage.removeItem('fh_verifier');
      sessionStorage.removeItem('fh_state');
    }catch(err){
      portNote(err.message, true);
      return;
    }
  } else if(!hent()){
    loggInn();                    /* ingen lagret pålogging — send rett til Microsoft */
    return;
  }

  try{
    if(await sjekkTilgang()){
      slippInn();
    } else {
      loggUt2('Denne kontoen har ikke tilgang.');
    }
  }catch(err){
    loggUt2('Kunne ikke bekrefte pålogging. Logg inn på nytt.');
  }
})();

function loggUt2(melding){
  localStorage.removeItem('fh_cal_auth');
  A.token = null; A.refresh = null; A.me = null; A.expires = 0;
  portNote(melding, true);
}
</script>

<script>
/* Fornavnet under logoen. Kilden er Microsoft Graph, ikke Cloudflare
   Access — Access-sesjonen kan henge igjen som forrige bruker ved
   brukerbytte, mens Graph-navnet er riktig hver gang.
   Graph-navnet hentes i skriptet over og lagres i localStorage. */
/* ---- Dashboard-flisen ----
   Piloten er foreloepig kun for sys, saa flisen skjules for de andre.
   Sperren ligger ogsaa i dashboard.html selv — dette er bare for aa
   slippe aa vise en snarvei folk blir avvist fra. */
/* Hvem som ser dashboard-flisen. Samme liste som i dashboard.html.
   Sys staar igjen ved siden av kitchen: uten den ville en feil paa
   kitchen-kontoen gjort veggskjermen utilgjengelig uten vei inn. */
const DASH_TILGANG = ['kitchen@neam.no', 'sys@neam.no'];

function normEpostDash(s){
  s = String(s || '').toLowerCase().trim();
  const ext = s.indexOf('#ext#');
  if(ext !== -1){
    s = s.slice(0, ext);
    const i = s.lastIndexOf('_');
    if(i !== -1) s = s.slice(0, i) + '@' + s.slice(i + 1);
  }
  return s;
}

async function vurderDashFlis(){
  const kort = document.getElementById('dashKort');
  if(!kort) return;
  let epost = '';
  /* Graph foerst — Access-sesjonen kan henge igjen som forrige bruker. */
  if(A && A.me){
    epost = normEpostDash(A.me.mail || A.me.userPrincipalName || '');
  }
  if(!epost){
    try{
      const r = await fetch('/cdn-cgi/access/get-identity?_=' + Date.now(), {cache:'no-store'});
      if(r.ok){
        const d = await r.json();
        epost = normEpostDash(d.email || '');
      }
    }catch(_){}
  }
  kort.hidden = DASH_TILGANG.indexOf(epost) === -1;
}

function vekslePlanlagte(){
  const rutenett = document.getElementById('apps');
  const knapp = document.getElementById('planlagtKnapp');
  if(!rutenett || !knapp) return;
  const skjult = rutenett.classList.toggle('skjul-planlagte');
  knapp.textContent = skjult ? 'Vis planlagte' : 'Skjul planlagte';
  knapp.setAttribute('aria-expanded', skjult ? 'false' : 'true');
}

function settToppNavn(fulltNavn){
  const el = document.getElementById('innlogget-navn');
  const fornavn = String(fulltNavn || '').trim().split(/\s+/)[0] || '';
  if(el) el.textContent = fornavn;
}

/* Vis et eventuelt lagret navn med en gang, saa det ikke blinker tomt
   mens Graph-kallet paagaar. Overskrives naar det ekte svaret kommer. */
(function(){
  let lagret = null;
  try{ lagret = localStorage.getItem('fh_navn'); }catch(_){}
  if(lagret) settToppNavn(lagret);
})();
</script>
