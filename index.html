<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neam">
<meta name="theme-color" content="#F6F1E7">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="apple-touch-icon" href="/bilder/neam-robot.png">
<title>Neam</title>
<link rel="stylesheet" href="/felles-rot.css?v=5">
<link rel="stylesheet" href="/felles-knapper.css?v=1">
<link rel="stylesheet" href="/felles-dialog.css?v=1">
<link rel="stylesheet" href="/felles-neam.css?v=48">
<!-- Datalaget baerer husregisteret og lastes foer sidens eget skript.
     felles-skjema.js gir avbryt-regelen paa husskjemaet og krever
     felles-dialog.js, som ligger nederst - derfor staar begge to der,
     ikke her. -->
<script src="/felles-data.js?v=3"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  /* Sidespesifikke variabler. Palett og typeskala ligger i
     felles-rot.css. */
  :root{
    /* Loeftet naar en flis peker seg ut. Argumentet til drop-shadow(),
       ikke til box-shadow: flisene har ingen boks lenger, saa skyggen maa
       foelge merkelappens eget omriss. En box-shadow ville tegnet en
       firkant rundt en rund klistremerkeform. */
    --shadow-lift:0 12px 20px rgba(44,62,80,.24);
  }

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}
body{
  font-family:'Archivo',sans-serif;color:var(--ink);
  /* background-attachment:fixed er fjernet 29. august 2026. Bakgrunnen
     er et fast lag (body::before i felles-rot.css), og --side-bakgrunn er
     gjennomsiktig - det er ingenting igjen her aa feste. Regelen var en
     rest fra gradienten, og den peker mot noeyaktig den iOS-fella som
     gjorde at bildelaget maatte lages. */
  background:var(--side-bakgrunn);
  padding:28px 28px calc(28px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;
}
/* Het .shell / #shell til 29. august 2026. Navnet var greit da den var
   alt som fantes paa sida, men «skall» betyr alt tre ting i prosjektet:
   felles-skall.css (app-moensteret med topplinje og faner, som index ikke
   engang laster), kalenderens egen .shell, og hub.html-ramma som kommer i
   7.5 og skal eie identitet og navigasjon.

   Denne er ingen av dem. Den er én av tre visninger paa forsiden, ved
   siden av #port og #huset, og navnet sier naa hva den faktisk er: det du
   ser naar porten er passert. Én av de aatte navnekollisjonene mot
   kalender i kartlegging del 1 er dermed borte. */
#innside{max-width:1180px;margin:0 auto}

/* ---------- Topplinje ---------- */
/* Tre spor med 1fr paa hver side holder merket i midten av linja uansett
   hvor bred klokka blir. Med flex og margin:auto ville klokka dyttet det
   ut av senter. */
.top{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;
  padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px;
}
.brand{grid-column:2;display:flex;align-items:center;justify-content:center;min-width:0}
/* Samme frie ramme som flisene under: merket har eget omriss og egen bunn,
   saa ingen sirkel, luft eller skygge rundt. Navnet staar i selve bildet,
   derfor er teksten ved siden av fjernet - innlogget bruker vises i bunnen.
   Bredden foelger fliseikonene: et fliseikon er 194px paa full skjerm og
   125px paa telefon, og clamp treffer begge endene. Den kan ikke matche
   overalt - mellom 700 og 1000px blir flisene 220-274px fordi rutenettet
   da har faerre kolonner paa samme bredde, og et merke paa 274px i
   topplinja ville tatt over hele skjermen. Der bremser 17vw. */
.brand-icon{width:clamp(120px, 17vw, 195px);height:auto;flex-shrink:0}
.brand-icon img{width:100%;height:auto;display:block}
.clock{grid-column:3;justify-self:end;text-align:right;line-height:1}
/* Font-size er alt klapptavla trenger herfra - kortene maaler seg i em.
   Vekt og tegnavstand haandteres av .fk-reglene i fellesfila. */
.clock-time{ font-size:var(--t-display); }
.clock-date{
  font-size:var(--t-brod);color:var(--ink-soft);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;margin-top:6px;
}


/* ---------- Telefon ----------
   .top er en flex-rad der .brand hadde flex-shrink:0 og aldri ga etter,
   mens klokka er 52px og datoen staar i versaler med luft mellom. Til
   sammen bredere enn en telefonskjerm - derfor startet siden forskjovet. */
@media(max-width:560px){
  .top{gap:10px;padding-bottom:14px;margin-bottom:18px}
  .clock{min-width:0}
  .clock-date{margin-top:3px;letter-spacing:.05em}
  /* Vaerknappen legger seg paa egen linje under merket og klokka. */
  .app-name{letter-spacing:.02em}
  .app-icon{margin-bottom:9px}
}

/* .panel og .panel-note laa her til 29. august 2026. Husregisteret var
   det siste som sto i et kort paa forsiden, og da det flyttet ut til sin
   egen visning ble det ingen paneler igjen - appene ligger rett paa
   bakgrunnen. .panel-head og .panel-title staar fordi overskriftsraden
   over merkene fortsatt bruker dem. */
.panel-head{
  display:flex;align-items:baseline;gap:10px;margin-bottom:16px;
}
.panel-title{
  font-size:var(--t-meta);font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink);
}
/* ---------- Snarveier ---------- */
/* Tre kolonner og tre rader = ni fliser synlig. Resten naas ved aa rulle
   inne i panelet, saa den tiende ikke blir staaende og kikke opp nederst
   paa siden. Fast radhoeyde gjoer at kuttet havner mellom rader. */
.apps{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  grid-auto-rows:auto;gap:16px;
}
/* Med full bredde er det plass til fem per rad, saa alle ti staar framme
   uten aa rulle - og ingen halv flis kikker opp nederst. */
@media(max-width:1000px){ .apps{grid-template-columns:repeat(3,minmax(0,1fr))} }
/* Maa staa ETTER 1000px-regelen for aa vinne. Den gamle toklonners-regelen
   laa foer den og ble overstyrt, saa telefonen fikk tre smale fliser. */
@media(max-width:700px){ .apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px} }
/* Appene ligger uten kort. Overskriftsraden staar da rett paa
   bakgrunnsbildet og trenger litt innrykk for aa flukte med merkene,
   som har 4px luft rundt seg. */
.apper-seksjon{position:relative;margin-bottom:4px}
.apper-seksjon .panel-head{padding:0 4px}
.app{min-width:0}

.app{
  /* Kvadrat: hoeyden foelger bredden. Var 186px fast, som ga en hoey smal
     boks naar kolonnen krympet - og da maatte navnet brekkes i tre. */
  /* INGEN FLATE, INGEN KANT. Merkelappene er tegnet som klistremerker med
     eget omriss og egen skygge, og en boks rundt dem avbryter formen de
     alt har - to rammer utenpaa hverandre. De ligger derfor rett paa
     bakgrunnsbildet, som klistremerker paa en flate. Dette avgjorde
     samtidig fargespoersmaalet: flisflata kunne ikke varmes uten aa
     avsloere at PNG-ene har ugjennomsiktige hjoerner, og naar det ikke er
     noen flate igjen, finnes ikke problemet. */
  aspect-ratio:1;justify-content:center;min-height:0;
  text-decoration:none;color:inherit;
  padding:4px;text-align:center;
  display:flex;flex-direction:column;align-items:center;
  transition:transform .18s ease,filter .18s ease;
}
.app:active{transform:scale(.97)}
@media(hover:hover){.app:hover{transform:translateY(-4px);filter:drop-shadow(var(--shadow-lift))}}
.app-icon{
  width:54%;max-width:110px;aspect-ratio:1;height:auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;margin-bottom:12px;
}
.app-icon img{width:100%;height:auto;display:block}

/* Telefon i landskap: ca. 840x390. Kvadratiske fliser blir da hoeyere enn
   det synlige omraadet. Kvadratet slippes naar hoeyden er knapp, og flisen
   blir bare saa hoey som innholdet krever.
   MERK: denne blokka MAA staa etter .app og .app-icon over. Laa den foer,
   ble den stille overstyrt av dem - lik spesifisitet, siste regel vinner. */
@media(max-height:600px){
  .app{aspect-ratio:auto}
  .app-icon{width:auto;height:54px;max-width:none}
}

/* Fliser der navnet allerede staar i selve merkelappen (NEAM-bildene).
   Etiketten under er fjernet, og bildet fyller flisen i stedet.
   Sirkelklippet er slaatt av her: merkelappene har eget omriss og
   gjennomsiktige hjoerner, og baandet nederst ble kappet av
   border-radius:50% + overflow:hidden.
   MERK: .app.merke (0,2,0) slaar .app inne i mediesporringene over, saa
   dette maa gjentas i en egen mediesporring for lav skjermhoeyde. */
.app.merke .app-icon{
  width:100%;max-width:none;margin-bottom:0;
  border-radius:0;overflow:visible;
}
@media(max-height:600px){
  .app.merke .app-icon{width:auto;height:74px;max-width:100%}
}
.app-name{
  font-size:var(--t-brod);font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;line-height:1.2;
  /* "ARBEIDSOPPGAVER" i versaler med bokstavavstand er bredere enn en
     flis paa telefon. Uten en bryteregel presser ordet rutenettsporet ut
     over skjermkanten, og hele siden starter forskjovet.
     MERK: her sto "overflow-wrap:anywhere", som bryter hvor som helst og
     ogsaa naar det er plass - det ga "NEAM DASH-BOAR D". "break-word"
     bryter bare naar ordet faktisk ikke faar plass, og lar hyphens:auto
     dele paa stavelse foerst (html lang="no" er satt). */
  overflow-wrap:break-word;-webkit-hyphens:manual;hyphens:manual;max-width:100%;
}
.app.soon{opacity:.42}

/* ---------- Planlagte fliser ----------
   De seks flisene som ikke er bygd enda ligger skjult til vanlig, saa de
   ferdige appene faar hele bredden. Bryteren setter en klasse paa rutenettet
   i stedet for hidden-attributtet: .app har display:flex, og det ville
   overstyrt [hidden] stille. */
.apps.skjul-planlagte .app.planlagt{display:none}
.planlagt-knapp{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-etikett);text-transform:uppercase;letter-spacing:.08em;
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;color:var(--ink-soft);cursor:pointer;
}
.planlagt-knapp:active{background:var(--bg-1)}

/* ---------- Hoeyrehaandtaket paa forsiden ----------
   Haandtaket er INNSTILLINGER - det er hvilestillingen, det man ser naar
   ingenting er trykket. Husregisteret ligger inne i femmeren, oppe til
   venstre, og naas naar man aapner den.

   Uten dette baerer baade venstre og hoeyre hjoerne det SAMME robotmerket
   paa forsiden, og skillet «venstre er ut og Neam, hoeyre er her og naa»
   kollapser paa den ene sida der de moetes.

   Overstyres lokalt, ikke i felles-neam.js: en endring der maatte fulgt av
   et nytt ?v-nummer i alle fem HTML-filene, og forsidens merke er
   forsidens sak. Flyttes til skallet den dagen hub.html tar over.

   Uten flate og uten sirkelklipp, som flisene: merket har eget omriss og
   et baand som stikker ut nederst, og en sirkel med overflow:hidden kapper
   baandet. Skyggen foelger da omrisset og ikke en usynlig boks. */
.neam-handtak.eget{
  background:none; box-shadow:none; overflow:visible; border-radius:0;
  align-items:center;
}
.neam-handtak.eget img{ filter:drop-shadow(0 3px 9px rgba(44,62,80,.32)); }
/* Femmergeometrien, doed-regelen og flatefjerningen paa merkeknappene
   laa her til 30. august 2026. Alt tre er flyttet til felles-neam.css i
   samme slengen som femmeren ble en firer - de gjaldt alle fem sidene,
   og laa lokalt bare fordi fellesfila ikke kunne bumpes uten aa roere
   fem HTML-filer. Naa er den bumpet uansett. */

/* ---------- Huset som egen visning ----------
   Registeret laa i et sammenklappet panel paa forsiden. Fem tekstbokser
   som skal fylles i hele setninger fikk da bredden til et panel og
   hoeyden til en sammenklapping - to ting som trekker mot kort tekst,
   akkurat der lang tekst er poenget. Det har naa hele skjermen.

   Visning, ikke egen fil: registeret leses alt overalt gjennom
   felles-data.js og trenger ingen egen rute, og en sjette HTML-fil ville
   vaert ny <head>, nye skripttagger og et nytt femmeroppsett for ett
   skjema. Samme grep som #port, som alt ligger her. */
#huset{
  min-height:100vh; min-height:100dvh;
}
/* Som #port: en display-regel over ville overstyrt [hidden] stille. */
#huset[hidden]{ display:none; }
.hus-topp{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding-bottom:20px; border-bottom:1px solid var(--line); margin-bottom:24px;
}
.hus-tittel{
  font-size:var(--t-stor); font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; line-height:1.2;
}
/* Sammendraget staar her, ikke paa forsiden: det svarer paa «hvor mye er
   igjen», og det spoersmaalet stilles naar man er inne, ikke naar man gaar
   forbi. */
.hus-status{
  font-family:'IBM Plex Mono',monospace; font-size:var(--t-etikett);
  color:var(--ink-soft); letter-spacing:.06em; text-transform:uppercase;
}
.hus-tilbake{
  margin-left:auto; font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-etikett); text-transform:uppercase; letter-spacing:.08em;
  background:none; border:1px solid var(--line); border-radius:999px;
  padding:8px 16px; color:var(--ink-soft); cursor:pointer;
}
.hus-tilbake:active{ background:var(--bg-1); }
/* Kortet er smalere enn skallet. Ei tekstlinje paa 1180px leses ikke -
   oeyet mister igjen starten paa neste linje. */
.hus-kort{
  background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:26px 26px 22px; max-width:760px; margin:0 auto;
}
.hus-ingress{
  font-size:var(--t-meta);color:var(--ink-soft);line-height:1.5;
  margin-bottom:18px;max-width:60ch;
}
.hus-felt{ margin-bottom:16px; }
.hus-felt label{
  display:block;font-size:var(--t-meta);font-weight:600;color:var(--ink);
  margin-bottom:2px;
}
.hus-felt .hjelp{
  display:block;font-size:var(--t-etikett);color:var(--ink-soft);
  margin-bottom:6px;line-height:1.4;
}
/* 16px er et gulv, ikke en smakssak: under det zoomer iOS inn naar
   feltet faar fokus. Samme regel som .field input i skallet. */
.hus-felt textarea{
  /* 110px, ikke 74: feltet er en oppfordring om hvor mye som skal
     skrives, og et lavt felt ber om ett stikkord. */
  width:100%;min-height:110px;resize:vertical;
  padding:11px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:#FFFFFF;color:var(--ink);
  font-family:'Archivo',sans-serif;font-size:16px;line-height:1.5;
  -webkit-user-select:text;user-select:text;
}
.hus-felt textarea:focus{ outline:none;border-color:var(--aksent); }
/* Knappene staar paa rad og deler bredden. .btn-ghost baerer
   width:100% fra felles-knapper.css, saa flex:1 holder dem like. */
.hus-knapper{ display:flex;gap:10px;margin-top:4px; }
.hus-knapper .btn{ flex:1; }
@media(max-width:560px){
  .hus-knapper{ flex-direction:column-reverse; }
}
.app-badge{
  margin-top:6px;font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-etikett);letter-spacing:.08em;color:var(--ink-soft);
  text-transform:uppercase;
}

/* ---------- Innloggingsport ---------- */
#port{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
/* display:flex over overstyrer [hidden], så vi sier det eksplisitt */
#port[hidden]{ display:none; }
#port .kort{
  background:var(--paper);border-radius:20px;padding:44px 30px 38px;
  box-shadow:var(--shadow);text-align:center;max-width:460px;width:100%;
}
#port .ikon{
  width:200px;max-width:60vw;
  margin:0 auto 22px;
  display:flex;align-items:center;justify-content:center;
}
#port .ikon img{width:100%;height:auto;display:block}
#port h1{
  font-size:var(--t-stor);font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;line-height:1.2;
}
#port p{font-size:var(--t-brod);color:var(--ink-soft);line-height:1.6;margin:14px auto 26px}
#port .logginn{
  display:flex;align-items:center;justify-content:center;
  width:58px;height:58px;margin:6px auto 0;
  background:var(--ink);color:#fff;border:none;border-radius:50%;
  cursor:pointer;box-shadow:0 4px 14px rgba(44,62,80,.28);
  transition:transform .12s ease, box-shadow .12s ease;
}
#port .logginn:hover{box-shadow:0 6px 18px rgba(44,62,80,.34)}
#port .logginn:active{transform:scale(.94)}
#port .logginn svg{display:block}
#port small{
  display:block;margin-top:24px;font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-etikett);color:var(--ink-soft);line-height:1.7;
}
#port small.feil{color:var(--danger)}
/* .ut og .refresh laa her til 30. august 2026, sammen med knappene sine i
   footeren. Oppdater og Logg ut bor naa under System i hoeyre firer:
   ingen av dem tilhoerer noen app, og footeren var det eneste stedet paa
   forsiden med knapper etter at panelene forsvant. */
.bruker{
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);
  color:var(--ink-soft);text-align:right;line-height:1.5;
}
.bruker b{display:block;font-family:'Archivo',sans-serif;font-size:var(--t-meta);color:var(--ink);font-weight:700}

footer{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);
}

/* ---------- Laast ramme ----------
   Siden skal ikke kunne dras sidelengs eller zoomes ved uhell.
   Merk: iOS Safari overstyrer user-scalable og slipper knipezoom likevel -
   det som faktisk virker er touch-action mot dobbelttrykk, og 16px i
   skjemafelt saa iOS ikke zoomer inn naar man trykker i dem. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{touch-action:manipulation}
input,select,textarea{font-size:16px}
</style>
</head>
<body>

<div id="port" hidden>
  <div class="kort">
    <div class="ikon"><img src="/bilder/neam-robot.png" alt="NEAM" width="160" height="158"></div>
    <button class="logginn" onclick="loggInn()" aria-label="Logg inn">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
           stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h13"></path>
        <path d="M12 5l7 7-7 7"></path>
      </svg>
    </button>
    <small id="portNote"></small>
  </div>
</div>

<div id="innside" hidden>

  <div class="top">
    <div class="brand">
      <a href="/" class="brand-icon" title="Til Neam" style="display:block;text-decoration:none"><img src="/bilder/merke-neam.png?v=2" alt="Neam" width="256" height="277"></a>
    </div>
    <div class="clock">
      <div class="clock-time" id="clock-time">--:--</div>
      <div class="clock-date" id="clock-date">&nbsp;</div>
    </div>
  </div>

  <section class="apper-seksjon">
      <div class="panel-head">
        <span class="panel-title">Appene</span>
        <button type="button" class="planlagt-knapp" id="planlagtKnapp"
                onclick="vekslePlanlagte()" aria-expanded="false">Vis planlagte</button>
      </div>
      <div class="apps skjul-planlagte" id="apps">
        <a class="app merke" href="dashboard.html" id="dashKort" hidden aria-label="Kjøkken dash">
          <span class="app-icon"><img alt="Kjøkken dash" src="/bilder/merke-kjokken-dash.png?v=2" width="256" height="265"></span>
        </a>
        <a class="app merke" href="emma.html" id="emmaKort" aria-label="Emma dash">
          <span class="app-icon"><img alt="Emma dash" src="/bilder/merke-emma-dash.png?v=2" width="512" height="516"></span>
        </a>
        <a class="app merke" href="oppskrifter.html" aria-label="Matlaging">
          <span class="app-icon"><img alt="Matlaging" src="/bilder/merke-matlaging.png?v=2" width="256" height="270"></span>
        </a>
        <a class="app merke" href="handleliste.html" aria-label="Handleliste">
          <span class="app-icon"><img alt="Handleliste" src="/bilder/merke-handleliste.png?v=2" width="256" height="268"></span>
        </a>
        <a class="app merke" href="kalender.html" aria-label="Kalender">
          <span class="app-icon"><img alt="Kalender" src="/bilder/merke-kalender.png?v=2" width="384" height="384"></span>
        </a>

        <div class="app soon planlagt">
          <span class="app-icon"><img src="/bilder/flis-kvitteringer.png" alt="" width="256" height="256"></span>
          <span class="app-name">Kvitte&shy;ringer</span>
          <span class="app-badge">Kommer</span>
        </div>
        <!-- Merkeform, ikke flisform: merket baerer navnet sitt selv, og en
             app-name under det ville sagt «Økonomi» to ganger. «Kommer»

<script>
/* ============================================================
   Innlogging — samme Azure-app og samme lagring som kalenderen,
   slik at én pålogging gjelder alle sidene på dette domenet.
   ============================================================ */
const CFG = {
  clientId : 'ccab6959-abc2-4d09-9212-4b33c0db025c',
  authority: 'common',
  scopes   : 'openid profile offline_access User.Read Calendars.Read Calendars.ReadWrite'
};
const REDIRECT  = location.origin + location.pathname;
const AUTH_BASE = 'https://login.microsoftonline.com/' + CFG.authority + '/oauth2/v2.0';

/* Godkjent-liste. Tom liste = alle Microsoft-kontoer slipper inn.
   Med adresser her stoppes alle andre ved porten (403). */
const SLIPP_INN = [
  'magne@neam.no',
  'nina@neam.no',
  'nmidttun@hotmail.com',
  'emma@neam.no',
  'andrea@neam.no',
  'kitchen@neam.no',
  'sys@neam.no'
];

const A = { token:null, refresh:null, expires:0, me:null };

function randStr(n){
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return Array.from(a, b => ('0'+b.toString(16)).slice(-2)).join('');
}
async function challenge(v){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function loggInn(){
  const verifier = randStr(48), stateTok = randStr(8);
  sessionStorage.setItem('fh_verifier', verifier);
  sessionStorage.setItem('fh_state', stateTok);
  const p = new URLSearchParams({
    client_id: CFG.clientId,
    response_type: 'code',
    redirect_uri: REDIRECT,
    response_mode: 'query',
    scope: CFG.scopes,
    state: stateTok,
    code_challenge: await challenge(verifier),
    code_challenge_method: 'S256'
  });
  location.href = AUTH_BASE + '/authorize?' + p;
}

async function bytt(body){
  const base = { client_id: CFG.clientId, redirect_uri: REDIRECT };
  for(const k in body) base[k] = body[k];
  const r = await fetch(AUTH_BASE + '/token', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams(base)
  });
  const txt = await r.text();
  let d;
  try{ d = JSON.parse(txt); }catch(e){ throw new Error('Uventet svar fra Microsoft'); }
  if(!r.ok) throw new Error(d.error_description || d.error || 'Innlogging feilet');
  return d;
}

function lagre(d){
  A.token   = d.access_token;
  A.refresh = d.refresh_token || A.refresh;
  A.expires = Date.now() + (d.expires_in || 3600)*1000 - 60000;
  try{
    localStorage.setItem('fh_cal_auth',
      JSON.stringify({refresh:A.refresh, token:A.token, expires:A.expires}));
  }catch(e){}
}
function hent(){
  try{
    const raw = localStorage.getItem('fh_cal_auth');
    if(!raw) return false;
    const d = JSON.parse(raw);
    A.token = d.token; A.refresh = d.refresh; A.expires = d.expires || 0;
    return !!(A.token || A.refresh);
  }catch(e){ return false; }
}
async function gyldigToken(){
  if(A.token && Date.now() < A.expires) return A.token;
  if(!A.refresh) return null;
  const d = await bytt({grant_type:'refresh_token', refresh_token:A.refresh, scope:CFG.scopes});
  lagre(d);
  return A.token;
}
function loggUt(){
  try{ localStorage.removeItem('fh_cal_auth'); localStorage.removeItem('fh_navn'); localStorage.removeItem('fh_bilde'); sessionStorage.clear(); }catch(_){}
  A.token = null; A.refresh = null; A.me = null; A.expires = 0;
  /* To sesjoner maa avsluttes: Microsoft-kontoen og Cloudflare Access.
     Vi kan ikke sende Microsoft rett til /cdn-cgi/access/logout, for den
     URL-en maa vaere registrert i Azure — er den ikke det, nekter Microsoft
     og Access-sesjonen overlever (da viser toppen feil navn).
     I stedet returnerer vi til vaar egen side, som allerede er registrert,
     og tar Access-utloggingen derfra. Da fungerer det uansett. */
  try{ sessionStorage.setItem('fh_ut', '1'); }catch(_){}
  location.href = 'https://login.microsoftonline.com/common/oauth2/v2.0/logout?post_logout_redirect_uri=' +
    encodeURIComponent(location.origin + location.pathname);
}

/* Andre etappe av utloggingen: rydder Access-sesjonen naar vi er
   tilbake fra Microsoft. Kjoerer foer alt annet paa siden. */
(function fullfoerUtlogging(){
  let flagg = null;
  try{ flagg = sessionStorage.getItem('fh_ut'); }catch(_){}
  if(!flagg) return;
  try{ sessionStorage.removeItem('fh_ut'); }catch(_){}
  location.replace('/cdn-cgi/access/logout');
})();

function portNote(tekst, feil){
  const el = document.getElementById('portNote');
  el.textContent = tekst || '';
  el.className = feil ? 'feil' : '';
  if(tekst){ document.getElementById('port').hidden = false; }
}

function slippInn(){
  const p = document.getElementById('port');
  p.hidden = true;
  p.style.display = 'none';
  const s = document.getElementById('innside');
  s.hidden = false;
  s.style.display = '';
  if(A.me){
    const fullt = A.me.displayName || '';
    document.getElementById('hvem').textContent = fullt || 'Neam';
    /* Samme kilde som bunnteksten — den er riktig hver gang.
       Lagres slik at oppskrifter og handleliste kan bruke den ogsaa,
       siden de ikke selv snakker med Microsoft Graph. */
    if(typeof vurderDashFlis === 'function') vurderDashFlis().catch(function(){});
    try{ if(fullt) localStorage.setItem('fh_navn', fullt); }catch(_){}
  }
  start();
}

async function hentMeg(){
  const t = await gyldigToken();
  if(!t) return null;
  const r = await fetch('https://graph.microsoft.com/v1.0/me', {
    headers:{ Authorization: 'Bearer ' + t }
  });
  if(!r.ok) return null;
  return r.json();
}

/* Personlige Microsoft-kontoer kan levere userPrincipalName i «gjeste»-format,
   f.eks. nmidttun_hotmail.com#EXT#@tenant.onmicrosoft.com. Vi av-mangler det
   (siste _ før #EXT# blir @) og sjekker alle formene mot lista. */
function avMangle(upn){
  if(!upn || upn.indexOf('#EXT#') < 0) return null;
  const del = upn.split('#EXT#')[0];      // nmidttun_hotmail.com
  const i = del.lastIndexOf('_');
  if(i < 0) return null;
  return del.slice(0, i) + '@' + del.slice(i + 1);
}
async function sjekkTilgang(){
  A.me = await hentMeg();
  if(!A.me) return false;
  if(!SLIPP_INN.length) return true;
  const kandidater = [
    A.me.userPrincipalName,
    A.me.mail,
    avMangle(A.me.userPrincipalName)
  ].filter(Boolean).map(function(x){ return x.toLowerCase(); });
  const lista = SLIPP_INN.map(function(x){ return x.toLowerCase(); });
  return kandidater.some(function(k){ return lista.indexOf(k) >= 0; });
}

(async function oppstart(){
  const q = new URLSearchParams(location.search);

  if(q.get('error')){
    history.replaceState({}, '', REDIRECT);
    portNote('Microsoft svarte: ' + (q.get('error_description') || q.get('error')), true);
    return;
  }

  if(q.get('code')){
    const verifier = sessionStorage.getItem('fh_verifier');
    const vent     = sessionStorage.getItem('fh_state');
    history.replaceState({}, '', REDIRECT);
    if(!verifier || q.get('state') !== vent){
      portNote('Innloggingen ble avbrutt. Prøv på nytt.', true);
      return;
    }
    try{
      const d = await bytt({
        grant_type:'authorization_code',
        code:q.get('code'),
        code_verifier:verifier,
        scope:CFG.scopes
      });
      lagre(d);
      sessionStorage.removeItem('fh_verifier');
      sessionStorage.removeItem('fh_state');
    }catch(err){
      portNote(err.message, true);
      return;
    }
  } else if(!hent()){
    loggInn();                    /* ingen lagret pålogging — send rett til Microsoft */
    return;
  }

  try{
    if(await sjekkTilgang()){
      slippInn();
    } else {
      loggUt2('Denne kontoen har ikke tilgang.');
    }
  }catch(err){
    loggUt2('Kunne ikke bekrefte pålogging. Logg inn på nytt.');
  }
})();

function loggUt2(melding){
  localStorage.removeItem('fh_cal_auth');
  A.token = null; A.refresh = null; A.me = null; A.expires = 0;
  portNote(melding, true);
}
</script>

<script>
/* ====== Klokke ====== */
const DAGER = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MND = ['januar','februar','mars','april','mai','juni',
             'juli','august','september','oktober','november','desember'];

/* Vaermeldingen ligger sammenslaatt. Trykk paa temperaturen i toppen
   aapner den, trykk igjen lukker. */
function tegnKlokke(){
  const n = new Date();
  /* Klapptavla bygger og flipper seg selv - se neamFlipKlokke i
     felles-neam.js. Stoerrelsen arves fra .clock-time sin font-size. */
  neamFlipKlokke(document.getElementById('clock-time'));
  document.getElementById('clock-date').textContent =
    DAGER[n.getDay()] + ' ' + n.getDate() + '. ' + MND[n.getMonth()];
}
/* startes av start() etter innlogging */

/* ====== Startes når innloggingen er bekreftet ====== */
let startet = false;
function start(){
  if(startet) return;
  startet = true;
  tegnKlokke();
  setInterval(tegnKlokke, 10000);
  /* Herfra, ikke fra en egen oppstart nederst: Huset skal aapnes FOERST
     naar porten er passert. start() kalles av slippInn(), og de tre
     skriptblokkene er ferdig lastet lenge foer det - oppstart() venter paa
     et Graph-kall. */
  if(typeof husFraUrl === 'function') husFraUrl();
}

/* hent på nytt når skjermen vekkes */
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && startet){ tegnKlokke(); }
});
</script>
<script>
/* Fornavnet under logoen. Kilden er Microsoft Graph, ikke Cloudflare
   Access — Access-sesjonen kan henge igjen som forrige bruker ved
   brukerbytte, mens Graph-navnet er riktig hver gang.
   Graph-navnet hentes i skriptet over og lagres i localStorage. */
/* ---- Dashboard-flisen ----
   Piloten er foreloepig kun for sys, saa flisen skjules for de andre.
   Sperren ligger ogsaa i dashboard.html selv — dette er bare for aa
   slippe aa vise en snarvei folk blir avvist fra. */
/* Hvem som ser dashboard-flisen. Samme liste som i dashboard.html.
   Sys staar igjen ved siden av kitchen: uten den ville en feil paa
   kitchen-kontoen gjort veggskjermen utilgjengelig uten vei inn. */
const DASH_TILGANG = ['kitchen@neam.no', 'sys@neam.no'];

/* Emma dash har med vilje INGEN liste her. Flisen staar aapen for alle
   inntil videre - tilgangsstyringen kommer senere.

   Den ekte sperren ligger uansett i emma.html og er uroert: aapner
   Andrea flisen, blir hun avvist i porten der. Det som mangler her er
   bare hoefligheten i aa slippe aa vise en snarvei man blir avvist fra,
   slik dashboard-flisen gjoer.

   Skal den lukkes: legg tilbake `hidden` paa #emmaKort, sett opp en
   EMMA_TILGANG med de samme fire adressene som i emma.html, og gi
   vurderDashFlis() linja si tilbake. */

function normEpostDash(s){
  s = String(s || '').toLowerCase().trim();
  const ext = s.indexOf('#ext#');
  if(ext !== -1){
    s = s.slice(0, ext);
    const i = s.lastIndexOf('_');
    if(i !== -1) s = s.slice(0, i) + '@' + s.slice(i + 1);
  }
  return s;
}

/* Hvem som er logget inn. Graph foerst — Access-sesjonen kan henge igjen
   som forrige bruker ved brukerbytte, mens Graph-navnet er riktig hver
   gang. Ett oppslag for begge flisene: to kall til get-identity for aa
   svare paa det samme spoersmaalet er ett for mye. */
async function innloggetEpost(){
  if(A && A.me){
    const e = normEpostDash(A.me.mail || A.me.userPrincipalName || '');
    if(e) return e;
  }
  try{
    const r = await fetch('/cdn-cgi/access/get-identity?_=' + Date.now(), {cache:'no-store'});
    if(r.ok){
      const d = await r.json();
      return normEpostDash(d.email || '');
    }
  }catch(_){}
  return '';
}

async function vurderDashFlis(){
  const dash = document.getElementById('dashKort');
  if(!dash) return;
  const epost = await innloggetEpost();
  if(dash) dash.hidden = DASH_TILGANG.indexOf(epost) === -1;
}

function vekslePlanlagte(){
  const rutenett = document.getElementById('apps');
  const knapp = document.getElementById('planlagtKnapp');
  if(!rutenett || !knapp) return;
  const skjult = rutenett.classList.toggle('skjul-planlagte');
  knapp.textContent = skjult ? 'Vis planlagte' : 'Skjul planlagte';
  knapp.setAttribute('aria-expanded', skjult ? 'false' : 'true');
}

/* ============================================================
   Husregisteret
   ------------------------------------------------------------
   Skjemaet bor her fordi registeret ikke tilhoerer noen app.
   Lesing, skriving og selve teksten Neam faar ligger i
   felles-data.js - denne blokka er bare flate.
   ============================================================ */

function husTegn(reg){
  const boks = document.getElementById('husFelter');
  if(!boks) return;
  boks.innerHTML = '';
  HUS_BOLKER.forEach(function(b){
    const rad = document.createElement('div');
    rad.className = 'hus-felt';

    const merkelapp = document.createElement('label');
    merkelapp.setAttribute('for', 'hus-' + b.id);
    merkelapp.textContent = b.ledetekst;

    const hjelp = document.createElement('small');
    hjelp.className = 'hjelp';
    hjelp.textContent = b.forklaring;

    const felt = document.createElement('textarea');
    felt.id = 'hus-' + b.id;
    felt.rows = 3;
    felt.value = String((reg && reg[b.id]) || '');

    rad.appendChild(merkelapp);
    rad.appendChild(hjelp);
    rad.appendChild(felt);
    boks.appendChild(rad);
  });
}

/* Sammendraget staar der ogsaa naar panelet er lukket. Et tomt
   register som ikke sier fra at det er tomt, blir aldri fylt ut. */
function husSammendrag(reg){
  const el = document.getElementById('husNote');
  if(!el) return;
  const fylt = HUS_BOLKER.filter(function(b){
    return String((reg && reg[b.id]) || '').trim();
  }).length;
  el.textContent = fylt ? (fylt + ' av ' + HUS_BOLKER.length + ' utfylt')
                        : 'ikke satt opp';
}

/* Aapner visningen. Feltene fylles foer den vises, ikke etter: et skjema
   som staar tomt et halvsekund og saa fyller seg selv ser ut som om noe
   ble skrevet inn av seg selv. */
async function aapneHus(){
  const hus   = document.getElementById('huset');
  const skall = document.getElementById('innside');
  if(!hus || !hus.hidden) return;

  let reg = {};
  try{ reg = await lesHusregister(true); }
  catch(e){ /* lesHusregister svelger selv - dette er bare en vakt */ }

  husTegn(reg);
  husSammendrag(reg);
  if(skall) skall.hidden = true;
  hus.hidden = false;
  husHandtak(true);
  window.scrollTo(0, 0);

  /* Avtrykket tas ETTER at feltene er fylt, ellers ser avbryt-regelen
     utfyllingen som en endring brukeren har gjort. */
  huskSkjema('husSkjema');

  /* Egen historikkoppfoering, saa tilbakeknappen gaar til forsiden og ikke
     ut av Neam. Samme moenster som visningene i oppskrifter og
     handleliste. */
  if(!(history.state && history.state.huset)){
    history.pushState({huset:1}, '', '?huset');
    husPushet = true;
  }
}

/* Sant bare naar VI la inn oppfoeringen. Kom man rett inn paa
   index.html?huset, finnes det ingenting bak - og et history.back() der
   ville tatt brukeren UT av Neam i stedet for til forsiden. */
let husPushet = false;

/* Skjuler uten aa spoerre og uten aa roere historikken. Brukes baade av
   lukkHus() og av popstate, som har ryddet historikken selv. */
function husLukkNa(){
  const hus   = document.getElementById('huset');
  const skall = document.getElementById('innside');
  if(hus)   hus.hidden = true;
  if(skall) skall.hidden = false;
  husHandtak(false);
}

/* Avbryt spoer bare naar noe faktisk er skrevet siden visningen ble
   aapnet - avbryt-regelen. */
async function lukkHus(){
  await avbrytSkjema('husSkjema', function(){
    if(husPushet){
      husPushet = false;
      /* back() utloeser popstate, som gjoer selve skjulingen. */
      history.back();
    }else{
      husLukkNa();
      history.replaceState({}, '', location.pathname);
    }
  });
}

/* Nettleserens tilbakeknapp kan ikke stoppes for en bekreftelse, saa den
   lukker uten aa spoerre. Det er en bevisst luke i avbryt-regelen: alt
   annet er verre - enten en dialog som kommer etter at sida alt har
   gaatt, eller en historikk som ikke virker. */
window.addEventListener('popstate', function(){
  const hus = document.getElementById('huset');
  if(!hus) return;
  if(!hus.hidden){
    husPushet = false;
    husLukkNa();
  }else if(history.state && history.state.huset){
    /* Fram-knappen. Oppfoeringen finnes alt, saa aapneHus() pusher ikke. */
    aapneHus();
  }
});

/* index.html?huset gaar rett inn. Kalles fra start(), altsaa etter porten. */
function husFraUrl(){
  if(!new URLSearchParams(location.search).has('huset')) return;
  /* Merk oppfoeringen som finnes fra foer i stedet for aa legge til en ny.
     Uten dette ville ?huset staatt to ganger i historikken, og foerste
     tilbaketrykk hadde lukket visningen uten aa endre adressen. */
  history.replaceState({huset:1}, '', location.pathname + '?huset');
  aapneHus();
}

async function lagreHus(){
  const knapp = document.getElementById('husLagre');
  if(!knapp || knapp.disabled) return;
  const reg = {};
  HUS_BOLKER.forEach(function(b){
    const felt = document.getElementById('hus-' + b.id);
    reg[b.id] = felt ? felt.value : '';
  });

  knapp.disabled = true;
  const foer = knapp.textContent;
  knapp.textContent = 'Lagrer …';
  try{
    const lagret = await skrivHusregister(reg);
    husSammendrag(lagret);
    /* Avtrykket settes paa nytt, ellers spoer Avbryt om noe som alt
       er lagret. */
    huskSkjema('husSkjema');
    /* Visningen blir staaende. Aa kastes ut til forsiden i det man lagrer
       gjoer det umulig aa fylle ut to bolker etter hverandre, og lagring
       er ikke det samme som «ferdig». */
  }catch(e){
    console.warn('Fikk ikke lagret husregisteret:', e);
    varsle('Fikk ikke lagret husregisteret. Prøv igjen om litt.');
  }
  knapp.disabled = false;
  knapp.textContent = foer;
}

/* Oppstartssjekk. En vakt som `if(!el) return;` hopper stille over hele
   jobben naar et element mangler, og feilsoekingen gaar da i feil
   retning i flere runder. Fem linjer, gratis. */
['huset','husSkjema','husFelter','husNote','husLagre'].forEach(function(id){
  if(!document.getElementById(id)) console.warn('Mangler:', id);
});

/* Sammendraget skal staa der med en gang, ikke foerst naar noen
   trykker Rediger. */
(async function(){
  try{ husSammendrag(await lesHusregister()); }
  catch(e){ husSammendrag({}); }
})();

/* ---- Det Neam vet naar han staar her ----
   Forsiden eier bare husregisteret. Leseverktoeyene er de samme som
   paa de fire andre sidene - «les overalt, skriv der du staar». */
window.neamBakgrunn = async function(){
  const hus = await husregisterTekst();
  const om =
    'FORSIDEN er inngangen til Neam - en meny over appene, ikke en app selv. '
  + 'Herfra finnes Kjøkken dash, Matlaging, Handleliste og Kalender. '
  + 'Husregisteret redigeres her, i panelet «Huset».\n\n'
  + 'FORSIDEN EIER INGENTING ANNET. Du kan lese hele huset herfra, men skal '
  + 'noe endres, hører det hjemme i en app - si hvilken, så går brukeren dit.';
  return (hus ? (om + '\n\n' + hus) : om) + '\n\n' + HUS_BAKGRUNN;
};

/* ---- Hoeyrehaandtaket ----
   Bygges av felles-neam.js nederst i body, altsaa etter denne blokka.
   DOMContentLoaded fyrer etter alle synkrone skript, saa haandtaket
   finnes garantert naar vi tar over det. */
/* ?v paa bildestien, ikke bare paa CSS og JS. Merkene ble rettet uten at
   filnavnet endret seg, og nettleseren serverte da den gamle versjonen fra
   cache - samme felle som brente versjonsnumrene for fellesfilene. Bumpes
   naar bildet endres. */
const MERKE_INNSTILLINGER = '/bilder/merke-innstillinger.png?v=3';
const MERKE_HUSREGISTER   = '/bilder/merke-husregister.png?v=3';
const MERKE_AVBRYT        = '/bilder/merke-avbryt.png?v=3';

function husHandtak(inne){
  /* Midtknappen er borte med fireren - haandtaket ER den, og blir
     staaende naar menyen aapnes. */
  const h = document.getElementById('neamSideHandtak');
  if(!h) return;
  h.classList.add('eget');
  if(inne){
    h.innerHTML = '<img src="' + MERKE_AVBRYT + '" alt="">';
    h.onclick = lukkHus;
    h.title = 'Avbryt';
    h.setAttribute('aria-label', 'Lukk huset');
  }else{
    h.innerHTML = '<img src="' + MERKE_INNSTILLINGER + '" alt="">';
    h.onclick = neamSideFirer;
    h.title = 'Innstillinger';
    h.setAttribute('aria-label', 'Innstillinger - handlinger');
  }
}
document.addEventListener('DOMContentLoaded', function(){ husHandtak(false); });

/* ---- Sidas egne handlinger: hoeyrefemmeren ----
   Forsiden eier huset, og det er den ene handlingen som hoerer hjemme
   her. De tre andre plassene staar ledige inntil videre - de tegnes
   dempet og sier fra at de er tomme, som paa de andre sidene.

   Settet hentes ved hver aapning, saa knappen betyr det den skal der du
   staar: «Huset» fra forsiden, «Lukk huset» naar du alt er inne. */
window.neamSideHandlinger = function(){
  return [
    { plass:'opp', navn:'Husregisteret', merke:true,
      ikon:'<img src="' + MERKE_HUSREGISTER + '" alt="">',
      gjor: aapneHus },

    /* System rommer flere ting og gjoer ingenting selv. Oppdater og Logg
       ut laa i footeren til 30. august 2026; de hoerer hjemme her fordi
       ingen av dem tilhoerer noen app - de er huset, ikke innholdet.
       To trykk for aa logge ut er dessuten riktig vekting: paa en iPad
       flere deler, skal det ikke skje ved et uhell. */
    { plass:'ved', navn:'System', behold:true,
      ikon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
         + '<rect x="3" y="4" width="18" height="12" rx="2"/>'
         + '<path d="M8 20h8M12 16v4"/></svg>',
      gjor: function(){
        neamSideStabel('ved', [
          { navn:'Oppdater',
            ikon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
               + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
               + '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>',
            gjor: function(){ location.reload(); } },
          { navn:'Logg ut',
            ikon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
               + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
               + '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/>'
               + '<path d="M10 17l-5-5 5-5M5 12h10"/></svg>',
            gjor: loggUt }
        ]);
      } }
  ];
};

/* ---- Husets leseverktoey ----
   Ligger i felles-data.js og er identiske paa alle fem sidene. */
window.neamVerktoy = async function(){
  return HUS_VERKTOY.slice();
};

window.neamUtfor = async function(navn, arg){
  const hus = await husUtfor(navn, arg);
  if(hus) return hus.svar;
  throw new Error('Ukjent verktøy: ' + navn);
};
