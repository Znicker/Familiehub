  --shadow-lift:0 14px 30px rgba(44,62,80,.16);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%}
body{
  font-family:'Archivo',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg-1),var(--bg-2));
  background-attachment:fixed;
  padding:28px 28px calc(28px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;
}
.shell{max-width:1180px;margin:0 auto}

/* ---------- Topplinje ---------- */
.top{
  display:flex;align-items:center;gap:18px;
  padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px;
}
.brand{display:flex;align-items:center;gap:14px;flex-shrink:0}
.brand-icon{
  width:64px;height:64px;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:9px;
  box-shadow:0 3px 12px rgba(0,0,0,.26);
}
.brand-icon img{width:100%;height:auto;display:block}
.brand-title{
  font-size:22.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:.05em;line-height:1.2;
}
.brand-sub{
  font-size:13px;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.1em;font-weight:600;margin-top:2px;
}
.clock{margin-left:auto;text-align:right;line-height:1}
.clock-time{
  font-size:52px;font-weight:800;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.clock-date{
  font-size:15px;color:var(--ink-soft);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;margin-top:6px;
}

/* ---------- Rutenett ---------- */
.grid{display:grid;grid-template-columns:2fr 1fr;gap:22px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}

.panel{
  background:var(--paper);border-radius:18px;padding:22px;
  box-shadow:var(--shadow);
}
.panel-head{
  display:flex;align-items:baseline;gap:10px;margin-bottom:16px;
}
.panel-title{
  font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;color:var(--ink-soft);
}
.panel-note{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--ink-soft);opacity:.75;
}

/* ---------- Snarveier ---------- */
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.app{
  text-decoration:none;color:inherit;background:var(--bg-2);
  border:1px solid var(--line);border-radius:16px;
  padding:22px 14px 18px;text-align:center;
  display:flex;flex-direction:column;align-items:center;
  transition:transform .18s ease,box-shadow .18s ease;
}
.app:active{transform:scale(.97)}
@media(hover:hover){.app:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}}
.app-icon{
  width:82px;height:82px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;margin-bottom:12px;
}
.app-icon img{width:100%;height:auto;display:block}
.app-name{
  font-size:17px;font-weight:800;text-transform:uppercase;
  letter-spacing:.05em;line-height:1.2;
}
.app.soon{opacity:.42}
.app-badge{
  margin-top:6px;font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:.08em;color:var(--ink-soft);
  text-transform:uppercase;
}

/* ---------- Vær ---------- */
.wx-now{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.wx-icon{font-size:52px;line-height:1}
.wx-temp{font-size:46px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wx-desc{font-size:15px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.wx-meta{
  display:flex;gap:18px;flex-wrap:wrap;
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
  padding:12px 0 4px;
}
.wx-hours{
  display:flex;gap:6px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line);overflow-x:auto;
}
.wx-h{flex:1;min-width:52px;text-align:center}
.wx-h-t{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft)}
.wx-h-i{font-size:22px;line-height:1.5}
.wx-h-d{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.wx-days{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.wx-d{
  display:flex;align-items:center;gap:12px;padding:7px 0;
  font-size:14px;
}
.wx-d + .wx-d{border-top:1px solid var(--line)}
.wx-d-name{width:44px;font-weight:700;text-transform:capitalize}
.wx-d-i{font-size:20px;width:28px}
.wx-d-r{
  margin-left:auto;font-family:'IBM Plex Mono',monospace;
  font-size:12px;color:var(--ink-soft);
}
.wx-d-t{font-variant-numeric:tabular-nums;font-weight:600;min-width:70px;text-align:right}
.wx-d-t span{color:var(--ink-soft);font-weight:500}

.msg{font-size:14px;color:var(--ink-soft);padding:8px 0;line-height:1.5}
.msg.err{color:#B4443A}

/* ---------- Bunn ---------- */
footer{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);
}
.refresh{
  margin-left:auto;font-family:inherit;font-size:11px;
  background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;color:var(--ink-soft);cursor:pointer;
}
.refresh:active{background:var(--bg-1)}
</style>
</head>

/* ====== Klokke ====== */
const DAGER = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MND = ['januar','februar','mars','april','mai','juni',
             'juli','august','september','oktober','november','desember'];

function tegnKlokke(){
  const n = new Date();
  document.getElementById('clock-time').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  document.getElementById('clock-date').textContent =
    DAGER[n.getDay()] + ' ' + n.getDate() + '. ' + MND[n.getMonth()];
}
tegnKlokke();
setInterval(tegnKlokke, 10000);

/* ====== Værkoder (WMO) ====== */
const WMO = {
  0:['☀️','Klarvær'], 1:['🌤️','Stort sett klart'], 2:['⛅','Delvis skyet'], 3:['☁️','Skyet'],
  45:['🌫️','Tåke'], 48:['🌫️','Rimtåke'],
  51:['🌦️','Lett yr'], 53:['🌦️','Yr'], 55:['🌧️','Kraftig yr'],
  56:['🌧️','Underkjølt yr'], 57:['🌧️','Underkjølt yr'],
  61:['🌦️','Lett regn'], 63:['🌧️','Regn'], 65:['🌧️','Kraftig regn'],
  66:['🌧️','Underkjølt regn'], 67:['🌧️','Underkjølt regn'],
  71:['🌨️','Lett snø'], 73:['🌨️','Snø'], 75:['❄️','Kraftig snø'], 77:['🌨️','Snøkorn'],
  80:['🌦️','Regnbyger'], 81:['🌧️','Regnbyger'], 82:['⛈️','Kraftige byger'],
  85:['🌨️','Snøbyger'], 86:['❄️','Kraftige snøbyger'],
  95:['⛈️','Torden'], 96:['⛈️','Torden med hagl'], 99:['⛈️','Kraftig torden']
};
const kode = c => WMO[c] || ['🌡️','—'];
const rund = v => Math.round(v);

/* ====== Vær ====== */
async function hentVaer(){
  const boks = document.getElementById('wx');
  const url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + STED.lat + '&longitude=' + STED.lon
    + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m'
    + '&hourly=temperature_2m,weather_code'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum'
    + '&timezone=Europe%2FOslo&forecast_days=5';

  try {
    const svar = await fetch(url);
    if(!svar.ok) throw new Error('HTTP ' + svar.status);
    const d = await svar.json();

    const n = d.current;
    const [ikon, tekst] = kode(n.weather_code);

    /* neste timer */
    const naa = new Date();
    let start = d.hourly.time.findIndex(t => new Date(t) > naa);
    if(start < 0) start = 0;
    let timer = '';
    for(let i = start; i < start + 6 && i < d.hourly.time.length; i++){
      const t = new Date(d.hourly.time[i]);
      timer += '<div class="wx-h">'
        + '<div class="wx-h-t">' + String(t.getHours()).padStart(2,'0') + '</div>'
        + '<div class="wx-h-i">' + kode(d.hourly.weather_code[i])[0] + '</div>'
        + '<div class="wx-h-d">' + rund(d.hourly.temperature_2m[i]) + '°</div>'
        + '</div>';
    }

    /* dager */
    let dager = '';
    for(let i = 1; i < d.daily.time.length; i++){
      const dt = new Date(d.daily.time[i]);
      const regn = d.daily.precipitation_sum[i];
      dager += '<div class="wx-d">'
        + '<span class="wx-d-name">' + DAGER[dt.getDay()].slice(0,3) + '</span>'
        + '<span class="wx-d-i">' + kode(d.daily.weather_code[i])[0] + '</span>'
        + '<span class="wx-d-r">' + (regn > 0.05 ? regn.toFixed(1).replace('.',',') + ' mm' : '') + '</span>'
        + '<span class="wx-d-t">' + rund(d.daily.temperature_2m_max[i]) + '° '
        + '<span>' + rund(d.daily.temperature_2m_min[i]) + '°</span></span>'
        + '</div>';
    }

    boks.innerHTML =
      '<div class="wx-now">'
        + '<span class="wx-icon">' + ikon + '</span>'
        + '<div><div class="wx-temp">' + rund(n.temperature_2m) + '°</div>'
        + '<div class="wx-desc">' + tekst + '</div></div>'
      + '</div>'
      + '<div class="wx-meta">'
        + '<span>Føles som ' + rund(n.apparent_temperature) + '°</span>'
        + '<span>Vind ' + rund(n.wind_speed_10m) + ' km/t</span>'
        + '<span>Fukt ' + n.relative_humidity_2m + ' %</span>'
      + '</div>'
      + '<div class="wx-hours">' + timer + '</div>'
      + '<div class="wx-days">' + dager + '</div>';

    const o = new Date();
    document.getElementById('wx-updated').textContent =
      'vær oppdatert ' + String(o.getHours()).padStart(2,'0') + ':' + String(o.getMinutes()).padStart(2,'0');

  } catch(e){
    boks.innerHTML = '<div class="msg err">Fikk ikke tak i været.<br>' + e.message + '</div>';
  }
}

hentVaer();
setInterval(hentVaer, OPPDATER_MIN * 60 * 1000);

/* hent på nytt når skjermen vekkes */
document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ tegnKlokke(); hentVaer(); }
});
</script>
</body>
</html>
