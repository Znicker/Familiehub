<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Familie Hub">
<meta name="theme-color" content="#F5F5F5">
<meta name="robots" content="noindex, nofollow">
<title>Familie Hub – Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ---------- Typeskala ----------
     Fem roller for tekst. Endre stoerrelsene HER, ikke nede i reglene.
     Modus foelger skjermbredden av seg selv:
       mobil  < 700px   kjapt, on the go
       iPad   700-1300  display og betjening, leses paa avstand
       PC     > 1300    oversikt, taaler tett informasjon
     Ikoner og piler er glyffer, ikke tekst, og har egen skala. */
  --t-etikett:11px;
  --t-meta:13px;
  --t-brod:15px;
  --t-stor:20px;
  --t-display:46px;
  --t-dagsnavn:18px;
  --t-pil:20px;
  --t-ikon:28px;

  --ink:#2C3E50;
  --ink-soft:#7A8899;
  --paper:#FFFFFF;
  --line:#E4E8EC;
  --lime:#C8E64B;
  --blaa:#4A7FA8;
}

/* iPad: leses paa avstand, alt et hakk opp */
@media(min-width:700px){
  :root{
    --t-etikett:12px; --t-meta:14px; --t-brod:17px; --t-stor:22px;
    --t-display:60px; --t-dagsnavn:22px; --t-pil:22px; --t-ikon:32px;
  }
}
/* PC: naert oeye, taaler tett informasjon - tilbake til mobilskalaen,
   men klokka blir staaende stor. */
@media(min-width:1300px){
  :root{
    --t-etikett:11px; --t-meta:13px; --t-brod:15px; --t-stor:20px;
    --t-display:60px; --t-dagsnavn:20px; --t-pil:20px; --t-ikon:28px;
  }
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#F5F5F5 0%,#ECEFF1 100%);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---------- Ramme ---------- */
.skjerm{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:20px 22px 16px;
  gap:16px;
}

/* ---------- Topplinje ---------- */
.topp{display:flex;align-items:center;gap:16px;flex-shrink:0}
.merke{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.merke-ikon{
  width:54px;height:54px;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:7px;
  box-shadow:0 3px 12px rgba(0,0,0,.16);flex-shrink:0;
}
.merke-ikon img{width:100%;height:auto;display:block}
.merke-tittel{font-size:var(--t-stor);font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.15}
.merke-sub{font-size:var(--t-etikett);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin-top:2px}
.merke-navn{color:var(--ink);font-weight:700}
.merke-navn:not(:empty)::before{content:'\00b7';margin:0 5px;font-weight:600;color:var(--ink-soft)}

.klokke{margin-left:18px;text-align:right;line-height:1}
/* Dagen staar sentralt over kortene, med veien tilbake ved siden av. */
/* Detaljkortet fyller hoeyrekolonnen naar en avtale er valgt. */
.detaljkort{flex:1 1 auto;min-height:0}
.detalj-lukk{
  margin-left:auto;border:none;background:transparent;color:var(--ink-soft);
  font-size:var(--t-pil);line-height:1;cursor:pointer;padding:0 4px;border-radius:8px;
}
.detalj-lukk:active{background:rgba(44,62,80,.08)}
.plan-rad.valgt{box-shadow:inset 0 0 0 2px rgba(44,62,80,.45)}
.hoyre > .kort[hidden]{display:none}

/* Dagen er overskriften paa plankortet. Den laa foer paa en egen rad over
   kortene - den raden er borte, og hoeyden gikk til huskeboksene. */
/* Loddrett rulling er nettleserens, vannrett er sveipen vaar. Uten dette
   avbryter nettleseren bevegelsen foer den rekker aa bli en sveip. */
.sveipbar{touch-action:pan-y}

.dag-navn{
  font-family:'Archivo',sans-serif;font-size:var(--t-dagsnavn);font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink);
}
.til-idag{
  flex-shrink:0;align-self:center;
  border:1px solid var(--line);background:transparent;color:var(--ink-soft);
  font-family:'Archivo',sans-serif;font-size:var(--t-etikett);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;cursor:pointer;
}
.til-idag:active{transform:scale(.97)}
.til-idag[hidden]{display:none}

/* Stedsnavnet hoerer til vaeret, ikke til klokka. */
.vaer-sted{
  font-family:'Archivo',sans-serif;font-size:var(--t-brod);font-weight:700;
  color:var(--ink-soft);flex-shrink:0;letter-spacing:.01em;
}

/* Vaerstripe under toppraden: naa, noekkeltall, seks timer og fire dager.
   Det er god plass i bredden, saa alt staar framme uten aa maatte trykkes fram. */
/* Vaeret staar i toppraden, mellom overskriften og klokka. Der er hoeyden
   knapp, saa timesvarslet er kuttet og dagene beholdt. */
.vaer-stripe{
  display:flex;align-items:center;gap:18px;flex-shrink:1;min-width:0;
  margin-left:auto;margin-right:auto;
}
.vt-naa{display:flex;align-items:center;gap:12px;flex-shrink:0}
.vt-ikon{font-size:var(--t-ikon);line-height:1}
.vt-naa-tall{display:flex;flex-direction:column;line-height:1.15}
.vt-grad{font-size:var(--t-stor);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.vt-tekst{font-size:var(--t-meta);color:var(--ink-soft);font-weight:600}
.vt-meta{
  display:flex;flex-direction:column;gap:2px;flex-shrink:0;
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);
}
.vt-rad{display:flex;gap:2px;flex-shrink:0}
/* Timevinduet. Sveip flytter det seks timer om gangen. */
.vt-timer{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  padding-left:16px;border-left:1px solid var(--line);
  cursor:grab;user-select:none;
}
.vt-merke{
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-soft);opacity:.7;padding-left:3px;
}
.vaer-stripe{cursor:grab}
.vt-d{
  display:flex;flex-direction:column;align-items:center;gap:0;
  min-width:42px;padding:0 3px;
}
.vt-kl{font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft)}
.vt-ingen{font-size:var(--t-meta);color:var(--ink-soft);font-style:italic}
.vt-ik{font-size:var(--t-brod);line-height:1.25}
.vt-gr{font-size:var(--t-meta);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.vt-min{color:var(--ink-soft);font-weight:600;margin-left:3px}



@media(max-width:1150px){ .vt-meta{display:none} }
@media(max-width:900px){
  .vaer-stripe{gap:12px;margin:0}
  .vt-timer{display:none}
  .hoyre > .kort:last-child{flex:1}
}

/* Vaeret i toppraden, mellom overskriften og klokka. Full melding
   ligger sammenslaatt i et kort nederst, som aapnes ved trykk. */
@media(max-width:560px){
  .topp{flex-wrap:wrap}
}
.klokke-tid{font-size:var(--t-display);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.klokke-dato{font-size:var(--t-brod);color:var(--ink-soft);font-weight:600;text-transform:capitalize;margin-top:4px}

/* ---------- Rutenett ---------- */
.rutenett{
  flex:1;
  display:grid;
  grid-template-columns:1.45fr 1fr;
  gap:16px;
  min-height:0;
}
.hoyre{display:flex;flex-direction:column;gap:16px;min-height:0}
/* Hoeyrekolonnen er I dag, Denne uken og Middag. Reglene under stammet fra
   da vaeret laa oeverst her, og ga middagen all resthoeyden. */
.hoyre > .kort{flex:1 1 0;min-height:0}
/* Middagen er en rad med lite bilde - bare saa hoey som innholdet, slik at
   resthoeyden gaar til Merknader og Denne uken. */
.hoyre > .kort:last-child{flex:0 0 auto}        /* middagen: en fjerdedel */

.kort{
  background:var(--paper);
  border-radius:18px;
  padding:18px 20px;
  box-shadow:0 2px 14px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
  min-height:0;
}
.kort-tittel{
  font-size:var(--t-etikett);font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  color:var(--ink);margin-bottom:12px;flex-shrink:0;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
/* Bla mellom dager. Pilene er smaa - sveip er hovedveien. */
.dag-piler{display:inline-flex;gap:2px;margin-left:auto;flex-shrink:0}
.dag-pil{
  border:none;background:transparent;color:var(--ink-soft);cursor:pointer;
  font-size:var(--t-pil);line-height:1;padding:0 7px;border-radius:8px;font-family:inherit;
}
.dag-pil:active{background:rgba(44,62,80,.08)}
/* iPad: skjermen betjenes med finger, og sveip gjoer samme jobb.
   Mobil beholder dem som reserve, PC trenger dem (mus, ingen sveip). */
@media(min-width:700px) and (max-width:1300px){
  .dag-piler{display:none}
}
.kort-kropp{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* Middagskortet skal fylle hoeyden: kroppen maa ikke rulle, den skal
   strekke innholdet i stedet, ellers har bildet ingen plass aa vokse i. */
#middag{overflow:hidden;display:flex;flex-direction:column}
.kort-kropp::-webkit-scrollbar{width:0;background:transparent}

.tom{color:var(--ink-soft);font-size:var(--t-brod);padding:6px 0}

/* ---------- Dagsplan ---------- */
/* Hele foeringen fylles med kalenderfargen. Fyll og rammefarge settes i JS. */
.plan-rad{
  display:flex;align-items:flex-start;gap:11px;
  padding:9px 11px;margin-bottom:6px;
  border:1px solid transparent;border-radius:11px;
}

/* Fra-klokkeslett oeverst, til-klokkeslett under. */
.plan-tid{
  font-size:var(--t-brod);font-weight:700;font-variant-numeric:tabular-nums;
  width:46px;flex-shrink:0;padding-top:1px;line-height:1.25;
}
.plan-til{
  display:block;font-size:var(--t-meta);font-weight:600;
  color:var(--ink-soft);opacity:.85;
}
.plan-tid.hel{font-size:var(--t-etikett);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.plan-inn{min-width:0;flex:1}
.plan-tittel{font-size:var(--t-brod);font-weight:600;line-height:1.3;word-wrap:break-word}
.plan-meta{font-size:var(--t-meta);color:var(--ink-soft);margin-top:2px}
.plan-rad.forbi{opacity:.42}
.plan-rad.naa .plan-tittel{font-weight:700}
.plan-rad.naa .plan-tid{color:var(--blaa)}
.plan-rad{cursor:pointer;-webkit-tap-highlight-color:transparent}
.plan-rad:active{filter:brightness(.96)}
.plan-notatprikk{
  font-size:8px;color:var(--ink-soft);flex-shrink:0;
  align-self:center;opacity:.55;
}

/* ---------- Detaljer ---------- */
/* Panelet scroller ikke — innholdet gjoer det, slik at krysset blir staaende. */
#detaljInn{
  max-height:min(64vh,470px);overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.detalj-topp{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.detalj-prikk{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.detalj-kal{
  font-size:var(--t-etikett);font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-soft);
}
.detalj-tittel{font-size:var(--t-stor);font-weight:700;line-height:1.25;padding-right:30px}
.detalj-tid{font-size:var(--t-brod);font-weight:600;color:var(--blaa);margin-top:6px;font-variant-numeric:tabular-nums}
.detalj-linje{font-size:var(--t-brod);margin-top:12px;line-height:1.4}
.detalj-linje span{
  display:block;font-size:var(--t-etikett);font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-soft);margin-bottom:2px;
}
.detalj-notat{
  margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  font-size:var(--t-brod);line-height:1.5;white-space:pre-wrap;word-wrap:break-word;
}
.detalj-notat.tom{color:var(--ink-soft);font-style:italic}

/* ---------- Vær ---------- */
.vaer-t{flex:1;text-align:center;padding:8px 2px;border-radius:11px;background:#F7F9FA}

/* ---------- Middag ---------- */
/* Lite bilde til venstre, navnet ved siden av. Middagen er ett kort med
   ett navn og trenger ikke en stor plakat. */
.middag{
  display:flex;flex-direction:row;align-items:center;gap:14px;
  min-height:0;
}
a.middag{
  text-decoration:none;color:inherit;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .15s ease;
}
a.middag:active{opacity:.72}
.middag-pil{
  font-size:var(--t-pil);color:var(--ink-soft);line-height:1;
  flex-shrink:0;opacity:.45;align-self:center;
}
.middag-tekst{flex:1 1 auto;min-width:0}
.middag-lenke{color:inherit;text-decoration:underline;text-underline-offset:2px}
.middag-ikon{
  width:62px;height:62px;flex:0 0 62px;border-radius:14px;background:#F5F7F9;
  display:flex;align-items:center;justify-content:center;font-size:var(--t-ikon);line-height:1;
}
/* "Middag" staar som liten merkelapp over rettens navn, ikke som egen
   overskriftsrad - det sparer en hel linje i et lavt kort. */
.middag-merke{
  font-size:var(--t-etikett);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);margin-bottom:3px;
}
.kort-middag{padding:14px 16px}
/* Middagsnotat for dager uten noe i matplanen. */
.mid-tom{cursor:pointer;display:flex;align-items:baseline;gap:8px}
.mid-legg{
  font-size:var(--t-etikett);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;flex-shrink:0;margin-left:auto;
}
.mid-tom:active .mid-legg{background:rgba(44,62,80,.08)}
.mid-notat{
  font-size:var(--t-brod);font-weight:600;line-height:1.35;cursor:pointer;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.mid-notat:active{opacity:.7}
.mid-felt{min-height:56px;resize:vertical}
.kort-middag .kort-kropp{overflow:visible}
.middag-bilde{
  width:62px;height:62px;flex:0 0 62px;
  border-radius:14px;object-fit:cover;display:block;
  box-shadow:0 2px 10px rgba(0,0,0,.14);
}
.middag-navn{
  font-size:var(--t-stor);font-weight:700;line-height:1.2;
  overflow-wrap:anywhere;letter-spacing:-.01em;
}
.middag-meta{font-size:var(--t-meta);color:var(--ink-soft);margin-top:4px;font-weight:600}
.middag-flere{
  font-size:var(--t-meta);color:var(--ink-soft);margin-top:9px;
  padding-top:9px;border-top:1px solid var(--line);
}

/* ---------- Bunn ---------- */
.bunn{
  display:flex;align-items:center;gap:14px;flex-shrink:0;
  font-size:var(--t-etikett);color:var(--ink-soft);font-weight:600;
}
.bunn .knapp{
  margin-left:auto;background:none;border:1px solid var(--line);
  color:var(--ink-soft);font-family:inherit;font-size:var(--t-etikett);font-weight:700;
  padding:7px 14px;border-radius:999px;cursor:pointer;letter-spacing:.05em;
  text-transform:uppercase;
}
.bunn .knapp:active{background:#F0F2F4}
.feil{color:#B4443A}

/* ---------- Innlogging ---------- */
.port{
  position:fixed;inset:0;z-index:50;
  background:linear-gradient(160deg,#F5F5F5 0%,#ECEFF1 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
}
.port-ikon{
  width:110px;height:110px;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:15px;
  box-shadow:0 4px 20px rgba(0,0,0,.14);border:none;cursor:pointer;
}
.port-ikon img{width:100%;height:auto;display:block}
.port-note{font-size:var(--t-meta);color:var(--ink-soft);font-weight:600;max-width:340px;text-align:center;padding:0 20px}
.port-hjem{
  font-size:var(--t-etikett);font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);
  padding:9px 18px;border-radius:999px;background:var(--paper);
}

/* ---------- iPad portrett ---------- */
@media (max-width:900px){
  .rutenett{grid-template-columns:1fr;grid-template-rows:1.3fr 1fr}
  .hoyre{flex-direction:row}
  .hoyre .kort{flex:1}
}

/* ---------- Laast ramme ----------
   Siden skal ikke kunne dras sidelengs eller zoomes ved uhell.
   Merk: iOS Safari overstyrer user-scalable og slipper knipezoom likevel -
   det som faktisk virker er touch-action mot dobbelttrykk, og 16px i
   skjemafelt saa iOS ikke zoomer inn naar man trykker i dem. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{touch-action:manipulation}
input,select,textarea{font-size:16px}

/* ---------- Huskeliste ---------- */
.hu-ny{
  margin-left:auto;border:1px solid var(--line);background:transparent;
  color:var(--ink-soft);font-family:inherit;font-size:var(--t-brod);font-weight:700;
  line-height:1;width:22px;height:22px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.hu-ny:active{background:rgba(44,62,80,.08)}
/* Raden viser bare overskriften. Alt annet ligger i boblen. */
.hu-rad{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px;margin-bottom:6px;cursor:pointer;
  border:1px solid transparent;border-radius:11px;
}
.hu-rad:active{filter:brightness(.96)}
.hu-rad.forbi{opacity:.45}                 /* frist passert - blir staaende */
.hu-verkt{display:flex;gap:2px;flex-shrink:0}
.hu-knapp{
  border:none;background:transparent;color:var(--ink-soft);opacity:.5;
  font-size:var(--t-brod);line-height:1;cursor:pointer;padding:1px 3px;border-radius:6px;
}
.hu-knapp:active{opacity:1;background:rgba(44,62,80,.08)}
.hu-inn{flex:1;min-width:0}
.hu-topp{display:flex;align-items:baseline;gap:6px;cursor:default}
.hu-topp[onclick]{cursor:pointer}
/* Bokstavmerket, likt kalenderappens .pu-ini */
.ini{
  width:19px;height:19px;border-radius:50%;color:#FFFFFF;flex-shrink:0;
  font-family:'Archivo',sans-serif;font-size:var(--t-etikett);font-weight:700;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.plan-rad .ini{margin-top:1px}
.hu-tittel{flex:1;min-width:0;font-weight:700;font-size:var(--t-brod);line-height:1.3;
  overflow-wrap:anywhere}
.hu-pil{color:var(--ink-soft);font-size:var(--t-brod);line-height:1;flex-shrink:0;opacity:.6}

/* Boble for én merknad. Fyll og rammefarge settes i JS. */
.hu-boble-bak{position:fixed;inset:0;z-index:60;background:transparent}
/* Boblen tar den plassen innholdet trenger, men aldri mer enn halve
   skjermen i hver retning. */
.hu-boble{
  position:fixed;z-index:61;
  width:max-content;min-width:240px;max-width:min(64vw,720px);
  max-height:68vh;overflow-y:auto;overscroll-behavior:contain;
  border:1px solid transparent;border-radius:16px;padding:16px 18px 14px;
  box-shadow:0 18px 44px rgba(44,62,80,.28);
}
.hu-boble[hidden]{display:none}
.hub-lukk{
  position:absolute;top:8px;right:10px;border:none;background:transparent;
  color:var(--ink-soft);font-size:var(--t-pil);line-height:1;cursor:pointer;padding:2px 4px;
}
.hub-tittel{font-size:var(--t-brod);font-weight:700;line-height:1.25;padding-right:22px;
  overflow-wrap:anywhere}
.hub-tekst{font-size:var(--t-brod);line-height:1.5;margin-top:8px;white-space:pre-wrap;
  overflow-wrap:anywhere}
.hub-tekst.tom{color:var(--ink-soft);font-style:italic}
.hub-meta{font-size:var(--t-etikett);color:var(--ink-soft);margin-top:12px;padding-top:9px;
  border-top:1px solid rgba(44,62,80,.14);display:flex;align-items:center;gap:6px}
.hub-prikk{width:8px;height:8px;border-radius:50%;flex-shrink:0}


.hu-skjema{display:flex;flex-direction:column;gap:7px;padding-bottom:10px;
  margin-bottom:8px;border-bottom:1px solid var(--line)}
.hu-felt{
  font-family:'Archivo',sans-serif;font-size:16px;color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:7px 9px;
  background:var(--paper);width:100%;box-sizing:border-box;
}
.hu-omr{resize:vertical;min-height:130px;line-height:1.45}
.hu-rad2{display:flex;gap:7px}
.hu-rad2 label,.hu-frist{flex:1;font-size:var(--t-etikett);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px}
.hu-knapper{display:flex;gap:7px;justify-content:flex-end}
.hu-avbryt,.hu-lagre{
  font-family:'Archivo',sans-serif;font-size:var(--t-etikett);font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:7px 14px;border-radius:999px;cursor:pointer;
}
.hu-avbryt{border:1px solid var(--line);background:transparent;color:var(--ink-soft)}
.hu-lagre{border:1px solid var(--ink);background:var(--ink);color:#FFFFFF}

<script>
/* ============================================================
   Familie Hub – Dashboard (pilot)
   Viser dagens kalenderplan, vaeret, dagens middag og klokke.
   Leser bare data — endrer ingenting.
   ============================================================ */

const $ = function(id){ return document.getElementById(id); };

const STED = { navn:'Arendal', lat:58.4614, lon:8.7724 };
const TZ   = 'Europe/Oslo';

/* Samme Azure-app og token som kalenderen — de deler fh_cal_auth. */
const CFG = {
  clientId : 'ccab6959-abc2-4d09-9212-4b33c0db025c',
  authority: 'common',
  scopes   : 'openid profile offline_access User.Read Calendars.Read Calendars.ReadWrite'
};
const REDIRECT  = location.origin + location.pathname;
const AUTH_BASE = 'https://login.microsoftonline.com/' + CFG.authority + '/oauth2/v2.0';
const GRAPH     = 'https://graph.microsoft.com/v1.0';

/* Samme faste farger som kalenderen, med KV-overstyring. */
const PALETTE = ['#2C3E50','#B4443A','#3E7C5A','#8A6BB1','#C08A2E','#4A7FA8','#A05A7A','#5A6C7D'];
const FASTE_FARGER = {
  'Familie':'#2C3E50', 'Magne':'#4A7FA8', 'Nina':'#B4443A',
  'Emma':'#8A6BB1', 'Andrea':'#C65B7C'
};
let fargeOverstyring = {};
function kalenderFarge(navn, i){
  return fargeOverstyring[navn] || FASTE_FARGER[navn] || PALETTE[i % PALETTE.length];
}

const DAGER = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MND = ['januar','februar','mars','april','mai','juni',
             'juli','august','september','oktober','november','desember'];

const S = { token:null, refresh:null, expires:0, laster:false };

/* ============================================================
   Innlogging (PKCE) — samme moenster som kalenderen
   ============================================================ */
function base64url(buf){
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function lagVerifier(){
  const a = new Uint8Array(32);
  crypto.getRandomValues(a);
  return base64url(a.buffer);
}
async function lagChallenge(v){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v));
  return base64url(d);
}
async function loggInn(){
  try{
    const verifier = await lagVerifier();
    const challenge = await lagChallenge(verifier);
    const state = base64url(crypto.getRandomValues(new Uint8Array(12)).buffer);
    sessionStorage.setItem('fh_verifier', verifier);
    sessionStorage.setItem('fh_state', state);
    location.href = AUTH_BASE + '/authorize'
      + '?client_id=' + CFG.clientId
      + '&response_type=code'
      + '&redirect_uri=' + encodeURIComponent(REDIRECT)
      + '&response_mode=query'
      + '&scope=' + encodeURIComponent(CFG.scopes)
      + '&state=' + state
      + '&code_challenge=' + challenge
      + '&code_challenge_method=S256';
  }catch(e){
    portNote('Kunne ikke starte innloggingen: ' + e.message);
  }
}
async function bytt(felter){
  const body = new URLSearchParams(Object.assign({
    client_id: CFG.clientId,
    redirect_uri: REDIRECT
  }, felter));
  const r = await fetch(AUTH_BASE + '/token', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: body.toString()
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.error || 'Innlogging feilet');
  return d;
}
function lagreToken(d){
  S.token = d.access_token;
  S.refresh = d.refresh_token || S.refresh;
  S.expires = Date.now() + (d.expires_in || 3600)*1000 - 60000;
  try{
    localStorage.setItem('fh_cal_auth', JSON.stringify({refresh:S.refresh, token:S.token, expires:S.expires}));
  }catch(e){}
}
function lesToken(){
  try{
    const raw = localStorage.getItem('fh_cal_auth');
    if(!raw) return false;
    const d = JSON.parse(raw);
    S.token = d.token; S.refresh = d.refresh; S.expires = d.expires || 0;
    return !!(S.token || S.refresh);
  }catch(e){ return false; }
}
let fornyelse = null;
async function gyldigToken(){
  if(S.token && Date.now() < S.expires) return S.token;
  if(!S.refresh) return null;
  if(!fornyelse){
    fornyelse = bytt({grant_type:'refresh_token', refresh_token:S.refresh, scope:CFG.scopes})
      .then(function(d){ lagreToken(d); return S.token; })
      .finally(function(){ fornyelse = null; });
  }
  return fornyelse;
}
function loggUt(){
  try{
    localStorage.removeItem('fh_cal_auth');
    localStorage.removeItem('fh_navn');
    sessionStorage.clear();
  }catch(e){}
  S.token = null; S.refresh = null; S.expires = 0;
  try{ sessionStorage.setItem('fh_ut', '1'); }catch(e){}
  location.href = AUTH_BASE + '/logout?post_logout_redirect_uri='
    + encodeURIComponent(location.origin + location.pathname);
}
(function fullfoerUtlogging(){
  let flagg = null;
  try{ flagg = sessionStorage.getItem('fh_ut'); }catch(e){}
  if(!flagg) return;
  try{ sessionStorage.removeItem('fh_ut'); }catch(e){}
  location.replace('/cdn-cgi/access/logout');
})();

function portNote(tekst){
  $('portNote').textContent = tekst || '';
}
function visPort(paa){
  $('port').hidden = !paa;
  $('skjerm').hidden = paa;
}

/* ============================================================
   Microsoft Graph
   ============================================================ */
async function graph(sti){
  const t = await gyldigToken();
  if(!t) throw new Error('Ikke innlogget');
  const opt = {
    headers:{
      Authorization:'Bearer ' + t,
      Prefer:'outlook.timezone="' + TZ + '"'
    }
  };
  /* Taaler struping — samme grunn som i kalenderen. */
  let forsoek = 0, r;
  while(true){
    r = await fetch(GRAPH + sti, opt);
    if(forsoek >= 3) break;
    if(r.status !== 429 && r.status !== 503 && r.status !== 504) break;
    const vent = parseInt(r.headers.get('Retry-After') || '', 10);
    const ms = (isFinite(vent) && vent > 0) ? Math.min(vent*1000, 8000) : 500 * Math.pow(2, forsoek);
    await new Promise(function(ok){ setTimeout(ok, ms); });
    forsoek++;
  }
  const txt = await r.text();
  if(!txt) return null;
  let d;
  try{ d = JSON.parse(txt); }catch(e){ throw new Error('Uventet svar fra Microsoft'); }
  if(!r.ok) throw new Error((d.error && d.error.message) || 'Graph-feil');
  return d;
}

/* ============================================================
   Felles farger fra Cloudflare KV
   ============================================================ */
/* ============================================================
   Tilgang — piloten er foreloepig kun for sys.
   Sperren er paa klientsiden: den hindrer familien i aa snuble inn
   i noe halvferdig, men er ingen ekte sikkerhetsgrense. Alle bak
   Access-porten kan i prinsippet omgaa den. Det holder her, siden
   siden bare leser data alle uansett har tilgang til.
   ============================================================ */
const DASH_TILGANG = ['sys@neam.no'];

function normEpost(s){
  s = String(s || '').toLowerCase().trim();
  const ext = s.indexOf('#ext#');
  if(ext !== -1){
    s = s.slice(0, ext);
    const i = s.lastIndexOf('_');
    if(i !== -1) s = s.slice(0, i) + '@' + s.slice(i + 1);
  }
  return s;
}

async function harTilgang(){
  let epost = '';
  /* Microsoft Graph foerst. Access-sesjonen kan henge igjen som forrige
     bruker ved brukerbytte paa delt iPad — det var nettopp derfor navnet
     viste feil person tidligere. Graph foelger den faktiske innloggingen. */
  try{
    const me = await graph('/me');
    epost = normEpost((me && (me.mail || me.userPrincipalName)) || '');
  }catch(e){}
  /* Access kun som reserve hvis Graph ikke svarte. */
  if(!epost){
    try{
      const r = await fetch('/cdn-cgi/access/get-identity?_=' + Date.now(), {cache:'no-store'});
      if(r.ok){
        const d = await r.json();
        epost = normEpost(d.email || '');
      }
    }catch(e){}
  }
  return { ok: DASH_TILGANG.indexOf(epost) !== -1, epost: epost };
}

async function hentFarger(){
  try{
    const r = await fetch('/api/data?key=kal-farger', {cache:'no-store'});
    if(!r.ok) return;
    const txt = await r.text();
    if(!txt) return;
    let d = JSON.parse(txt);
    if(d && typeof d === 'object' && d.value !== undefined){
      d = (typeof d.value === 'string') ? JSON.parse(d.value) : d.value;
    }
    if(d && typeof d === 'object') fargeOverstyring = d;
  }catch(e){}
}

/* ============================================================
   Klokke
   ============================================================ */
function tegnKlokke(){
  const n = new Date();
  $('klokkeTid').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  $('klokkeDato').textContent =
    DAGER[n.getDay()] + ' ' + n.getDate() + '. ' + MND[n.getMonth()];
}

/* ============================================================
   Dagens plan
   ============================================================ */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function kl(d){
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* Notatfeltet fra Graph kommer som HTML naar avtalen er laget i Outlook.
   Vi viser ren tekst: DOMParser kjoerer ingen skript og vi setter aldri
   HTML-en inn i siden. bodyPreview kan ikke brukes — den kuttes ved ~255 tegn. */
function htmlTilTekst(innhold, type){
  const s = String(innhold || '');
  if(!s) return '';
  if(String(type).toLowerCase() !== 'html') return s.trim();
  try{
    const doc = new DOMParser().parseFromString(s, 'text/html');
    doc.querySelectorAll('br').forEach(function(b){ b.replaceWith('\n'); });
    doc.querySelectorAll('p,div,li,tr,h1,h2,h3,h4,h5,h6').forEach(function(b){ b.append('\n'); });
    return (doc.body.textContent || '')
      .replace(/\u00a0/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }catch(e){
    /* Reserve om DOMParser ikke er tilgjengelig: gjoer blokkslutt til
       linjeskift foer taggene fjernes, ellers klistres avsnitt sammen. */
    return s.replace(/<\/(p|div|li|tr|h[1-6])>/gi, '\n')
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<[^>]*>/g, '')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
  }
}

/* Hvilken dag planen viser. 0 = i dag, -1 = i gaar, 1 = i morgen. */
let dagOffset = 0;

function dagenViser(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate() + dagOffset);
}

function dagNavn(){
  if(dagOffset === 0) return 'I dag';
  if(dagOffset === 1) return 'I morgen';
  if(dagOffset === -1) return 'I går';
  const d = dagenViser();
  const tekst = d.toLocaleDateString('no-NO', {weekday:'long', day:'numeric', month:'long'});
  return tekst.charAt(0).toUpperCase() + tekst.slice(1);
}

async function hentPlan(){
  const start = dagenViser();
  const slutt = new Date(start.getTime() + 86400000);

  const kal = await graph('/me/calendars?$top=50');
  const aktive = (kal.value || []).map(function(c, i){
    return { id:c.id, navn:c.name, farge:kalenderFarge(c.name, i) };
  });

  const q = '?startDateTime=' + start.toISOString()
          + '&endDateTime=' + slutt.toISOString()
          + '&$orderby=start/dateTime&$top=100'
          + '&$select=subject,isAllDay,start,end,location,body';

  /* Maks tre samtidige kall, og en kalender som feiler skal ikke
     stilltiende bli borte — vi sier fra i stedet. */
  const alle = [];
  let feilet = 0;
  for(let i = 0; i < aktive.length; i += 3){
    const bolk = aktive.slice(i, i + 3);
    const svar = await Promise.all(bolk.map(async function(c){
      try{
        const d = await graph('/me/calendars/' + c.id + '/calendarView' + q);
        return (d.value || []).map(function(e){
          return {
            tittel: e.subject || '(uten tittel)',
            heleDagen: !!e.isAllDay,
            start: new Date(e.start.dateTime + (e.start.timeZone === 'UTC' ? 'Z' : '')),
            slutt: new Date(e.end.dateTime + (e.end.timeZone === 'UTC' ? 'Z' : '')),
            sted: (e.location && e.location.displayName) || '',
            notat: htmlTilTekst(e.body && e.body.content, e.body && e.body.contentType),
            farge: c.farge,
            kalender: c.navn
          };
        });
      }catch(err){
        console.warn('Kalender «' + c.navn + '»:', err.message);
        return null;
      }
    }));
    svar.forEach(function(s){
      if(s === null){ feilet++; return; }
      s.forEach(function(e){ alle.push(e); });
    });
  }

  alle.sort(function(a, b){
    if(a.heleDagen !== b.heleDagen) return a.heleDagen ? -1 : 1;
    return a.start - b.start;
  });
  return { avtaler: alle, feilet: feilet };
}

let dagensAvtaler = [];

function tegnPlan(res){
  const boks = $('plan');
  const avtaler = res.avtaler;
  dagensAvtaler = avtaler;

  settDagsTitler();

  if(!avtaler.length){
    boks.innerHTML = '<div class="tom">'
      + (dagOffset === 0 ? 'Ingen avtaler i dag.' : 'Ingen avtaler denne dagen.')
      + '</div>';
    return;
  }

  /* "Naa" og "forbi" gir bare mening for dagen i dag. */
  const naa = dagOffset === 0 ? new Date() : new Date(8640000000000000);
  boks.innerHTML = avtaler.map(function(e, i){
    const forbi = dagOffset === 0 && !e.heleDagen && e.slutt < naa;
    const paagaar = dagOffset === 0 && !e.heleDagen && e.start <= naa && e.slutt > naa;
    /* Kalendernavnet er ute - initialen sier hvem det gjelder. Stedet blir. */
    const meta = e.sted || '';
    return '<div class="plan-rad' + (forbi ? ' forbi' : '') + (paagaar ? ' naa' : '') + '"'
      + ' style="' + fyll(e.farge) + '"'
      + ' onclick="visDetalj(' + i + ')" role="button" tabindex="0">'
      + '<div class="plan-tid' + (e.heleDagen ? ' hel' : '') + '">'
      +   (e.heleDagen
            ? 'Hele<br>dagen'
            : esc(kl(e.start)) + '<span class="plan-til">' + esc(kl(e.slutt)) + '</span>')
      + '</div>'
      + initial(e.kalender, e.farge)
      + '<div class="plan-inn">'
      +   '<div class="plan-tittel">' + esc(e.tittel) + '</div>'
      +   (meta ? '<div class="plan-meta">' + esc(meta) + '</div>' : '')
      + '</div>'
      + (e.notat ? '<div class="plan-notatprikk" title="Har notat">●</div>' : '')
      + '</div>';
  }).join('');

  if(res.feilet){
    boks.innerHTML += '<div class="plan-meta feil" style="padding-top:10px">'
      + res.feilet + ' kalender(e) svarte ikke — prøv Oppdater.</div>';
  }
}

/* ---- Detaljer for én avtale, som en boble ved siden av raden ---- */
/* Avtalen tar over hele hoeyrekolonnen i stedet for aa legge seg som en
   boble oppaa. Da kan notatet vaere langt uten aa dekke planen man leser
   det ut fra. */
const HOYRE_KORT = ['kortMerknader', 'kortUken', 'kortMiddag'];

let detaljIndeks = null;

function visDetalj(i){
  /* Trykk paa samme avtale igjen lukker den. */
  if(detaljIndeks === i && !$('detalj').hidden){ lukkDetalj(); return; }
  const e = dagensAvtaler[i];
  if(!e) return;
  detaljIndeks = i;

  const tid = e.heleDagen ? 'Hele dagen' : kl(e.start) + '–' + kl(e.slutt);

  let html = '<div class="detalj-topp">'
    + '<span class="detalj-prikk" style="background:' + e.farge + '"></span>'
    + '<span class="detalj-kal">' + esc(e.kalender) + '</span>'
    + '</div>'
    + '<div class="detalj-tittel">' + esc(e.tittel) + '</div>'
    + '<div class="detalj-tid">' + esc(tid) + '</div>';

  if(e.sted) html += '<div class="detalj-linje"><span>Sted</span>' + esc(e.sted) + '</div>';

  html += e.notat
    ? '<div class="detalj-notat">' + esc(e.notat) + '</div>'
    : '<div class="detalj-notat tom">Ingen notater.</div>';

  $('detaljInn').innerHTML = html;
  $('detalj').hidden = false;
  HOYRE_KORT.forEach(function(id){ if($(id)) $(id).hidden = true; });

  /* Marker raden som er valgt, saa det er tydelig hva kolonnen viser. */
  Array.from(document.querySelectorAll('.plan-rad')).forEach(function(r, n){
    r.classList.toggle('valgt', n === i);
  });
  visTilIdag();
}

function lukkDetalj(){
  detaljIndeks = null;
  if($('detalj')) $('detalj').hidden = true;
  HOYRE_KORT.forEach(function(id){ if($(id)) $(id).hidden = false; });
  Array.from(document.querySelectorAll('.plan-rad.valgt'))
    .forEach(function(r){ r.classList.remove('valgt'); });
  if(typeof visTilIdag === 'function') visTilIdag();
}

/* ============================================================

   ============================================================ */
const WMO = {
  0:['☀️','Klarvær'], 1:['🌤️','Stort sett klart'], 2:['⛅','Delvis skyet'], 3:['☁️','Skyet'],
  45:['🌫️','Tåke'], 48:['🌫️','Rimtåke'],
  51:['🌦️','Lett yr'], 53:['🌦️','Yr'], 55:['🌧️','Kraftig yr'],
  56:['🌧️','Underkjølt yr'], 57:['🌧️','Underkjølt yr'],
  61:['🌦️','Lett regn'], 63:['🌧️','Regn'], 65:['🌧️','Kraftig regn'],
  66:['🌧️','Underkjølt regn'], 67:['🌧️','Underkjølt regn'],
  71:['🌨️','Lett snø'], 73:['🌨️','Snø'], 75:['❄️','Kraftig snø'], 77:['🌨️','Snøkorn'],
  80:['🌦️','Regnbyger'], 81:['🌧️','Regnbyger'], 82:['⛈️','Kraftige byger'],
  85:['🌨️','Snøbyger'], 86:['❄️','Kraftige snøbyger'],
  95:['⛈️','Torden'], 96:['⛈️','Torden med hagl'], 99:['⛈️','Kraftig torden']
};
function vkode(c){ return WMO[c] || ['🌡️','—']; }
function rund(v){ return Math.round(v); }

/* Posisjon: iPaden staar stille, saa vi spoer enheten én gang og
   husker svaret. Da slipper vi bade tillatelsesdialog hver gang og
   unoedig batteribruk. Uten tillatelse faller vi tilbake til Arendal. */
let posisjon = { lat: STED.lat, lon: STED.lon, navn: STED.navn, presis: false };

function lesLagretPosisjon(){
  try{
    const raw = localStorage.getItem('fh_pos');
    if(!raw) return false;
    const p = JSON.parse(raw);
    if(typeof p.lat === 'number' && typeof p.lon === 'number'){
      posisjon = { lat:p.lat, lon:p.lon, navn:p.navn || 'Din posisjon', presis:true };
      return true;
    }
  }catch(e){}
  return false;
}

async function finnPosisjon(){
  if(lesLagretPosisjon()) return;
  if(!navigator.geolocation) return;
  try{
    const p = await new Promise(function(ok, nei){
      navigator.geolocation.getCurrentPosition(ok, nei, {
        enableHighAccuracy:false, timeout:8000, maximumAge:86400000
      });
    });
    posisjon = {
      lat: Math.round(p.coords.latitude  * 10000) / 10000,
      lon: Math.round(p.coords.longitude * 10000) / 10000,
      navn: 'Din posisjon',
      presis: true
    };
    /* Prøv å sette et stedsnavn — feiler det, står «Din posisjon». */
    try{
      const g = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client'
        + '?latitude=' + posisjon.lat + '&longitude=' + posisjon.lon + '&localityLanguage=no');
      if(g.ok){
        const gd = await g.json();
        const navn = gd.locality || gd.city || gd.principalSubdivision;
        if(navn) posisjon.navn = navn;
      }
    }catch(e){}
    try{ localStorage.setItem('fh_pos', JSON.stringify(posisjon)); }catch(e){}
  }catch(e){
    /* Avslaatt eller tidsavbrudd — Arendal duger. */
  }
}

async function hentVaer(){
  const url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + posisjon.lat + '&longitude=' + posisjon.lon
    + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m'
    + '&hourly=temperature_2m,weather_code'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum'
    + '&timezone=Europe%2FOslo&forecast_days=5';
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  $('vaerSted').textContent = posisjon.navn;
  return r.json();
}

/* Vaeret foelger dagen man ser paa. Sveip hvor som helst - ogsaa i
   vaerstripa - flytter hele skjermen til samme dag. Meldingen rekker fem
   doegn; utenfor det staar stripa tom. */
let vaerSiste = null;

function tegnVaer(d){
  vaerSiste = d;
  tegnVaerStripe();
}

/* Foerste time som skal vises: naa-timen i dag, ellers morgenen den dagen. */
function vaerStart(){
  if(!vaerSiste) return -1;
  const t = vaerSiste.hourly.time;
  if(dagOffset === 0){
    const naa = new Date();
    const i = t.findIndex(function(x){ return new Date(x) > naa; });
    return i < 0 ? 0 : i;
  }
  const mal = datoNokkel(dagenViser());
  const i = t.findIndex(function(x){ return x.slice(0, 10) === mal && x.slice(11, 13) === '08'; });
  if(i >= 0) return i;
  return t.findIndex(function(x){ return x.slice(0, 10) === mal; });
}

function tegnVaerStripe(){
  const d = vaerSiste;
  if(!d) return;
  const stripe = $('vaerStripe');
  const i0 = vaerStart();

  if(i0 < 0){
    stripe.innerHTML = '<span class="vt-ingen">Ingen værmelding så langt fram</span>';
    stripe.hidden = false;
    $('vaerSted').textContent = posisjon.navn;
    return;
  }

  const VINDU = 6;
  let timer = '';
  for(let i = i0; i < i0 + VINDU && i < d.hourly.time.length; i++){
    const t = new Date(d.hourly.time[i]);
    timer += '<span class="vt-d">'
      + '<span class="vt-kl">' + pad(t.getHours()) + '</span>'
      + '<span class="vt-ik">' + vkode(d.hourly.weather_code[i])[0] + '</span>'
      + '<span class="vt-gr">' + rund(d.hourly.temperature_2m[i]) + '°</span>'
      + '</span>';
  }

  /* I dag: naa-tallene. Andre dager: doegnets spenn. */
  const dagIdx = d.daily.time.indexOf(datoNokkel(dagenViser()));
  let ikon, tekst, stort, under;
  if(dagOffset === 0){
    const n = d.current;
    const iv = vkode(n.weather_code);
    ikon = iv[0]; tekst = iv[1];
    stort = rund(n.temperature_2m) + '°';
    under = 'Føles som ' + rund(n.apparent_temperature) + '°'
          + ' · Vind ' + rund(n.wind_speed_10m) + ' km/t';
  } else if(dagIdx >= 0){
    const iv = vkode(d.daily.weather_code[dagIdx]);
    ikon = iv[0]; tekst = iv[1];
    stort = rund(d.daily.temperature_2m_max[dagIdx]) + '°';
    under = 'Lavest ' + rund(d.daily.temperature_2m_min[dagIdx]) + '°';
  } else {
    ikon = '·'; tekst = ''; stort = '–'; under = '';
  }
  const regn = dagIdx >= 0 ? d.daily.precipitation_sum[dagIdx] : 0;

  stripe.innerHTML =
      '<span class="vt-naa">'
    +   '<span class="vt-ikon">' + ikon + '</span>'
    +   '<span class="vt-naa-tall">'
    +     '<span class="vt-grad">' + stort + '</span>'
    +     '<span class="vt-tekst">' + esc(tekst) + '</span>'
    +   '</span>'
    + '</span>'
    + '<span class="vt-meta">'
    +   (under ? '<span>' + esc(under) + '</span>' : '')
    +   (regn > 0.05 ? '<span>' + regn.toFixed(1).replace('.', ',') + ' mm nedbør</span>' : '')
    + '</span>'
    + '<span class="vt-timer"><span class="vt-rad">' + timer + '</span></span>';

  $('vaerSted').textContent = posisjon.navn;
  stripe.hidden = false;
}

/* ============================================================
   Dagens middag
   Leser matplanen fra samme sky-lagring som Matlaging bruker.
   Format: { "2026-W34": { 1:[{id,title,servings}], ... } }  (1 = mandag)
   ============================================================ */
function isoUke(dato){
  const d = new Date(Date.UTC(dato.getFullYear(), dato.getMonth(), dato.getDate()));
  const dagNr = (d.getUTCDay() + 6) % 7;           /* mandag = 0 */
  d.setUTCDate(d.getUTCDate() - dagNr + 3);        /* torsdag i samme uke */
  const aar = d.getUTCFullYear();
  const forsteTorsdag = new Date(Date.UTC(aar, 0, 4));
  const fdNr = (forsteTorsdag.getUTCDay() + 6) % 7;
  forsteTorsdag.setUTCDate(forsteTorsdag.getUTCDate() - fdNr + 3);
  const uke = 1 + Math.round((d - forsteTorsdag) / (7 * 86400000));
  return { aar: aar, uke: uke, dagNr: dagNr + 1 };  /* dagNr: 1 = mandag */
}

/* Bildet hentes fra den lette oppskriftsindeksen, ikke fra hele
   oppskriften — indeksen har en 200px-miniatyr, mens selve oppskriften
   ogsaa baerer alle stegbildene og kan bli mange megabyte. */

}

async function hentMiddag(){
  const r = await fetch('/api/data?key=' + encodeURIComponent('p:meal-plan'), {cache:'no-store'});
  if(!r.ok){
    if(r.status === 404) return [];
    throw new Error('HTTP ' + r.status);
  }

  if(d && typeof d === 'object' && d.value !== undefined) d = d.value;
  if(typeof d === 'string') d = JSON.parse(d);
  if(!d || typeof d !== 'object') return [];

  const i = isoUke(dagenViser());
  const nokkel = i.aar + '-W' + String(i.uke).padStart(2, '0');
  const uke = d[nokkel];
  if(!uke) return [];
  return uke[i.dagNr] || uke[String(i.dagNr)] || [];
}

/* ============================================================
   Huskeliste – merknader med frist
   Én KV-noekkel `fh:huskeliste`. Boksene foelger visningen: Merknader
   viser punkter med frist paa dagen man ser paa, Denne uken viser
   punkter for uka den dagen ligger i. Utgraaing maales mot ekte i dag,
   ikke mot dagen man ser paa - ser du framover, staar alt normalt.
   ============================================================ */
const PERSONER = ['Familie', 'Magne', 'Nina', 'Emma', 'Andrea'];
const pad = function(n){ return String(n).padStart(2, '0'); };
let huskeliste = null;
let huskeSkjema = null;          /* 'dag' | 'uke' | null */

/* Kalenderfargen som gjennomsiktig fyll bak hele foeringen. Teksten blir
   staaende moerk mot en lys tone av personens egen farge. */
function rgbAv(hex){
  const h = String(hex || '').replace('#', '').trim();
  const full = h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h;
  if(!/^[0-9a-fA-F]{6}$/.test(full)) return {r:44, g:62, b:80};
  return { r: parseInt(full.slice(0,2),16),
           g: parseInt(full.slice(2,4),16),
           b: parseInt(full.slice(4,6),16) };
}
function dus(hex, a){
  const c = rgbAv(hex);
  return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
}
/* Samme bokstavmerke som i kalenderappen: forbokstaven i kalendernavnet,
   i full farge. Fargefyllet bak foeringen er dust, saa merket er det som
   gjoer hvem det gjelder lesbart paa avstand. */
function initial(navn, farge){
  const b = (navn || '?').trim().charAt(0).toUpperCase();
  return '<span class="ini" style="background:' + esc(farge) + '" title="' + esc(navn || '') + '">'
    + esc(b) + '</span>';
}

function fyll(hex){
  return 'background:' + dus(hex, .16) + ';border-color:' + dus(hex, .34);
}
/* Samme tone som fyll(), men ugjennomsiktig - fargen blandes inn i hvitt i
   stedet for aa legges oppaa. Brukes der noe ligger over annet innhold. */
function tett(hex, a){
  const c = rgbAv(hex);
  const m = function(v){ return Math.round(255 + (v - 255) * a); };
  return 'rgb(' + m(c.r) + ',' + m(c.g) + ',' + m(c.b) + ')';
}

function huskeFarge(navn){
  const i = PERSONER.indexOf(navn);
  return kalenderFarge(navn, i < 0 ? 0 : i);
}
function datoNokkel(d){
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function ukeNokkel(d){
  const i = isoUke(d);
  return i.aar + '-W' + pad(i.uke);
}
function ukeAv(datotekst){
  const b = String(datotekst || '').split('-');
  if(b.length < 3) return '';
  return ukeNokkel(new Date(+b[0], +b[1] - 1, +b[2]));
}

async function hentHuske(){
  const r = await fetch('/api/data?key=huskeliste', {cache:'no-store'});
  if(!r.ok) return [];
  const txt = await r.text();
  if(!txt) return [];
  let d = JSON.parse(txt);
  if(d && typeof d === 'object' && d.value !== undefined) d = d.value;
  if(typeof d === 'string') d = JSON.parse(d);
  return Array.isArray(d) ? d : [];
}

/* Les paa nytt foer skriving. Flere i familien kan skrive samtidig, og
   KV er sist-skriving-vinner - da er vinduet i det minste kort. */
async function endreHuske(endring){
  const fersk = await hentHuske();
  const ny = endring(fersk);
  const r = await fetch('/api/data?key=huskeliste', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(ny)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  huskeliste = ny;
  tegnHuske();
}

function idag0(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

function huskeRad(m){
  const forbi = m.frist && m.frist < datoNokkel(idag0());
  const harTekst = !!(m.tekst || '').trim();
  /* Bare overskriften staar i lista - plassen er knapp. Resten kommer i
     boblen ved trykk. */
  return '<div class="hu-rad' + (forbi ? ' forbi' : '') + '" data-id="' + esc(m.id) + '"'
    +     ' style="' + fyll(huskeFarge(m.gjelder)) + '"'
    +     ' onclick="vekslHuskeBoble(\'' + esc(m.id) + '\', event)">'
    +   initial(m.gjelder, huskeFarge(m.gjelder))
    +   '<span class="hu-tittel">' + esc(m.overskrift || '') + '</span>'
    +   (harTekst ? '<span class="hu-pil">›</span>' : '')
    +   '<div class="hu-verkt">'
    +     '<button class="hu-knapp" onclick="event.stopPropagation(); rediger(\'' + esc(m.id) + '\')" '
    +       'aria-label="Endre">✎</button>'
    +     '<button class="hu-knapp" onclick="event.stopPropagation(); slettHuske(\'' + esc(m.id) + '\')" '
    +       'aria-label="Slett">×</button>'
    +   '</div>'
    + '</div>';
}

/* ---------------- Boble for én merknad ----------------
   Trykk paa samme rad igjen lukker. Trykk utenfor lukker. Escape lukker. */
let huBobleId = null;

function vekslHuskeBoble(id, ev){
  if(ev) ev.stopPropagation();
  if(huBobleId === id){ lukkHuskeBoble(); return; }
  const m = (huskeliste || []).find(function(x){ return x.id === id; });
  if(!m) return;

  const farge = huskeFarge(m.gjelder);
  const frist = m.frist
    ? new Date(m.frist + 'T12:00:00').toLocaleDateString('no-NO',
        {weekday:'long', day:'numeric', month:'long'})
    : '';
  $('huBobleInn').innerHTML =
      '<div class="hub-tittel">' + esc(m.overskrift || '') + '</div>'
    + ((m.tekst || '').trim()
        ? '<div class="hub-tekst">' + esc(m.tekst) + '</div>'
        : '<div class="hub-tekst tom">Ingen utfyllende tekst.</div>')
    + '<div class="hub-meta">'
    +   '<span class="hub-prikk" style="background:' + esc(farge) + '"></span>'
    +   esc(m.gjelder || 'Familie')
    +   (frist ? ' · frist ' + esc(frist) : '')
    +   (m.av ? ' · skrevet av ' + esc(m.av) : '')
    + '</div>';

  const b = $('huBoble');
  b.style.background  = tett(farge, .14);
  b.style.borderColor = tett(farge, .42);
  b.hidden = false;
  $('huBobleBak').hidden = false;
  huBobleId = id;

  /* Ankre boblen ved raden, men hold den innenfor skjermen. */
  const rad = document.querySelector('.hu-rad[data-id="' + id + '"]');
  const r = rad ? rad.getBoundingClientRect() : null;
  const bb = b.getBoundingClientRect();
  const marg = 12;
  let venstre = r ? (r.left - bb.width - 14) : (innerWidth/2 - bb.width/2);
  if(venstre < marg) venstre = r ? Math.min(r.right + 14, innerWidth - bb.width - marg) : marg;
  venstre = Math.max(marg, Math.min(venstre, innerWidth - bb.width - marg));
  let topp = r ? (r.top - 6) : (innerHeight/2 - bb.height/2);
  topp = Math.max(marg, Math.min(topp, innerHeight - bb.height - marg));
  b.style.left = Math.round(venstre) + 'px';
  b.style.top  = Math.round(topp) + 'px';
}

function lukkHuskeBoble(){
  huBobleId = null;
  if($('huBoble')) $('huBoble').hidden = true;
  if($('huBobleBak')) $('huBobleBak').hidden = true;
}

function huskeSkjemaHtml(omfang){
  const meg = (localStorage.getItem('fh_navn') || '').split(' ')[0] || '';
  /* Redigering: samme skjema, fylt ut med det som staar der fra foer. */
  const m = huskeSkjema && huskeSkjema.id
    ? (huskeliste || []).find(function(x){ return x.id === huskeSkjema.id; })
    : null;
  const valgt = function(felt, standard){
    return m ? (m[felt] || standard) : standard;
  };
  const liste = function(felt, standard){
    return PERSONER.map(function(n){
      return '<option value="' + esc(n) + '"'
        + (n === valgt(felt, standard) ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
  };
  return '<div class="hu-skjema">'
    + '<input class="hu-felt" id="huOverskrift-' + omfang + '" placeholder="Overskrift" '
    +   'maxlength="80" value="' + esc(m ? (m.overskrift || '') : '') + '">'
    + '<textarea class="hu-felt hu-omr" id="huTekst-' + omfang + '" rows="6" '
    +   'placeholder="Utfyllende tekst (valgfritt)">' + esc(m ? (m.tekst || '') : '') + '</textarea>'
    + '<div class="hu-rad2">'
    +   '<label>Gjelder<select class="hu-felt" id="huGjelder-' + omfang + '">'
    +     liste('gjelder', 'Familie') + '</select></label>'
    +   '<label>Skrevet av<select class="hu-felt" id="huAv-' + omfang + '">'
    +     liste('av', meg) + '</select></label>'
    + '</div>'
    + '<label class="hu-frist">Frist<input class="hu-felt" type="date" id="huFrist-' + omfang + '" '
    +   'value="' + esc(m ? (m.frist || '') : datoNokkel(dagenViser())) + '"></label>'
    + '<div class="hu-knapper">'
    +   '<button class="hu-avbryt" onclick="lukkHuskeSkjema()">Avbryt</button>'
    +   '<button class="hu-lagre" onclick="lagreHuske(\'' + omfang + '\')">'
    +     (m ? 'Lagre' : 'Legg til') + '</button>'
    + '</div>'
    + '</div>';
}

function apneHuskeSkjema(omfang){
  const apen = huskeSkjema && huskeSkjema.omfang === omfang && !huskeSkjema.id;
  huskeSkjema = apen ? null : {omfang: omfang, id: null};
  tegnHuske();
  if(huskeSkjema){
    const f = $('huOverskrift-' + omfang);
    if(f) f.focus();
  }
}

/* Endre et punkt: skjemaet aapnes i samme boks, fylt ut. */
function rediger(id){
  const m = (huskeliste || []).find(function(x){ return x.id === id; });
  if(!m) return;
  const omfang = (m.omfang === 'uke') ? 'uke' : 'dag';
  huskeSkjema = {omfang: omfang, id: id};
  tegnHuske();
  const f = $('huOverskrift-' + omfang);
  if(f) f.focus();
}

function lukkHuskeSkjema(){ huskeSkjema = null; tegnHuske(); }

async function lagreHuske(omfang){
  const o = ($('huOverskrift-' + omfang).value || '').trim();
  if(!o){ $('huOverskrift-' + omfang).focus(); return; }
  const felter = {
    overskrift: o,
    tekst: ($('huTekst-' + omfang).value || '').trim(),
    frist: $('huFrist-' + omfang).value || datoNokkel(dagenViser()),
    omfang: omfang,
    gjelder: $('huGjelder-' + omfang).value,
    av: $('huAv-' + omfang).value
  };
  const endrerId = huskeSkjema && huskeSkjema.id;
  huskeSkjema = null;
  try{
    await endreHuske(function(liste){
      if(endrerId){
        return liste.map(function(m){
          return m.id === endrerId ? Object.assign({}, m, felter, {endret: new Date().toISOString()}) : m;
        });
      }
      return liste.concat([Object.assign({
        id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        laget: new Date().toISOString()
      }, felter)]);
    });
  }catch(e){
    alert('Fikk ikke lagret merknaden: ' + e.message);
  }
}

async function slettHuske(id){
  try{
    await endreHuske(function(liste){
      return liste.filter(function(m){ return m.id !== id; });
    });
  }catch(e){
    alert('Fikk ikke slettet merknaden: ' + e.message);
  }
}

function tegnHuske(){
  try{ tegnHuskeInner(); }
  catch(e){ console.error('Huskelista kunne ikke tegnes:', e); }
}
function tegnHuskeInner(){
  const liste = huskeliste || [];
  lukkHuskeBoble();          /* lista tegnes om - boblen ville pekt paa ingenting */
  middagRedig = false;       /* et halvskrevet notat hoerer til dagen det ble aapnet paa */
  const dag = datoNokkel(dagenViser());
  const uke = ukeNokkel(dagenViser());

  const grupper = [
    {omfang: 'dag', boks: 'huskeIdag',
     treff: liste.filter(function(m){ return m.omfang !== 'uke' && m.frist === dag; })},
    {omfang: 'uke', boks: 'huskeUken',
     treff: liste.filter(function(m){ return m.omfang === 'uke' && ukeAv(m.frist) === uke; })}
  ];

  grupper.forEach(function(g){
    g.treff.sort(function(a, b){ return (a.frist || '').localeCompare(b.frist || ''); });
    const boks = $(g.boks);
    if(!boks) return;
    boks.innerHTML =
        (huskeSkjema && huskeSkjema.omfang === g.omfang ? huskeSkjemaHtml(g.omfang) : '')
      + (g.treff.length
          ? g.treff.map(huskeRad).join('')
          : (huskeSkjema && huskeSkjema.omfang === g.omfang
              ? '' : '<div class="tom">Ingenting notert ennå.</div>'));
  });
}

/* ---------------- Middagsnotat ----------------
   Fri tekst per dato, for dager uten noe i matplanen - "rester" eller
   "pizza fra fryseren". Egen KV-noekkel, saa matplanen fra Matlaging
   ikke roeres. */
let middagNotater = null;
let middagRedig = false;

async function hentMiddagNotat(){
  const r = await fetch('/api/data?key=middagnotat', {cache:'no-store'});
  if(!r.ok) return {};
  const txt = await r.text();
  if(!txt) return {};
  let d = JSON.parse(txt);
  if(d && typeof d === 'object' && d.value !== undefined) d = d.value;
  if(typeof d === 'string') d = JSON.parse(d);
  return (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
}

async function lastMiddagNotat(){
  try{ middagNotater = await hentMiddagNotat(); }
  catch(e){ middagNotater = {}; }
}

function middagNotat(){
  return (middagNotater || {})[datoNokkel(dagenViser())] || '';
}

function apneMiddagNotat(){
  middagRedig = true;
  tegnMiddag(sisteRetter || []);
  const f = $('middagFelt');
  if(f){ f.focus(); f.select(); }
}
function lukkMiddagNotat(){
  middagRedig = false;
  tegnMiddag(sisteRetter || []);
}

async function lagreMiddagNotat(){
  const tekst = ($('middagFelt').value || '').trim();
  const dato = datoNokkel(dagenViser());
  middagRedig = false;
  try{
    const fersk = await hentMiddagNotat();
    if(tekst) fersk[dato] = tekst; else delete fersk[dato];
    const r = await fetch('/api/data?key=middagnotat', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(fersk)
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    middagNotater = fersk;
  }catch(e){
    alert('Fikk ikke lagret middagsnotatet: ' + e.message);
  }
  tegnMiddag(sisteRetter || []);
}

async function lastHuske(){
  try{
    huskeliste = await hentHuske();
  }catch(e){
    huskeliste = [];
  }
  tegnHuske();
}

let sisteRetter = [];

async function tegnMiddag(retter){
  const boks = $('middag');
  sisteRetter = retter || [];

  if(!retter.length){
    const notat = middagNotat();
    if(middagRedig){
      boks.innerHTML = '<div class="middag-merke">Middag</div>'
        + '<textarea class="hu-felt mid-felt" id="middagFelt" rows="2" '
        +   'placeholder="Hva blir det til middag?">' + esc(notat) + '</textarea>'
        + '<div class="hu-knapper" style="margin-top:7px">'
        +   '<button class="hu-avbryt" onclick="lukkMiddagNotat()">Avbryt</button>'
        +   '<button class="hu-lagre" onclick="lagreMiddagNotat()">Lagre</button>'
        + '</div>';
      return;
    }
    boks.innerHTML = '<div class="middag-merke">Middag</div>'
      + (notat
          ? '<div class="mid-notat" onclick="apneMiddagNotat()">' + esc(notat) + '</div>'
          : '<div class="tom mid-tom" onclick="apneMiddagNotat()">'
            + (dagOffset === 0 ? 'Ingenting planlagt i dag.' : 'Ingenting planlagt denne dagen.')
            + '<span class="mid-legg">Skriv inn</span></div>');
    return;
  }
  const forste = retter[0];
  const mitt = tegneNr;
  const bilder = await hentBildeIndeks();
  if(mitt !== tegneNr) return;              /* dagen ble byttet mens bildene lastet */
  const bilde = forste.id && bilder[forste.id];
  /* Trykk gaar rett til oppskriften i Matlaging. Uten id har vi
     ingenting aa lenke til, og da lar vi kortet vaere som foer. */
  const lenke = forste.id ? 'oppskrifter.html?rett=' + encodeURIComponent(forste.id) : '';

  let html = (lenke ? '<a class="middag klikk" href="' + esc(lenke) + '">' : '<div class="middag">')
    + (bilde
        ? '<img class="middag-bilde" src="' + esc(bilde) + '" alt="">'
        : '<div class="middag-ikon">🍽️</div>')
    + '<div class="middag-tekst">'
    +   '<div class="middag-merke">Middag</div>'
    +   '<div class="middag-navn">' + esc(forste.title || 'Uten navn') + '</div>'
    +   (forste.servings ? '<div class="middag-meta">' + esc(forste.servings) + ' porsjoner</div>' : '')
    + '</div>'
    + (lenke ? '<span class="middag-pil">›</span>' : '')
    + (lenke ? '</a>' : '</div>');

  if(retter.length > 1){
    html += '<div class="middag-flere">Også: '
      + retter.slice(1).map(function(r){
          return r.id
            ? '<a class="middag-lenke" href="oppskrifter.html?rett='
              + esc(encodeURIComponent(r.id)) + '">' + esc(r.title || 'Uten navn') + '</a>'
            : esc(r.title || 'Uten navn');
        }).join(', ')
      + '</div>';
  }
  boks.innerHTML = html;
}

/* ============================================================
   Oppdatering
   ============================================================ */
function visNavn(fulltNavn){
  const el = $('brandNavn');
  if(el) el.textContent = String(fulltNavn || '').trim().split(/\s+/)[0] || '';
}

/* Bare planen hentes paa nytt ved dagbytte - vaeret og middagen gjelder
   fortsatt i dag, og skal ikke blinke fordi man blar. */
/* Hver tegning faar sitt eget nummer. Sveiper man raskt, blir svar fra en
   eldre tegning forkastet naar de kommer inn - foer laa det en sperre her
   som droppet den nye tegningen i stedet, saa middagen ble staaende igjen
   paa gaarsdagen. */
let tegneNr = 0;

async function tegnPlanPaaNytt(){
  const mitt = ++tegneNr;
  lukkDetalj();
  settDagsTitler();
  tegnHuske();                     /* boksene foelger dagen man ser paa */
  tegnVaerStripe();                /* det samme gjoer vaeret */
  $('plan').innerHTML   = '<div class="tom">Henter …</div>';
  $('middag').innerHTML = '<div class="tom">Henter …</div>';

  await Promise.all([
    hentPlan().then(function(r){
      if(mitt !== tegneNr) return;          /* overhalt av en nyere sveip */
      tegnPlan(r);
    }).catch(function(e){
      if(mitt !== tegneNr) return;
      $('plan').innerHTML = '<div class="tom feil">Kunne ikke hente planen: ' + esc(e.message) + '</div>';
    }),
    hentMiddag().then(function(r){
      if(mitt !== tegneNr) return;
      return tegnMiddag(r);
    }).catch(function(){
      if(mitt !== tegneNr) return;
      $('middag').innerHTML = '<div class="tom feil">Kunne ikke hente matplanen.</div>';
    })
  ]);
}

/* Dagen er felles for hele skjermen. Sveiper man i planen, middagen eller
   I dag-boksen, flytter alle seg sammen - tre uavhengige dager side om
   side ville vaert umulig aa holde styr paa. */
function settDagsTitler(){
  visTilIdag();
  $('dagLabel').textContent = dagNavn();
}

/* Skjermen staar framme hele dagen. Har noen bladd seg fram i tid og gaatt
   fra den, skal den finne tilbake til i dag av seg selv. */
const HVILE_MS = 3 * 60 * 1000;
let hvileTimer = null;

function erStandard(){
  return dagOffset === 0 && $('detalj').hidden;
}
/* Knappen dukker opp saa snart noe er flyttet fra standard, og forsvinner
   naar alt er tilbake - da har den ingen jobb aa gjoere. */
function visTilIdag(){
  const b = $('tilIdag');
  if(b) b.hidden = (dagOffset === 0);
}
function tilbakeTilStandard(){
  lukkDetalj();
  lukkHuskeBoble();
  huskeSkjema = null;
  const flyttet = (dagOffset !== 0);
  dagOffset = 0;
  tegnVaerStripe();
  visTilIdag();
  if(flyttet) tegnPlanPaaNytt();
}
function nullstillHvile(){
  clearTimeout(hvileTimer);
  hvileTimer = setTimeout(tilbakeTilStandard, HVILE_MS);
}
/* Trykk et annet sted paa siden lukker det som staar aapent. Trykk inne i
   detaljkortet eller paa en avtalerad regnes ikke som utenfor. */
function kobleLukking(){
  document.addEventListener('pointerdown', function(ev){
    const t = ev.target;
    if(huBobleId && !t.closest('.hu-boble') && !t.closest('.hu-rad')) lukkHuskeBoble();
    if($('detalj') && !$('detalj').hidden
       && !t.closest('#detalj') && !t.closest('.plan-rad')) lukkDetalj();
  });
}

function kobleHvile(){
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function(h){
    document.addEventListener(h, nullstillHvile, {passive:true});
  });
  nullstillHvile();
}

function byttDag(steg){
  dagOffset += steg;
  if(dagOffset < -180) dagOffset = -180;   /* en grense, saa man ikke blar seg bort */
  if(dagOffset >  180) dagOffset =  180;
  tegnPlanPaaNytt();
}

/* Sveip paa plankortet. Utslaget maa vaere tydelig vannrett, ellers ville
   vanlig loddrett rulling i lista utloest et dagbytte. */
function kobleSveip(){
  ['plan', 'middag', 'huskeIdag'].forEach(function(id){
    const el = $(id);
    if(el && el.closest('.kort')) sveipPaa(el.closest('.kort'), byttDag);
  });
  /* Vaeret har sitt eget tidsvindu - det skal ikke flytte dagen. */
  sveipPaa($('vaerStripe'), byttDag);
}

function sveipPaa(kort, handling){
  if(!kort) return;
  kort.classList.add('sveipbar');
  let x0 = 0, y0 = 0, aktiv = false;

  function start(x, y){ x0 = x; y0 = y; aktiv = true; }
  function slutt(x, y){
    if(!aktiv) return;
    aktiv = false;
    const dx = x - x0, dy = y - y0;
    if(Math.abs(dx) < 60) return;                  /* for kort til aa vaere ment */
    if(Math.abs(dx) < Math.abs(dy) * 1.5) return;  /* mest loddrett = rulling */
    handling(dx < 0 ? 1 : -1);                     /* dra mot venstre = framover */
  }

  /* Beroering: touchend fyres selv om nettleseren ruller underveis.
     Pointer-hendelser blir avbrutt med pointercancel naar nettleseren
     tar over bevegelsen, og duger derfor ikke alene. */
  kort.addEventListener('touchstart', function(ev){
    if(ev.touches.length !== 1){ aktiv = false; return; }
    start(ev.touches[0].clientX, ev.touches[0].clientY);
  }, {passive:true});
  kort.addEventListener('touchend', function(ev){
    const t = ev.changedTouches[0];
    slutt(t.clientX, t.clientY);
  }, {passive:true});

  /* Mus: her finnes ingen touch-hendelser, saa pointer er eneste vei. */
  kort.addEventListener('pointerdown', function(ev){
    if(ev.pointerType !== 'mouse') return;
    start(ev.clientX, ev.clientY);
  });
  kort.addEventListener('pointerup', function(ev){
    if(ev.pointerType !== 'mouse') return;
    slutt(ev.clientX, ev.clientY);
  });
}

async function oppdaterAlt(manuelt){
  if(S.laster) return;
  /* Ikke tegn planen om igjen under beina paa noen som leser detaljer —
     radene ville byttet plass og indeksene pekt feil. */
  if(!manuelt && !$('detalj').hidden) return;
  S.laster = true;
  if(manuelt){
    $('status').textContent = 'Oppdaterer …';
    lukkDetalj();
    dagOffset = 0;           /* en manuell oppdatering betyr "vis meg naa" */
    bildeIndeks = null;      /* hent bildene på nytt ved manuell oppdatering */
  }

  /* Hver del feiler for seg — vaeret skal ikke ryke fordi kalenderen gjoer det. */
  /* Hvis noe her ryker, maa S.laster likevel nullstilles - ellers blir
     hver senere oppdatering staaende og returnere med én gang. */
  const jobber = [
    hentPlan().then(tegnPlan).catch(function(e){
      $('plan').innerHTML = '<div class="tom feil">Kunne ikke hente planen: ' + esc(e.message) + '</div>';
    }),
    hentVaer().then(tegnVaer).catch(function(e){
      /* Vaeret bor i toppstripa naa. Feiler det, skjuler vi stripa i
         stedet for aa la den staa med gamle tall. */
      $('vaerStripe').hidden = true;
      $('vaerSted').textContent = 'været utilgjengelig';
    }),
    hentMiddag().then(tegnMiddag).catch(function(e){
      $('middag').innerHTML = '<div class="tom feil">Kunne ikke hente matplanen.</div>';
    }),
    lastHuske(),
    lastMiddagNotat()
  ];
  try{
    await Promise.all(jobber);
    $('status').textContent = 'Sist oppdatert '
      + new Date().toLocaleTimeString('no-NO', {hour:'2-digit', minute:'2-digit'});
  } finally {
    S.laster = false;
  }
}

/* ============================================================
   Oppstart
   ============================================================ */
(async function init(){
  tegnKlokke();
  setInterval(tegnKlokke, 10000);

  try{
    const lagret = localStorage.getItem('fh_navn');
    if(lagret) visNavn(lagret);
  }catch(e){}

  const q = new URLSearchParams(location.search);

  if(q.get('error')){
    visPort(true);
    portNote('Microsoft svarte: ' + (q.get('error_description') || q.get('error')));
    history.replaceState({}, '', REDIRECT);
    return;
  }

  if(q.get('code')){
    const verifier = sessionStorage.getItem('fh_verifier');
    const forventet = sessionStorage.getItem('fh_state');
    history.replaceState({}, '', REDIRECT);
    if(!verifier || q.get('state') !== forventet){
      visPort(true);
      portNote('Innloggingen ble avbrutt. Prøv på nytt.');
      return;
    }
    try{
      const d = await bytt({
        grant_type:'authorization_code',
        code:q.get('code'),
        code_verifier:verifier,
        scope:CFG.scopes
      });
      lagreToken(d);
      sessionStorage.removeItem('fh_verifier');
      sessionStorage.removeItem('fh_state');
    }catch(err){
      visPort(true);
      portNote(err.message);
      return;
    }
  } else {
    lesToken();
  }

  if(!(S.token || S.refresh)){
    visPort(true);
    return;
  }
  visPort(false);

  /* Sjekk tilgang foer vi henter noe som helst. */
  const tilgang = await harTilgang();
  if(!tilgang.ok){
    visPort(true);
    $('portKnapp').hidden = true;
    $('portHjem').hidden = false;
    portNote(tilgang.epost
      ? 'Dashboardet er under utvikling og ikke klart for ' + tilgang.epost + ' ennå. Gå tilbake til forsiden.'
      : 'Dashboardet er under utvikling og ikke tilgjengelig ennå.');
    return;
  }

  lesLagretPosisjon();
  await hentFarger();
  graph('/me').then(function(me){
    if(me && me.displayName){
      visNavn(me.displayName);
      try{ localStorage.setItem('fh_navn', me.displayName); }catch(e){}
    }
  }).catch(function(){});

  try{ await oppdaterAlt(false); }
  catch(e){ console.error('Første oppdatering feilet:', e); }

  /* Spoer om posisjon foerst naar skjermen staar der — da kommer
     tillatelsesdialogen oppaa noe ferdig, ikke en tom side. Skjer bare
     én gang; svaret huskes. */
  if(!posisjon.presis){
    finnPosisjon().then(function(){
      if(posisjon.presis) hentVaer().then(tegnVaer).catch(function(){});
    });
  }

  kobleSveip();
  kobleLukking();
  kobleHvile();

  /* Skjermen staar paa hele dagen — hold den fersk. Blar noen fram i tid,
     skal ikke den automatiske oppdateringen dra dem tilbake. */
  setInterval(function(){ if(!document.hidden && dagOffset === 0) oppdaterAlt(false); }, 5*60*1000);
})();

document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(huBobleId) lukkHuskeBoble();
  if($('detalj') && !$('detalj').hidden) lukkDetalj();
});

document.addEventListener('visibilitychange', function(){
  if(!document.hidden){ tegnKlokke(); oppdaterAlt(false); }
});
</script>
