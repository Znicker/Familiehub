/* Posisjon: iPaden staar stille, saa vi spoer enheten én gang og
   husker svaret. Da slipper vi bade tillatelsesdialog hver gang og
   unoedig batteribruk. Uten tillatelse faller vi tilbake til Arendal. */
let posisjon = { lat: STED.lat, lon: STED.lon, navn: STED.navn, presis: false };

function lesLagretPosisjon(){
  try{
    const raw = localStorage.getItem('fh_pos');
    if(!raw) return false;
    const p = JSON.parse(raw);
    if(typeof p.lat === 'number' && typeof p.lon === 'number'){
      posisjon = { lat:p.lat, lon:p.lon, navn:p.navn || 'Din posisjon', presis:true };
      return true;
    }
  }catch(e){}
  return false;
}

async function finnPosisjon(){
  if(lesLagretPosisjon()) return;
  if(!navigator.geolocation) return;
  try{
    const p = await new Promise(function(ok, nei){
      navigator.geolocation.getCurrentPosition(ok, nei, {
        enableHighAccuracy:false, timeout:8000, maximumAge:86400000
      });
    });
    posisjon = {
      lat: Math.round(p.coords.latitude  * 10000) / 10000,
      lon: Math.round(p.coords.longitude * 10000) / 10000,
      navn: 'Din posisjon',
      presis: true
    };
    /* Prøv å sette et stedsnavn — feiler det, står «Din posisjon». */
    try{
      const g = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client'
        + '?latitude=' + posisjon.lat + '&longitude=' + posisjon.lon + '&localityLanguage=no');
      if(g.ok){
        const gd = await g.json();
        const navn = gd.locality || gd.city || gd.principalSubdivision;
        if(navn) posisjon.navn = navn;
      }
    }catch(e){}
    try{ localStorage.setItem('fh_pos', JSON.stringify(posisjon)); }catch(e){}
  }catch(e){
    /* Avslaatt eller tidsavbrudd — Arendal duger. */
  }
}

async function hentVaer(){
  const url = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + posisjon.lat + '&longitude=' + posisjon.lon
    + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m'
    + '&hourly=temperature_2m,apparent_temperature,weather_code,precipitation,precipitation_probability,wind_speed_10m,wind_direction_10m'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant,sunrise,sunset'
    + '&timezone=Europe%2FOslo&forecast_days=5';
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP ' + r.status);
  settSted(posisjon.navn, true);
  return r.json();
}

/* Vaeret foelger dagen man ser paa. Sveip hvor som helst - ogsaa i
   vaerstripa - flytter hele skjermen til samme dag. Meldingen rekker fem
   doegn; utenfor det staar stripa tom. */
let vaerSiste = null;
/* Timevinduet flyttes uavhengig av dagen. Nullstilles naar dagen byttes,
   ellers ville man staatt igjen med et vindu fra i gaar. */
let timeOffset = 0;
const VINDU = 6;

function tegnVaer(d){
  vaerSiste = d;
  tegnVaerStripe();
}

/* Foerste time som skal vises: naa-timen i dag, ellers morgenen den dagen. */
function vaerStart(){
  if(!vaerSiste) return -1;
  const t = vaerSiste.hourly.time;
  if(viserIdag()){
    const naa = new Date();
    const i = t.findIndex(function(x){ return new Date(x) > naa; });
    return i < 0 ? 0 : i;
  }
  const mal = datoNokkel(dagenViser());
  const i = t.findIndex(function(x){ return x.slice(0, 10) === mal && x.slice(11, 13) === '08'; });
  if(i >= 0) return i;
  return t.findIndex(function(x){ return x.slice(0, 10) === mal; });
}

/* Vindretning oppgis meteorologisk: gradene sier hvor vinden kommer FRA.
   Pila skal vise hvor den blaaser MOT, altsaa retning + 180. En pil leses
   raskere paa avstand enn "NOe", og trenger ingen forklaring. */
function vindPil(grader){
  if(grader === null || grader === undefined) return '';
  const v = (Number(grader) + 180) % 360;
  return '<svg class="vt-pil" viewBox="0 0 24 24" aria-hidden="true" '
    + 'style="transform:rotate(' + v + 'deg)">'
    + '<path d="M12 3 L12 21 M12 3 L7 9 M12 3 L17 9" fill="none" '
    + 'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" '
    + 'stroke-linejoin="round"/></svg>';
}

function tegnVaerStripe(){
  const d = vaerSiste;
  if(!d) return;
  const stripe = $('vaerStripe');
  const basis = vaerStart();
  const maks = d.hourly.time.length - VINDU;
  let i0 = basis;
  if(basis >= 0){
    i0 = basis + timeOffset;
    if(i0 < 0) i0 = 0;
    if(i0 > maks) i0 = maks;
    timeOffset = i0 - basis;      /* klem tilbake, saa videre sveip virker */
  }

  if(i0 < 0){
    stripe.innerHTML = '<span class="vt-ingen">Ingen værmelding så langt fram</span>';
    stripe.hidden = false;
    settSted(posisjon.navn, true);
    return;
  }

  let timer = '';
  for(let i = i0; i < i0 + VINDU && i < d.hourly.time.length; i++){
    const t = new Date(d.hourly.time[i]);
    timer += '<span class="vt-d">'
      + '<span class="vt-kl">' + pad(t.getHours()) + '</span>'
      + '<span class="vt-ik">' + vkode(d.hourly.weather_code[i])[0] + '</span>'
      + '<span class="vt-gr">' + rund(d.hourly.temperature_2m[i]) + '°</span>'
      + '</span>';
  }

  /* I dag: naa-tallene. Andre dager: doegnets spenn. */
  const dagIdx = d.daily.time.indexOf(datoNokkel(dagenViser()));
  let ikon, tekst, stort, under;
  if(viserIdag()){
    const n = d.current;
    const iv = vkode(n.weather_code);
    ikon = iv[0]; tekst = iv[1];
    stort = rund(n.temperature_2m) + '°';
    under = 'Føles som ' + rund(n.apparent_temperature) + '°'
          + ' · ' + vindPil(n.wind_direction_10m)
          + rund(n.wind_speed_10m) + ' km/t';
  } else if(dagIdx >= 0){
    const iv = vkode(d.daily.weather_code[dagIdx]);
    ikon = iv[0]; tekst = iv[1];
    stort = rund(d.daily.temperature_2m_max[dagIdx]) + '°';
    under = 'Lavest ' + rund(d.daily.temperature_2m_min[dagIdx]) + '°'
          + ' · ' + vindPil(d.daily.wind_direction_10m_dominant[dagIdx])
          + rund(d.daily.wind_speed_10m_max[dagIdx]) + ' km/t';
  } else {
    ikon = '·'; tekst = ''; stort = '–'; under = '';
  }
  const regn = dagIdx >= 0 ? d.daily.precipitation_sum[dagIdx] : 0;

  stripe.innerHTML =
      '<span class="vt-naa" onclick="vekslVaerBoble(event)">'
    +   '<span class="vt-ikon">' + ikon + '</span>'
    +   '<span class="vt-naa-tall">'
    +     '<span class="vt-grad">' + stort + '</span>'
    +     '<span class="vt-tekst">' + esc(tekst) + '</span>'
    +     (under ? '<span class="vt-vind">' + under + '</span>' : '')
    +   '</span>'
    + '</span>'
    + '<span class="vt-meta">'
    +   (regn > 0.05 ? '<span>' + regn.toFixed(1).replace('.', ',') + ' mm nedbør</span>' : '')
    + '</span>'
    + '<span class="vt-timer"><span class="vt-rad">' + timer + '</span></span>';

  settSted(posisjon.navn, true);
  stripe.hidden = false;
}

/* ---------- Vaerboble ----------
   Trykk paa gradene aapner et fyldigere varsel for DEN dagen skjermen
   staar paa: hele doegnet time for time, og langtidsvarselet under.
   Lukkes som huskeboblen - kryss, trykk utenfor, Escape, sveip, hvile. */
let vaerBobleAapen = false;

function vekslVaerBoble(ev){
  if(ev) ev.stopPropagation();
  if(vaerBobleAapen){ lukkVaerBoble(); return; }
  const d = vaerSiste;
  if(!d) return;

  const dato = datoNokkel(dagenViser());
  const dagIdx = d.daily.time.indexOf(dato);

  const navn = dagenViser().toLocaleDateString('no-NO',
    {weekday:'long', day:'numeric', month:'long'});

  let topp = '<div class="vb-tittel">' + esc(navn) + '</div>';
  if(dagIdx >= 0){
    const iv = vkode(d.daily.weather_code[dagIdx]);
    const sol = (s) => s ? String(s).slice(11, 16) : '';
    topp += '<div class="vb-sammendrag">' + esc(iv[1])
      + ' · ' + rund(d.daily.temperature_2m_min[dagIdx]) + '° til '
      + rund(d.daily.temperature_2m_max[dagIdx]) + '°'
      + ' · ' + vindPil(d.daily.wind_direction_10m_dominant[dagIdx])
      + rund(d.daily.wind_speed_10m_max[dagIdx]) + ' km/t'
      + (d.daily.sunrise ? ' · sol ' + sol(d.daily.sunrise[dagIdx])
          + '–' + sol(d.daily.sunset[dagIdx]) : '')
      + '</div>';
  }

  /* Doegnet time for time. Hver tredje time - 24 rader blir en vegg. */
  let rader = '';
  const h = d.hourly;
  for(let i = 0; i < h.time.length; i++){
    if(h.time[i].slice(0, 10) !== dato) continue;
    const time = Number(h.time[i].slice(11, 13));
    if(time % 3 !== 0) continue;
    const mm = h.precipitation ? h.precipitation[i] : 0;
    rader += '<tr>'
      + '<td class="vb-kl">' + h.time[i].slice(11, 16) + '</td>'
      + '<td class="vb-ik">' + vkode(h.weather_code[i])[0] + '</td>'
      + '<td class="vb-gr">' + rund(h.temperature_2m[i]) + '°</td>'
      + '<td class="vb-regn">' + (mm > 0.05 ? mm.toFixed(1).replace('.', ',') + ' mm' : '') + '</td>'
      + '<td class="vb-vind">' + vindPil(h.wind_direction_10m[i])
      +   rund(h.wind_speed_10m[i]) + '</td>'
      + '</tr>';
  }
  const doegn = rader
    ? '<div class="vb-bolk">Time for time</div><table class="vb-tabell">' + rader + '</table>'
    : '<div class="vb-bolk">Time for time</div><div class="vb-tom">Ingen timevarsel så langt fram.</div>';

  /* Langtidsvarselet - alle doegnene meldingen rekker. */
  let dager = '';
  for(let i = 0; i < d.daily.time.length; i++){
    const dt = new Date(d.daily.time[i] + 'T12:00:00');
    const mm = d.daily.precipitation_sum[i];
    dager += '<tr class="vb-dag' + (d.daily.time[i] === dato ? ' na' : '') + '">'
      + '<td class="vb-dagnavn">' + esc(dt.toLocaleDateString('no-NO', {weekday:'short', day:'numeric'})) + '</td>'
      + '<td class="vb-ik">' + vkode(d.daily.weather_code[i])[0] + '</td>'
      + '<td class="vb-gr">' + rund(d.daily.temperature_2m_min[i]) + '° / '
      +   rund(d.daily.temperature_2m_max[i]) + '°</td>'
      + '<td class="vb-regn">' + (mm > 0.05 ? mm.toFixed(1).replace('.', ',') + ' mm' : '') + '</td>'
      + '<td class="vb-vind">' + vindPil(d.daily.wind_direction_10m_dominant[i])
      +   rund(d.daily.wind_speed_10m_max[i]) + '</td>'
      + '</tr>';
  }

  $('vaerBobleInn').innerHTML = topp + doegn
    + '<div class="vb-bolk">Langtidsvarsel</div>'
    + '<table class="vb-tabell">' + dager + '</table>';

  const b = $('vaerBoble');
  b.hidden = false;
  $('vaerBobleBak').hidden = false;
  vaerBobleAapen = true;

  /* Ankre under vaerstripa, men hold boblen innenfor skjermen. */
  const r = $('vaerStripe').getBoundingClientRect();
  const bb = b.getBoundingClientRect();
  const marg = 12;
  let venstre = r.left + r.width/2 - bb.width/2;
  venstre = Math.max(marg, Math.min(venstre, innerWidth - bb.width - marg));
  let t = r.bottom + 10;
  t = Math.max(marg, Math.min(t, innerHeight - bb.height - marg));
  b.style.left = Math.round(venstre) + 'px';
  b.style.top  = Math.round(t) + 'px';
}

function lukkVaerBoble(){
  vaerBobleAapen = false;
  if($('vaerBoble')) $('vaerBoble').hidden = true;
  if($('vaerBobleBak')) $('vaerBobleBak').hidden = true;
}

/* ============================================================
   Dagens middag
   Leser matplanen fra samme sky-lagring som Matlaging bruker.
   Format: { "2026-W34": { 1:[{id,title,servings}], ... } }  (1 = mandag)
   ============================================================ */
function isoUke(dato){
  const d = new Date(Date.UTC(dato.getFullYear(), dato.getMonth(), dato.getDate()));
  const dagNr = (d.getUTCDay() + 6) % 7;           /* mandag = 0 */
  d.setUTCDate(d.getUTCDate() - dagNr + 3);        /* torsdag i samme uke */
  const aar = d.getUTCFullYear();
  const forsteTorsdag = new Date(Date.UTC(aar, 0, 4));
  const fdNr = (forsteTorsdag.getUTCDay() + 6) % 7;
  forsteTorsdag.setUTCDate(forsteTorsdag.getUTCDate() - fdNr + 3);
  const uke = 1 + Math.round((d - forsteTorsdag) / (7 * 86400000));
  return { aar: aar, uke: uke, dagNr: dagNr + 1 };  /* dagNr: 1 = mandag */
}

/* Bildet hentes fra den lette oppskriftsindeksen, ikke fra hele
   oppskriften — indeksen har en 200px-miniatyr, mens selve oppskriften
   ogsaa baerer alle stegbildene og kan bli mange megabyte. */
let bildeIndeks = null;

async function hentBildeIndeks(){
  if(bildeIndeks) return bildeIndeks;
  bildeIndeks = {};
  try{
    const r = await fetch('/api/data?key=' + encodeURIComponent('p:recipe-index'), {cache:'no-store'});
    if(!r.ok) return bildeIndeks;
    const txt = await r.text();
    if(!txt) return bildeIndeks;
    let d = JSON.parse(txt);
    if(d && typeof d === 'object' && d.value !== undefined) d = d.value;
    if(typeof d === 'string') d = JSON.parse(d);
    if(Array.isArray(d)){
      d.forEach(function(r){ if(r && r.id && r.thumb) bildeIndeks[r.id] = r.thumb; });
    }
  }catch(e){ /* uten bilde klarer vi oss */ }
  return bildeIndeks;
}

async function hentMiddag(){
  const r = await fetch('/api/data?key=' + encodeURIComponent('p:meal-plan'), {cache:'no-store'});
  if(!r.ok){
    if(r.status === 404) return [];
    throw new Error('HTTP ' + r.status);
  }
  const txt = await r.text();
  if(!txt) return [];

  let d = JSON.parse(txt);
  if(d && typeof d === 'object' && d.value !== undefined) d = d.value;
  if(typeof d === 'string') d = JSON.parse(d);
  if(!d || typeof d !== 'object') return [];

  const i = isoUke(dagenViser());
  const nokkel = i.aar + '-W' + String(i.uke).padStart(2, '0');
  const uke = d[nokkel];
  if(!uke) return [];
  return uke[i.dagNr] || uke[String(i.dagNr)] || [];
}

/* ============================================================
   Huskeliste – merknader med frist
   Én KV-noekkel `fh:huskeliste`. Boksene foelger visningen: Merknader
   viser punkter med frist paa dagen man ser paa, Denne uken viser
   punkter for uka den dagen ligger i. Utgraaing maales mot ekte i dag,
   ikke mot dagen man ser paa - ser du framover, staar alt normalt.
   ============================================================ */
const PERSONER = ['Familie', 'Magne', 'Nina', 'Emma', 'Andrea'];
const pad = function(n){ return String(n).padStart(2, '0'); };
let huskeliste = null;
let huskeSkjema = null;          /* 'dag' | 'uke' | null */

/* Kalenderfargen som gjennomsiktig fyll bak hele foeringen. Teksten blir
   staaende moerk mot en lys tone av personens egen farge. */
function rgbAv(hex){
  const h = String(hex || '').replace('#', '').trim();
  const full = h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h;
  if(!/^[0-9a-fA-F]{6}$/.test(full)) return {r:44, g:62, b:80};
  return { r: parseInt(full.slice(0,2),16),
           g: parseInt(full.slice(2,4),16),
           b: parseInt(full.slice(4,6),16) };
}
function dus(hex, a){
  const c = rgbAv(hex);
  return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
}
/* Samme bokstavmerke som i kalenderappen: forbokstaven i kalendernavnet,
   i full farge. Fargefyllet bak foeringen er dust, saa merket er det som
   gjoer hvem det gjelder lesbart paa avstand. */
function initial(navn, farge){
  const b = (navn || '?').trim().charAt(0).toUpperCase();
  return '<span class="ini" style="background:' + esc(farge) + '" title="' + esc(navn || '') + '">'
    + esc(b) + '</span>';
}

function fyll(hex){
  return 'background:' + dus(hex, .16) + ';border-color:' + dus(hex, .34);
}
/* Samme tone som fyll(), men ugjennomsiktig - fargen blandes inn i hvitt i
   stedet for aa legges oppaa. Brukes der noe ligger over annet innhold. */
function tett(hex, a){
  const c = rgbAv(hex);
  const m = function(v){ return Math.round(255 + (v - 255) * a); };
  return 'rgb(' + m(c.r) + ',' + m(c.g) + ',' + m(c.b) + ')';
}

function huskeFarge(navn){
  const i = PERSONER.indexOf(navn);
  return kalenderFarge(navn, i < 0 ? 0 : i);
}
function datoNokkel(d){
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function ukeNokkel(d){
  const i = isoUke(d);
  return i.aar + '-W' + pad(i.uke);
}
function ukeAv(datotekst){
  const b = String(datotekst || '').split('-');
  if(b.length < 3) return '';
  return ukeNokkel(new Date(+b[0], +b[1] - 1, +b[2]));
}

async function hentHuske(){
  const r = await fetch('/api/data?key=huskeliste', {cache:'no-store'});
  if(!r.ok) return [];
  const txt = await r.text();
  if(!txt) return [];
  let d = JSON.parse(txt);
  if(d && typeof d === 'object' && d.value !== undefined) d = d.value;
  if(typeof d === 'string') d = JSON.parse(d);
  return Array.isArray(d) ? d : [];
}

/* Les paa nytt foer skriving. Flere i familien kan skrive samtidig, og
   KV er sist-skriving-vinner - da er vinduet i det minste kort. */
async function endreHuske(endring){
  const fersk = await hentHuske();
  const ny = endring(fersk);
  const r = await fetch('/api/data?key=huskeliste', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(ny)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  huskeliste = ny;
  tegnHuske();
}

function idag0(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

/* Ukedager, mandag foerst - slik uken faktisk leses. */
const UKEDAGER = ['mandag','tirsdag','onsdag','torsdag','fredag','lørdag','søndag'];
const UKEDAG_KORT = ['man','tir','ons','tor','fre','lør','søn'];

function datoFraTekst(t){
  const b = String(t || '').split('-');
  if(b.length < 3) return dagenViser();
  return new Date(+b[0], +b[1] - 1, +b[2]);
}
function ukedagNr(d){ return (d.getDay() + 6) % 7; }
/* Ukemerknader lagres fortsatt med en dato, saa uke- og sorteringslogikken
   staar uroert - men det er ukedagen man velger og ser. */
function datoIUken(basisdato, nr){
  const d = new Date(basisdato.getTime());
  d.setDate(d.getDate() + (nr - ukedagNr(d)));
  return datoNokkel(d);
}

function huskeRad(m){
  const uke = m.omfang === 'uke';
  const ferdig = !!m.ferdig;
  const harTekst = !!(m.tekst || '').trim();
  /* Bare overskriften staar i lista - plassen er knapp. Resten kommer i
     boblen ved trykk. Haken ligger utenfor boksen, til hoeyre. */
  return '<div class="hu-linje' + (ferdig ? ' ferdig' : '') + '">'
    +   '<div class="hu-rad" data-id="' + esc(m.id) + '"'
    +     ' style="' + fyll(huskeFarge(m.gjelder)) + '"'
    +     ' onclick="vekslHuskeBoble(\'' + esc(m.id) + '\', event)">'
    +     initial(m.gjelder, huskeFarge(m.gjelder))
    +     '<span class="hu-tittel">' + esc(m.overskrift || '') + '</span>'
    +     (harTekst ? '<span class="hu-pil">›</span>' : '')
    +     (uke ? '<span class="hu-innen">' + esc(UKEDAG_KORT[ukedagNr(datoFraTekst(m.frist))]) + '</span>' : '')
    +     '<div class="hu-verkt">'
    +       '<button class="hu-knapp hu-endre" onclick="event.stopPropagation(); rediger(\'' + esc(m.id) + '\')" '
    +         'aria-label="Endre">✎</button>'
    +     '</div>'
    +   '</div>'
    +   '<button class="hu-hake" onclick="vekslFerdig(\'' + esc(m.id) + '\')" '
    +     'aria-label="' + (ferdig ? 'Angre' : 'Ferdig') + '">✓</button>'
    + '</div>';
}

async function vekslFerdig(id){
  try{
    await endreHuske(function(liste){
      return liste.map(function(m){
        return m.id === id ? Object.assign({}, m, {ferdig: !m.ferdig}) : m;
      });
    });
  }catch(e){
    alert('Fikk ikke huket av merknaden: ' + e.message);
  }
}

/* ---------------- Boble for én merknad ----------------
   Trykk paa samme rad igjen lukker. Trykk utenfor lukker. Escape lukker. */
let huBobleId = null;

function vekslHuskeBoble(id, ev){
  if(ev) ev.stopPropagation();
  if(huBobleId === id){ lukkHuskeBoble(); return; }
  const m = (huskeliste || []).find(function(x){ return x.id === id; });
  if(!m) return;

  const farge = huskeFarge(m.gjelder);
  /* Ukemerknader har en ukedag, dagens merknader en dato. */
  const frist = !m.frist ? ''
    : (m.omfang === 'uke'
        ? 'innen ' + UKEDAGER[ukedagNr(datoFraTekst(m.frist))]
        : 'frist ' + new Date(m.frist + 'T12:00:00').toLocaleDateString('no-NO',
            {weekday:'long', day:'numeric', month:'long'}));
  $('huBobleInn').innerHTML =
      '<div class="hub-tittel">' + esc(m.overskrift || '') + '</div>'
    + ((m.tekst || '').trim()
        ? '<div class="hub-tekst">' + esc(m.tekst) + '</div>'
        : '<div class="hub-tekst tom">Ingen utfyllende tekst.</div>')
    + '<div class="hub-meta">'
    +   '<span class="hub-prikk" style="background:' + esc(farge) + '"></span>'
    +   esc(m.gjelder || 'Familie')
    +   (frist ? ' · ' + esc(frist) : '')
    +   (m.ferdig ? ' · ferdig' : '')
    +   (m.av ? ' · skrevet av ' + esc(m.av) : '')
    + '</div>';

  const b = $('huBoble');
  b.style.background  = tett(farge, .14);
  b.style.borderColor = tett(farge, .42);
  b.hidden = false;
  $('huBobleBak').hidden = false;
  huBobleId = id;

  /* Ankre boblen ved raden, men hold den innenfor skjermen. */
  const rad = document.querySelector('.hu-rad[data-id="' + id + '"]');
  const r = rad ? rad.getBoundingClientRect() : null;
  const bb = b.getBoundingClientRect();
  const marg = 12;
  let venstre = r ? (r.left - bb.width - 14) : (innerWidth/2 - bb.width/2);
  if(venstre < marg) venstre = r ? Math.min(r.right + 14, innerWidth - bb.width - marg) : marg;
  venstre = Math.max(marg, Math.min(venstre, innerWidth - bb.width - marg));
  let topp = r ? (r.top - 6) : (innerHeight/2 - bb.height/2);
  topp = Math.max(marg, Math.min(topp, innerHeight - bb.height - marg));
  b.style.left = Math.round(venstre) + 'px';
  b.style.top  = Math.round(topp) + 'px';
}

  if(!m) return;
  visHuskeSkjema(m.omfang === 'uke' ? 'uke' : 'dag', m);

function lukkHuskeSkjema(){
  huskeSkjema = null;
  if($('huskeBak'))  $('huskeBak').hidden = true;
  if($('huskeBoks')) $('huskeBoks').hidden = true;
}

async function lagreHuske(){
  if(!huskeSkjema) return;
  const omfang = huskeSkjema.omfang;
  const endrerId = huskeSkjema.id;
  const o = ($('huOverskrift').value || '').trim();
  if(!o){ $('huOverskrift').focus(); return; }

  let frist;
  if(omfang === 'uke'){
    const gml = endrerId
      ? (huskeliste || []).find(function(x){ return x.id === endrerId; })
      : null;
    const basis = (gml && gml.frist) ? datoFraTekst(gml.frist) : dagenViser();
    frist = datoIUken(basis, parseInt($('huInnen').value, 10) || 0);
  }else{
    frist = $('huFrist').value || datoNokkel(dagenViser());
  }

  const felter = {
    overskrift: o,
    tekst: ($('huTekst').value || '').trim(),
    frist: frist,
    omfang: omfang,
    gjelder: $('huGjelder').value,
    av: $('huAv').value
  };
  lukkHuskeSkjema();
  try{
    await endreHuske(function(liste){
      if(endrerId){
        return liste.map(function(m){
          return m.id === endrerId ? Object.assign({}, m, felter, {endret: new Date().toISOString()}) : m;
        });
      }
      return liste.concat([Object.assign({
        id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        laget: new Date().toISOString()
      }, felter)]);
    });
  }catch(e){
    alert('Fikk ikke lagret merknaden: ' + e.message);
  }
}

/* Sletting ligger bak endre-knappen, ikke i lista - der er den for lett
   aa treffe ved et uhell. */
async function slettFraSkjema(){
  const id = huskeSkjema && huskeSkjema.id;
  if(!id) return;
  const m = (huskeliste || []).find(function(x){ return x.id === id; });
  if(!confirm('Slette «' + ((m && m.overskrift) || 'merknaden') + '»?')) return;
  lukkHuskeSkjema();
  await slettHuske(id);
}

async function slettHuske(id){
  try{
    await endreHuske(function(liste){
      return liste.filter(function(m){ return m.id !== id; });
    });
  }catch(e){
    alert('Fikk ikke slettet merknaden: ' + e.message);
  }
}

function tegnHuske(){
  try{ tegnHuskeInner(); }

}
function tegnHuskeInner(){
  const liste = huskeliste || [];
  lukkHuskeBoble();          /* lista tegnes om - boblen ville pekt paa ingenting */
  middagRedig = false;       /* et halvskrevet notat hoerer til dagen det ble aapnet paa */
  const dag = datoNokkel(dagenViser());
  const uke = ukeNokkel(dagenViser());

  const grupper = [
    {omfang: 'dag', boks: 'huskeIdag',
     treff: liste.filter(function(m){ return m.omfang !== 'uke' && m.frist === dag; })},
    {omfang: 'uke', boks: 'huskeUken',
     treff: liste.filter(function(m){ return m.omfang === 'uke' && ukeAv(m.frist) === uke; })}
  ];

  grupper.forEach(function(g){
    /* Avhukede punkter synker til bunnen - de er gjort, men blir staaende
       ut uken saa man ser at de er unnagjort. */
    g.treff.sort(function(a, b){
      if(!!a.ferdig !== !!b.ferdig) return a.ferdig ? 1 : -1;
      return (a.frist || '').localeCompare(b.frist || '');
    });
    const boks = $(g.boks);
    if(!boks) return;
    boks.innerHTML = g.treff.length
      ? g.treff.map(huskeRad).join('')
      : '<div class="tom">Ingenting notert ennå.</div>';
  });
}

/* ---------------- Middagsnotat ----------------
   Fri tekst per dato, for dager uten noe i matplanen - "rester" eller
   "pizza fra fryseren". Egen KV-noekkel, saa matplanen fra Matlaging
   ikke roeres. */
let middagNotater = null;
let middagRedig = false;

async function hentMiddagNotat(){
  const r = await fetch('/api/data?key=middagnotat', {cache:'no-store'});
  if(!r.ok) return {};
  const txt = await r.text();
  if(!txt) return {};
  let d = JSON.parse(txt);
  if(d && typeof d === 'object' && d.value !== undefined) d = d.value;
  if(typeof d === 'string') d = JSON.parse(d);
  return (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
}

async function lastMiddagNotat(){
  try{ middagNotater = await hentMiddagNotat(); }
  catch(e){ middagNotater = {}; }
}

function middagNotat(){
  return (middagNotater || {})[datoNokkel(dagenViser())] || '';
}

function apneMiddagNotat(){
  middagRedig = true;
  tegnMiddag(sisteRetter || []);
  const f = $('middagFelt');
  if(f){ f.focus(); f.select(); }
}
function lukkMiddagNotat(){
  middagRedig = false;
  tegnMiddag(sisteRetter || []);
}

async function lagreMiddagNotat(){
  const tekst = ($('middagFelt').value || '').trim();
  const dato = datoNokkel(dagenViser());
  middagRedig = false;
  try{
    const fersk = await hentMiddagNotat();
    if(tekst) fersk[dato] = tekst; else delete fersk[dato];
    const r = await fetch('/api/data?key=middagnotat', {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(fersk)
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    middagNotater = fersk;
  }catch(e){
    alert('Fikk ikke lagret middagsnotatet: ' + e.message);
  }
  tegnMiddag(sisteRetter || []);
}

async function lastHuske(){
  try{
    huskeliste = await hentHuske();
  }catch(e){
    huskeliste = [];
  }
  tegnHuske();
}

let sisteRetter = [];

async function tegnMiddag(retter){
  const boks = $('middag');
  sisteRetter = retter || [];

  if(!retter.length){
    const notat = middagNotat();
    if(middagRedig){
      boks.innerHTML = '<div class="kort-tittel"><span>Middag</span></div>'
        + '<textarea class="hu-felt mid-felt" id="middagFelt" rows="2" '
        +   'placeholder="Hva blir det til middag?">' + esc(notat) + '</textarea>'
        + '<div class="hu-knapper" style="margin-top:7px">'
        +   '<button class="hu-avbryt" onclick="lukkMiddagNotat()">Avbryt</button>'
        +   '<button class="hu-lagre" onclick="lagreMiddagNotat()">Lagre</button>'
        + '</div>';
      return;
    }
    boks.innerHTML = '<div class="kort-tittel"><span>Middag</span></div>'
      + (notat
          ? '<div class="mid-notat" onclick="apneMiddagNotat()">' + esc(notat) + '</div>'
          : '<div class="tom mid-tom" onclick="apneMiddagNotat()">'
            + (viserIdag() ? 'Ingenting planlagt i dag.' : 'Ingenting planlagt denne dagen.')
            + '<span class="mid-legg">Skriv inn</span></div>');
    return;
  }
  const forste = retter[0];
  const mitt = tegneNr;
  const bilder = await hentBildeIndeks();
  if(mitt !== tegneNr) return;              /* dagen ble byttet mens bildene lastet */
  const bilde = forste.id && bilder[forste.id];
  /* Trykk gaar rett til oppskriften i Matlaging. Uten id har vi
     ingenting aa lenke til, og da lar vi kortet vaere som foer. */
  const lenke = forste.id ? 'oppskrifter.html?rett=' + encodeURIComponent(forste.id) : '';

  let html = (lenke ? '<a class="middag klikk" href="' + esc(lenke) + '">' : '<div class="middag">')
    + '<div class="middag-tekst">'
    +   '<div class="kort-tittel"><span>Middag</span></div>'
    +   '<div class="middag-navn">' + esc(forste.title || 'Uten navn') + '</div>'
    + '</div>'
    + (bilde
        ? '<img class="middag-bilde" src="' + esc(bilde) + '" alt="">'
        : '<div class="middag-ikon">🍽️</div>')
    + (lenke ? '</a>' : '</div>');

  if(retter.length > 1){
    html += '<div class="middag-flere">Også: '
      + retter.slice(1).map(function(r){
          return r.id
            ? '<a class="middag-lenke" href="oppskrifter.html?rett='
              + esc(encodeURIComponent(r.id)) + '">' + esc(r.title || 'Uten navn') + '</a>'
            : esc(r.title || 'Uten navn');
        }).join(', ')
      + '</div>';
  }
  boks.innerHTML = html;
}

/* Bare planen hentes paa nytt ved dagbytte - vaeret og middagen gjelder
   fortsatt i dag, og skal ikke blinke fordi man blar. */
/* Hver tegning faar sitt eget nummer. Sveiper man raskt, blir svar fra en
   eldre tegning forkastet naar de kommer inn - foer laa det en sperre her
   som droppet den nye tegningen i stedet, saa middagen ble staaende igjen
   paa gaarsdagen. */
let tegneNr = 0;

async function tegnPlanPaaNytt(){
  const mitt = ++tegneNr;
  lukkDetalj();
  settDagsTitler();
  tegnHuske();                     /* boksene foelger dagen man ser paa */
  tegnVaerStripe();                /* det samme gjoer vaeret */
  $('plan').innerHTML   = '<div class="tom">Henter …</div>';
  $('middag').innerHTML = '<div class="tom">Henter …</div>';

  await Promise.all([
    hentPlan().then(function(r){
      if(mitt !== tegneNr) return;          /* overhalt av en nyere sveip */
      tegnPlan(r);
    }).catch(function(e){
      if(mitt !== tegneNr) return;
      $('plan').innerHTML = planFeil(e);
    }),
    hentMiddag().then(function(r){
      if(mitt !== tegneNr) return;
      return tegnMiddag(r);
    }).catch(function(){
      if(mitt !== tegneNr) return;
      $('middag').innerHTML = '<div class="tom feil">Kunne ikke hente matplanen.</div>';
    })
  ]);
}

/* Dagen er felles for hele skjermen. Sveiper man i planen, middagen eller
   I dag-boksen, flytter alle seg sammen - tre uavhengige dager side om
   side ville vaert umulig aa holde styr paa. */
function settDagsTitler(){
  visTilIdag();
  $('dagLabel').textContent = dagNavn();
}

/* Skjermen staar framme hele dagen. Har noen bladd seg fram i tid og gaatt
   fra den, skal den finne tilbake til i dag av seg selv. */
const HVILE_MS = 3 * 60 * 1000;
let hvileTimer = null;

function erStandard(){
  return dagOffset === 0 && $('detalj').hidden;
}
/* Knappen dukker opp saa snart noe er flyttet fra standard, og forsvinner
   naar alt er tilbake - da har den ingen jobb aa gjoere. */
function visTilIdag(){
  const b = $('tilIdag');
  if(b) b.hidden = (dagOffset === 0);
}
function tilbakeTilStandard(){
  lukkDetalj();
  lukkHuskeBoble();
  lukkVaerBoble();
  lukkHuskeSkjema();
  const flyttet = (dagOffset !== 0);
  dagOffset = 0;
  tegnVaerStripe();
  visTilIdag();
  if(flyttet) tegnPlanPaaNytt();
}
function nullstillHvile(){
  clearTimeout(hvileTimer);
  hvileTimer = setTimeout(function(){
    if(skjemaAapent()) return;     /* et halvskrevet skjema skal ikke ryke */
    tilbakeTilStandard();
  }, HVILE_MS);
}
/* Trykk et annet sted paa siden lukker det som staar aapent. Trykk inne i
   detaljkortet eller paa en avtalerad regnes ikke som utenfor. */
function kobleLukking(){
  document.addEventListener('pointerdown', function(ev){
    const t = ev.target;
    if(huBobleId && !t.closest('.hu-boble') && !t.closest('.hu-rad')) lukkHuskeBoble();
    if(vaerBobleAapen && !t.closest('.vaer-boble') && !t.closest('.vt-naa')) lukkVaerBoble();
    if($('detalj') && !$('detalj').hidden && !skjemaAapent()
       && !t.closest('#detalj') && !t.closest('.plan-rad')
       && !t.closest('#avtaleBoks') && !t.closest('#huskeBoks')
       && !t.closest('#filviser')) lukkDetalj();
  });
}

function kobleHvile(){
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function(h){
    document.addEventListener(h, nullstillHvile, {passive:true});
  });
  nullstillHvile();
}

function byttDag(steg){
  dagOffset += steg;
  timeOffset = 0;              /* ny dag - vis dagens eget vindu */
  lukkVaerBoble();             /* boblen gjaldt dagen man forlot */
  if(dagOffset < -180) dagOffset = -180;   /* en grense, saa man ikke blar seg bort */
  if(dagOffset >  180) dagOffset =  180;
  tegnPlanPaaNytt();
}

/* Sveip paa plankortet. Utslaget maa vaere tydelig vannrett, ellers ville
   vanlig loddrett rulling i lista utloest et dagbytte. */
function kobleSveip(){
  ['plan', 'middag', 'huskeIdag'].forEach(function(id){
    const el = $(id);
    if(el && el.closest('.kort')) sveipPaa(el.closest('.kort'), byttDag);
  });
  /* Vaerstripa: startet beroeringen inne i timevinduet, flyttes timene.
     Ellers flyttes dagen, som paa resten av skjermen. */
  sveipPaa($('vaerStripe'), byttDag, function(mal){
    return mal && mal.closest && mal.closest('.vt-timer') ? flyttTimer : null;
  });
}

/* Seks timer om gangen, samme vindu som vises. Dagen roeres ikke. */
function flyttTimer(steg){
  timeOffset += steg * VINDU;
  tegnVaerStripe();
}

function sveipPaa(kort, handling, velgHandling){
  if(!kort) return;
  kort.classList.add('sveipbar');
  let x0 = 0, y0 = 0, aktiv = false, valgt = null;

  function start(x, y, mal){
    x0 = x; y0 = y; aktiv = true;
    /* Hvilken handling gjelder avgjoeres ved beroeringens START. Avgjoeres
       den ved slutt, har fingeren ofte forlatt elementet den startet i. */
    valgt = velgHandling ? (velgHandling(mal) || handling) : handling;
  }
  function slutt(x, y){
    if(!aktiv) return;
    aktiv = false;
    const dx = x - x0, dy = y - y0;
    if(Math.abs(dx) < 60) return;                  /* for kort til aa vaere ment */
    if(Math.abs(dx) < Math.abs(dy) * 1.5) return;  /* mest loddrett = rulling */
    valgt(dx < 0 ? 1 : -1);                        /* dra mot venstre = framover */
  }

  /* Beroering: touchend fyres selv om nettleseren ruller underveis.
     Pointer-hendelser blir avbrutt med pointercancel naar nettleseren
     tar over bevegelsen, og duger derfor ikke alene. */
  kort.addEventListener('touchstart', function(ev){
    if(ev.touches.length !== 1){ aktiv = false; return; }
    start(ev.touches[0].clientX, ev.touches[0].clientY, ev.target);
  }, {passive:true});
  kort.addEventListener('touchend', function(ev){
    const t = ev.changedTouches[0];
    slutt(t.clientX, t.clientY);
  }, {passive:true});

  /* Mus: her finnes ingen touch-hendelser, saa pointer er eneste vei. */
  kort.addEventListener('pointerdown', function(ev){
    if(ev.pointerType !== 'mouse') return;
    start(ev.clientX, ev.clientY, ev.target);
  });
  kort.addEventListener('pointerup', function(ev){
    if(ev.pointerType !== 'mouse') return;
    slutt(ev.clientX, ev.clientY);
  });
}

async function oppdaterAlt(manuelt){
  if(S.laster) return;
  /* Ikke tegn planen om igjen under beina paa noen som leser detaljer —
     radene ville byttet plass og indeksene pekt feil. */
  if(!manuelt && (skjemaAapent() || !$('detalj').hidden)) return;
  S.laster = true;
  if(manuelt){
    lukkDetalj();
    dagOffset = 0;           /* en manuell oppdatering betyr "vis meg naa" */
    bildeIndeks = null;      /* hent bildene på nytt ved manuell oppdatering */
  }

  /* Hver del feiler for seg — vaeret skal ikke ryke fordi kalenderen gjoer det. */
  /* Hvis noe her ryker, maa S.laster likevel nullstilles - ellers blir
     hver senere oppdatering staaende og returnere med én gang. */
  const jobber = [
    hentPlan().then(tegnPlan).catch(function(e){
      $('plan').innerHTML = planFeil(e);
    }),
    hentVaer().then(tegnVaer).catch(function(e){
      /* Vaeret bor i toppstripa naa. Feiler det, skjuler vi stripa i
         stedet for aa la den staa med gamle tall. */
      $('vaerStripe').hidden = true;
      settSted('været utilgjengelig', false);
    }),
    hentMiddag().then(tegnMiddag).catch(function(e){
      $('middag').innerHTML = '<div class="tom feil">Kunne ikke hente matplanen.</div>';
    }),
    lastHuske(),
    lastMiddagNotat()
  ];
  try{
    await Promise.all(jobber);
  } finally {
    S.laster = false;
  }
}

    }
  }).catch(function(){});

  try{ await oppdaterAlt(false); }
  catch(e){ console.error('Første oppdatering feilet:', e); }

  /* Spoer om posisjon foerst naar skjermen staar der — da kommer
     tillatelsesdialogen oppaa noe ferdig, ikke en tom side. Skjer bare
     én gang; svaret huskes. */
  if(!posisjon.presis){
    finnPosisjon().then(function(){
      if(posisjon.presis) hentVaer().then(tegnVaer).catch(function(){});
    });
  }

  kobleSveip();
  kobleLukking();
  kobleHvile();

  /* Skjermen staar paa hele dagen — hold den fersk. Blar noen fram i tid,
     skal ikke den automatiske oppdateringen dra dem tilbake. */
  setInterval(function(){ if(!document.hidden && dagOffset === 0) oppdaterAlt(false); }, 5*60*1000);
})();

document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if($('filviser') && !$('filviser').hidden){ lukkViser(); return; }
  if(avtaleAapen){ lukkAvtale(); return; }
  if(huskeSkjema){ lukkHuskeSkjema(); return; }
  if(huBobleId) lukkHuskeBoble();
  if(vaerBobleAapen) lukkVaerBoble();
  if($('detalj') && !$('detalj').hidden) lukkDetalj();
});

document.addEventListener('visibilitychange', function(){
  if(!document.hidden){ tegnKlokke(); oppdaterAlt(false); }
});
</script>
</body>
</html>
