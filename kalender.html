      });

      dagTid.forEach(function(e){
        const chip = document.createElement('div');
        chip.className = 'uke-chip';
        chip.style.background = e.color;
        const tid = '<span class="uke-chip-t">'+pad(e.start.getHours())+'.'+pad(e.start.getMinutes())+'</span>';
        chip.innerHTML = tid + '<span class="uke-chip-n">'+esc(e.title)+'</span>';
        const note = medNotat ? (e.note || '').trim() : '';
        if(note){
          const n = document.createElement('div');
          n.className = 'uke-chip-note';
          n.textContent = note;
          chip.appendChild(n);
          chip.classList.add('har-note');
        }
        chip.title = e.title;
        chip.onclick = function(ev){
          ev.stopPropagation();
          if(skjulTrykk) return;
          visBoble(e.id, ev);            /* ett trykk = detaljer med hele notatet */
        };
        langtTrykk(chip, function(){ endreAvtale(e.id); });
        chip.addEventListener('touchstart', function(ev){ ev.stopPropagation(); }, {passive:true});
        chip.addEventListener('mousedown',  function(ev){ ev.stopPropagation(); });
        cell.appendChild(chip);
      });

      /* langt trykk på tom celle = ny avtale den dagen i denne kalenderen */
      langtTrykk(cell, function(){
        S.sel = d;
        nyAvtale(undefined, undefined, c.kanEndre ? c.id : null);
      });
      row.appendChild(cell);
    });

    scroll.appendChild(row);
  });

  wrap.appendChild(scroll);
  tg.appendChild(wrap);
}

function settVis(v){
  if(S.vis === v) return;
  S.vis = v;
  naviger();
}

/* ---- Fargevelger — kun for sys@neam.no og magne@neam.no ---- */
function vekslPalett(el){
  if(!erFargeAdmin) return;
  const p = el.closest('.cal-rad').querySelector('.cal-palett');
  if(p) p.hidden = !p.hidden;
}
async function settFarge(navn, hex){
  if(!erFargeAdmin) return;
  fargeOverstyring[navn] = hex;
  /* Oppdater alt som allerede er tegnet, så endringen vises umiddelbart */
  S.calendars.forEach(function(c){ if(c.name === navn) c.color = hex; });
  [S.all, S.events].forEach(function(arr){
    (arr || []).forEach(function(e){ if(e.calName === navn) e.color = hex; });
  });
  render();
  await lagreFarger();       /* deles med alle via Cloudflare KV */
}



/* Avtaler som gjelder en dag (bånd-avtaler dekker hver dag de spenner over) */
function planEvs(d){
  return S.events.filter(function(e){
    return erBånd(e) ? dekkerDag(e, d) : sameDay(e.start, d);
  }).sort(function(a, b){
    if(erBånd(a) !== erBånd(b)) return erBånd(a) ? -1 : 1;
    return a.start - b.start;
  });
}

/* Ett avtalekort med notat: ett trykk utvider notatet, langt trykk redigerer */
function planItem(e){
  const it = document.createElement('div');
  it.className = 'plan-item';
  it.style.borderLeftColor = e.color;

  const tid = document.createElement('div');
  tid.className = 'plan-time';
  tid.innerHTML = e.allDay
    ? 'Hele<br>dagen'
    : pad(e.start.getHours())+'.'+pad(e.start.getMinutes())
      + '<br>' + pad(e.end.getHours())+'.'+pad(e.end.getMinutes());
  it.appendChild(tid);

  const main = document.createElement('div');
  main.className = 'plan-main';

  const tittelEl = document.createElement('div');
  tittelEl.className = 'plan-title';
  tittelEl.textContent = e.title;
  main.appendChild(tittelEl);

  const meta = [e.calName, e.where].filter(Boolean).join(' · ');
  if(meta){
    const m = document.createElement('div');
    m.className = 'plan-meta';
    m.textContent = meta;
    main.appendChild(m);
  }

  const note = (e.note || '').trim();
  if(note){
    const n = document.createElement('div');
    n.className = 'plan-note';
    n.textContent = note;
    main.appendChild(n);
    it.classList.add('har-note');
    it.title = 'Trykk for å se hele notatet';
  }

  it.appendChild(main);

  it.onclick = function(){
    if(skjulTrykk) return;               /* nettopp langt trykk / sveip */
    if(note) it.classList.toggle('open');
  };
  langtTrykk(it, function(){ endreAvtale(e.id); });

  return it;
}

function listePeriode(){
  if(S.modus === 'day') return [S.sel];
  if(S.modus === 'week'){
    const s = mandag(S.sel), a = [];
    for(let i=0;i<7;i++) a.push(plussDager(s, i));
    return a;
  }
  const y = S.view.getFullYear(), m = S.view.getMonth(), n = new Date(y, m+1, 0).getDate();
  const a = [];
  for(let d=1; d<=n; d++) a.push(new Date(y, m, d));
  return a;
}

function renderListe(){
  const wrap = $('plan');
  wrap.innerHTML = '';
  const dager = listePeriode();
  const hoppTomme = (S.modus === 'month');   /* måned: bare dager med avtaler */
  let noe = false;

  dager.forEach(function(d){
    const evs = planEvs(d);
    if(hoppTomme && !evs.length) return;
    noe = true;

    const sec = document.createElement('div');
    sec.className = 'plan-sec' + (sameDay(d, new Date()) ? ' idag' : '');
    const head = document.createElement('div');
    const hd = helligdag(d);
    head.className = 'plan-dhead';
    head.innerHTML = esc(DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase()
      + ' · Uke ' + ukeNr(d)) + (hd ? ' <span class="plan-helg">· '+esc(hd)+'</span>' : '');
    if(hd) sec.classList.add('helligdag');
    sec.appendChild(head);

    if(!evs.length){
      const tom = document.createElement('div');
      tom.className = 'plan-tom';
      tom.textContent = '—';
      sec.appendChild(tom);
    } else {
      evs.forEach(function(e){ sec.appendChild(planItem(e)); });
    }
    wrap.appendChild(sec);
  });

  if(!noe){
    const tom = document.createElement('div');
    tom.className = 'plan-tom';
    tom.style.padding = '16px 4px';
    tom.textContent = 'Ingen avtaler i perioden.';
    wrap.appendChild(tom);
  }
}

function renderTid(){
  const antall = S.modus === 'day' ? 1 : 7;
  const start  = S.modus === 'day'
    ? new Date(S.sel.getFullYear(), S.sel.getMonth(), S.sel.getDate())
    : mandag(S.sel);
  const dager = [];
  for(let i=0;i<antall;i++) dager.push(plussDager(start, i));

  const gutW = 54;
  const kols = gutW + 'px repeat(' + antall + ',1fr)';
  const idag = new Date();
  const tg = $('tg');
  tg.innerHTML = '';

  /* --- Topprad med datoer. I dagvisning gjentar den bare overskriften
         over, saa der sloeyfes den helt. --- */
  const head = document.createElement('div');
  head.className = 'tg-head';
  head.style.gridTemplateColumns = kols;
  if(S.modus === 'day') head.style.display = 'none';
  head.appendChild(Object.assign(document.createElement('div'), {className:'tg-corner'}));
  dager.forEach(function(d){
    const c = document.createElement('div');
    const hd = helligdag(d);
    c.className = 'tg-dcol'
      + (sameDay(d, idag) ? ' idag' : '')
      + (sameDay(d, S.sel) ? ' sel' : '')
      + (hd ? ' helligdag' : '');
    c.innerHTML = '<div class="tg-dow">' + DOW[(d.getDay()+6)%7] + '</div>'
                + '<div class="tg-dnum">' + d.getDate() + '</div>'
                + (hd ? '<div class="tg-helg" title="'+esc(hd)+'">'+esc(hd)+'</div>' : '');
    c.onclick = function(){
      if(skjulTrykk) return;
      S.sel = d;
      if(S.modus === 'day'){ refresh(); } else { render(); }
    };
    head.appendChild(c);
  });
  tg.appendChild(head);

  /* --- Rad for heldagsavtaler --- */
  const heleDagen = dager.map(function(d){
    return eventsOn(d).filter(function(e){ return e.allDay; });
  });
  if(heleDagen.some(function(a){ return a.length; })){
    const all = document.createElement('div');
    all.className = 'tg-all';
    all.style.gridTemplateColumns = kols;
    all.appendChild(Object.assign(document.createElement('div'),
      {className:'tg-all-lab', textContent:'Hele dagen'}));
    heleDagen.forEach(function(liste){
      const col = document.createElement('div');
      col.className = 'tg-all-col';
      liste.forEach(function(e){
        const chip = document.createElement('div');
        chip.className = 'tg-chip';
        chip.style.background = e.color;
        chip.textContent = e.title;
        chip.title = e.title;
        chip.onclick = function(ev){ ev.stopPropagation(); visBoble(e.id, ev); };
        col.appendChild(chip);
      });
      all.appendChild(col);
    });
    tg.appendChild(all);
  }

  /* --- Selve timerutenettet --- */
  const scroll = document.createElement('div');
  scroll.className = 'tg-scroll';
  const inner = document.createElement('div');
  inner.className = 'tg-inner';
  inner.style.gridTemplateColumns = kols;
  inner.style.height = (24 * TIME_H) + 'px';

  const gut = document.createElement('div');
  gut.className = 'tg-gut';
  for(let t=1;t<24;t++){
    const s = document.createElement('span');
    s.style.top = (t * TIME_H) + 'px';
    s.textContent = pad(t) + '.00';
    gut.appendChild(s);
  }
  inner.appendChild(gut);

  const strek = 'repeating-linear-gradient(to bottom,'
    + 'transparent 0,transparent ' + (TIME_H-1) + 'px,'
    + 'var(--line) ' + (TIME_H-1) + 'px,var(--line) ' + TIME_H + 'px)';

  dager.forEach(function(d){
    const col = document.createElement('div');
    col.className = 'tg-col' + ((d.getDay()===0 || d.getDay()===6) ? ' helg' : '');
    col.style.background = strek;

    /* trykk på tomt område = ny avtale på det klokkeslettet */
    col.onclick = function(ev){
      if(skjulTrykk || ev.target !== col) return;
      const y = ev.offsetY;
      const time = Math.max(0, Math.min(23, Math.floor(y / TIME_H)));
      const halv = (y % TIME_H) > (TIME_H/2) ? 30 : 0;
      S.sel = d;
      nyAvtale(time, halv);
    };

    const timed = eventsOn(d)
      .filter(function(e){ return !e.allDay; })
      .map(function(e){
        const f = sameDay(e.start, d) ? minutter(e.start) : 0;
        const t = sameDay(e.end, d)   ? minutter(e.end)   : 24*60;
        return {e:e, f:f, t:Math.max(t, f + 20)};
      });

    spor(timed).forEach(function(p){
      const boks = document.createElement('div');
      boks.className = 'tg-ev';
      boks.style.background = p.e.color;
      boks.style.top    = (p.f / 60 * TIME_H) + 'px';
      boks.style.height = Math.max(20, (p.t - p.f) / 60 * TIME_H - 2) + 'px';
      const bredde = 100 / p.baner;
      boks.style.left  = 'calc(' + (p.bane * bredde) + '% + 2px)';
      boks.style.width = 'calc(' + bredde + '% - 4px)';

      const hoy = (p.t - p.f) / 60 * TIME_H;
      let html = '';
      if(hoy >= 34) html += '<div class="tg-ev-t">' + pad(p.e.start.getHours())+'.'+pad(p.e.start.getMinutes()) + '</div>';
      html += '<div class="tg-ev-n">' + esc(p.e.title) + '</div>';
      if(hoy >= 62 && p.e.where) html += '<div class="tg-ev-w">' + esc(p.e.where) + '</div>';
      boks.innerHTML = html;
      boks.title = p.e.title;
      boks.onclick = function(ev){ ev.stopPropagation(); visBoble(p.e.id, ev); };
      col.appendChild(boks);
    });

    /* rød strek for nåtidspunktet */
    if(sameDay(d, idag)){
      const naa = document.createElement('div');
      naa.className = 'tg-naa';
      naa.style.top = (minutter(idag) / 60 * TIME_H) + 'px';
      col.appendChild(naa);
    }

    inner.appendChild(col);
  });

  scroll.appendChild(inner);
  tg.appendChild(scroll);

  /* rull til et fornuftig utgangspunkt */
  const tidligst = dager.reduce(function(m, d){
    return eventsOn(d).filter(function(e){ return !e.allDay; })
      .reduce(function(a, e){ return Math.min(a, minutter(e.start)); }, m);
  }, 8*60);
  scroll.scrollTop = Math.max(0, (Math.min(tidligst, 8*60) / 60 * TIME_H) - 12);
}

function tittel(){
  if(S.modus === 'month') return MND[S.view.getMonth()] + ' ' + S.view.getFullYear();
  if(S.modus === 'day'){
    return DAG[S.sel.getDay()] + ' ' + S.sel.getDate() + '. ' + MND[S.sel.getMonth()].toLowerCase()
      + ' · Uke ' + ukeNr(S.sel);
  }
  const m = mandag(S.sel), s = plussDager(m, 6);
  const sm = m.getMonth() === s.getMonth()
    ? m.getDate() + '.–' + s.getDate() + '. ' + MND[s.getMonth()].toLowerCase()
    : m.getDate() + '. ' + MND[m.getMonth()].toLowerCase().slice(0,3)
      + ' – ' + s.getDate() + '. ' + MND[s.getMonth()].toLowerCase().slice(0,3);
  return 'Uke ' + ukeNr(m) + ' · ' + sm;
}

function settModus(m){
  if(S.modus === m) return;
  S.modus = m;
  const knapper = $('seg').children;
  for(let i=0;i<knapper.length;i++){
    knapper[i].classList.toggle('on', knapper[i].dataset.m === m);
  }
  if(m !== 'month'){
    /* hold månedsvisningen i takt med valgt dag */
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  }
  naviger();
}

function bla(n){
  if(S.modus === 'month'){
    S.view = new Date(S.view.getFullYear(), S.view.getMonth()+n, 1);
    /* la valgt dag følge med inn i den nye måneden */
    const idag = new Date();
    S.sel = (idag.getFullYear() === S.view.getFullYear() && idag.getMonth() === S.view.getMonth())
      ? idag
      : new Date(S.view.getFullYear(), S.view.getMonth(), 1);
  } else if(S.modus === 'week'){
    S.sel = plussDager(S.sel, 7*n);
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  } else {
    S.sel = plussDager(S.sel, n);
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  }
  naviger();
}

/* ============================================================
   Sveip til side for å bytte måned
   ============================================================ */
let skjulTrykk = false;   /* undertrykker klikk rett etter sveip/langt trykk */
let dagpopEl   = null;

/* Fanger og forkaster ETT klikk (det syntetiske som følger en berøring),
   slik at et langt trykk ikke straks lukker dialogen det nettopp åpnet. */
function svelgNesteKlikk(){
  function svelg(e){
    e.stopPropagation(); e.preventDefault();
    document.removeEventListener('click', svelg, true);
    clearTimeout(t);
  }
  document.addEventListener('click', svelg, true);
  const t = setTimeout(function(){
    document.removeEventListener('click', svelg, true);
  }, 700);
}

/* Langt trykk (hold ~0,5 s) på et element. Fungerer med både berøring og mus. */
function langtTrykk(el, handler){
  let timer = null, x0 = 0, y0 = 0;
  function start(e){
    const pt = e.touches ? e.touches[0] : e;
    x0 = pt.clientX; y0 = pt.clientY;
    stopp();
    timer = setTimeout(function(){
      timer = null;
      skjulTrykk = true;
      svelgNesteKlikk();
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(_){} }
      handler();
      setTimeout(function(){ skjulTrykk = false; }, 450);
    }, 480);
  }
  function beveg(e){
    const pt = e.touches ? e.touches[0] : e;
    if(Math.abs(pt.clientX - x0) > 12 || Math.abs(pt.clientY - y0) > 12) stopp();
  }
  function stopp(){ if(timer){ clearTimeout(timer); timer = null; } }
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove',  beveg, {passive:true});
  el.addEventListener('touchend',   stopp, {passive:true});
  el.addEventListener('touchcancel',stopp, {passive:true});
  el.addEventListener('mousedown',  start);
  el.addEventListener('mousemove',  beveg);
  el.addEventListener('mouseup',    stopp);
  el.addEventListener('mouseleave', stopp);
  el.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
}

/* ============================================================
   Dagpanel

   Naar hoeyrekolonnen er borte (Maaned+Kalender og Uke+Plan) vises
   dagen man trykker paa i et panel som dekker halve skjermen. Panelet
   legger seg paa motsatt side av dagen, saa dagen forblir synlig.
   ============================================================ */
let dagPanelEl = null;

function apneDagPanel(dato, kilde){
  lukkDagPanel();

  // Hvilken halvdel ble trykket? Panelet gaar paa den andre siden.
  let tilHoyre = true;
  if(kilde && kilde.getBoundingClientRect){
    const r = kilde.getBoundingClientRect();
    tilHoyre = (r.left + r.width / 2) < window.innerWidth / 2;
  }

  const bak = document.createElement('div');
  bak.className = 'dagpanel-bak';
  bak.onclick = lukkDagPanel;

  const panel = document.createElement('div');
  panel.className = 'dagpanel ' + (tilHoyre ? 'hoyre' : 'venstre');

  document.body.appendChild(bak);
  document.body.appendChild(panel);
  dagPanelEl = { panel: panel, bak: bak };
  tegnDagPanel();
}

function tegnDagPanel(){
  if(!dagPanelEl) return;
  const d = S.sel, today = new Date();
  const evs = eventsOn(d);

  const topp = document.createElement('div');
  topp.className = 'dagpanel-topp';

  const tit = document.createElement('div');
  tit.className = 'dagpanel-tittel';
  tit.textContent = sameDay(d, today)
    ? 'I dag'
    : DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase();
  topp.appendChild(tit);

  const tall = document.createElement('span');
  tall.className = 'dagpanel-tall';
  tall.textContent = evs.length ? evs.length + (evs.length === 1 ? ' avtale' : ' avtaler') : '';
  topp.appendChild(tall);

  const lukk = document.createElement('button');
  lukk.className = 'dagpanel-lukk';
  lukk.setAttribute('aria-label', 'Lukk');
  lukk.innerHTML = '&times;';
  lukk.onclick = lukkDagPanel;
  topp.appendChild(lukk);

  const liste = document.createElement('div');
  liste.className = 'dagpanel-liste';
  if(!evs.length){
    liste.innerHTML = '<div class="msg">Ingen avtaler denne dagen.</div>';
  } else {
    liste.innerHTML = evs.map(function(e){
      const time = e.allDay
        ? 'Hele<br>dagen'
        : pad(e.start.getHours())+'.'+pad(e.start.getMinutes())
          + '<br>' + pad(e.end.getHours())+'.'+pad(e.end.getMinutes());
      const meta = [e.calName, e.where].filter(Boolean).join(' · ');
      return '<div class="ev klikk" onclick="visBoble(\''+e.id+'\', event)">'
        + '<div class="ev-time">'+time+'</div>'
        + '<div class="ev-body">'
        +   '<div class="ev-title">'+esc(e.title)+'</div>'
        +   '<div class="ev-meta"><span class="ev-who" style="background:'+e.color+'"></span>'+esc(meta)+'</div>'
        + '</div></div>';
    }).join('');
  }

  const ny = document.createElement('button');
  ny.className = 'dagpanel-ny';
  ny.textContent = '+ Ny avtale';
  ny.onclick = function(){ lukkDagPanel(); nyAvtale(); };

  dagPanelEl.panel.innerHTML = '';
  dagPanelEl.panel.appendChild(topp);
  dagPanelEl.panel.appendChild(liste);
  dagPanelEl.panel.appendChild(ny);
}

function lukkDagPanel(){
  if(!dagPanelEl) return;
  dagPanelEl.panel.remove();
  dagPanelEl.bak.remove();
  dagPanelEl = null;
}

/* Meny som spretter opp ved langt trykk på en dag:
   ingen avtaler → rett til ny; ellers «Ny avtale» + liste å redigere fra. */
function dagMeny(d){
  lukkDagMeny();
  const evs = eventsOn(d);
  if(!evs.length){ S.sel = d; render(); nyAvtale(); return; }

  const veil = document.createElement('div');
  veil.className = 'dagpop';
  veil.onclick = function(e){ if(e.target === veil) lukkDagMeny(); };

  const card = document.createElement('div');
  card.className = 'dagpop-card';

  const head = document.createElement('div');
  head.className = 'dagpop-head';
  head.textContent = DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase();
  card.appendChild(head);

  const ny = document.createElement('button');
  ny.className = 'dagpop-ny';
  ny.textContent = '+ Ny avtale';
  ny.onclick = function(){ lukkDagMeny(); S.sel = d; render(); nyAvtale(); };
  card.appendChild(ny);

  const liste = document.createElement('div');
  liste.className = 'dagpop-liste';
  evs.forEach(function(e){
    const row = document.createElement('button');
    row.className = 'dagpop-ev';
    const tid = e.allDay ? 'Hele dagen'
      : pad(e.start.getHours()) + '.' + pad(e.start.getMinutes());
    row.innerHTML = '<span class="dagpop-dot" style="background:'+e.color+'"></span>'
      + '<span class="dagpop-tid">'+esc(tid)+'</span>'
      + '<span class="dagpop-navn">'+esc(e.title)+'</span>';
    row.onclick = function(ev){ lukkDagMeny(); visBoble(e.id, ev); };
    liste.appendChild(row);
  });
  card.appendChild(liste);

  veil.appendChild(card);
  document.body.appendChild(veil);
  dagpopEl = veil;
}
function lukkDagMeny(){
  if(dagpopEl){ dagpopEl.remove(); dagpopEl = null; }
}

(function sveip(){
  let x0 = 0, y0 = 0, aktiv = false;

  function start(e){
    if(e.touches.length !== 1){ aktiv = false; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    aktiv = true;
  }
  function slutt(e){
    if(!aktiv) return;
    aktiv = false;
    const t  = e.changedTouches[0];
    const dx = t.clientX - x0;
    const dy = t.clientY - y0;
    if(Math.abs(dx) < 60) return;                    /* for kort til å være sveip */
    if(Math.abs(dx) < Math.abs(dy) * 1.5) return;    /* mest opp/ned — la rulling gå */
    skjulTrykk = true;
    bla(dx < 0 ? 1 : -1);
    setTimeout(function(){ skjulTrykk = false; }, 400);
  }

  const panel = document.querySelector('.cal-panel');
  if(panel){
    /* capture-fasen: fanges selv om brikker stopper bobling for langt trykk */
    panel.addEventListener('touchstart', start, {passive:true, capture:true});
    panel.addEventListener('touchend',   slutt, {passive:true, capture:true});
  }
})();

/* Juster antall linjer per rute når vinduet endrer størrelse */
let rzTimer;
window.addEventListener('resize', function(){
  clearTimeout(rzTimer);
  rzTimer = setTimeout(function(){ if(S.token||S.refresh) fyllAvtaler(); }, 180);
});

   Oppstart
   ============================================================ */
/* Andre etappe av utloggingen: rydder Access-sesjonen naar vi er
   tilbake fra Microsoft. Maa kjoere foer alt annet paa siden. */
(function fullfoerUtlogging(){
  let flagg = null;
  try{ flagg = sessionStorage.getItem('fh_ut'); }catch(_){}
  if(!flagg) return;
  try{ sessionStorage.removeItem('fh_ut'); }catch(_){}
  location.replace('/cdn-cgi/access/logout');
})();

(async function init(){
  /* Vis et eventuelt lagret navn straks, saa det ikke staar tomt mens
     Graph-kallet paagaar. Overskrives naar det ekte svaret kommer. */
  try{
    const lagret = localStorage.getItem('fh_navn');
    if(lagret){
      const el = $('brandNavn');
      if(el) el.textContent = String(lagret).trim().split(/\s+/)[0] || '';
    }
  }catch(e){}

  const q = new URLSearchParams(location.search);

  if(q.get('error')){
    $('gateNote').textContent = 'Microsoft svarte: ' + (q.get('error_description') || q.get('error'));
    history.replaceState({}, '', REDIRECT);
    render();
    return;
  }

  if(q.get('code')){
    const verifier = sessionStorage.getItem('fh_verifier');
    const expect   = sessionStorage.getItem('fh_state');
    history.replaceState({}, '', REDIRECT);
    if(!verifier || q.get('state') !== expect){
      $('gateNote').textContent = 'Innloggingen ble avbrutt. Prøv på nytt.';
      render();
      return;
    }
    try{
      const d = await exchange({
        grant_type:'authorization_code',
        code:q.get('code'),
        code_verifier:verifier,
        scope:CFG.scopes
      });
      saveTokens(d);
      sessionStorage.removeItem('fh_verifier');
      sessionStorage.removeItem('fh_state');
    }catch(err){
      $('gateNote').textContent = err.message;
      render();
      return;
    }
  } else {
    loadTokens();
  }

  /* Access-identiteten er uavhengig av Microsoft-tokenet, så navnet under
     logoen vises også før man har logget inn i selve kalenderen. */
  const identitet = hentIdentitet();

  render();
  if(S.token || S.refresh){
    /* Identitet og felles farger hentes samtidig med brukerinfo —
       de er små kall og skal ikke forsinke kalenderlastingen. */
    await Promise.all([
      loadMe().catch(function(){}),
      identitet,
      hentFarger()
    ]);

    /* Delt iPad: Access-sesjonen og Microsoft-tokenet er to uavhengige
       identiteter, og de kan komme i utakt ved brukerbytte. Vi logger
       avviket, men kaster ingenting — det er ikke gitt hvilken av dem
       som er den utdaterte. Utloggingen i index.html rydder begge. */
    if(minEpost && S.me){
      const graphEpost = normEpost(S.me.mail || S.me.userPrincipalName || '');
      if(graphEpost && graphEpost !== minEpost){
        console.warn('Identiteter i utakt — Access: ' + minEpost + ', Microsoft: ' + graphEpost);
      }
    }
    render();
    await refresh();
  }
})();

document.addEventListener('visibilitychange', function(){
  if(!document.hidden) refresh();
});
</script>
