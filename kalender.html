/* Lista begynner paa dagen man staar paa - i dag, eller den man har
   valgt i maaned eller uke - og gaar framover derfra. */
/* Lista rekker to aar fram, men henter tre maaneder om gangen og
   utvider seg naar man ruller mot bunnen. */
/* Ingen yttergrense - lista utvider seg saa langt man orker aa rulle.
   Den henter fortsatt bare en bolk om gangen. */
const LISTE_BOLK = 92;       /* tre maaneder om gangen framover */
const LISTE_BAK_BOLK = 31;   /* en maaned om gangen bakover */
let listeVindu = LISTE_BOLK;
let listeBak = 0;

function nullstillListe(){ listeVindu = LISTE_BOLK; listeBak = 0; }

/* Ruller man mot bunnen hentes flere dager framover, mot toppen flere
   bakover. Ved bakoverutvidelse maa rullingen flyttes like mye, ellers
   ville lista hoppet under fingeren. */
let listeUtvider = false;

/* Dagen som staar oeverst i synsfeltet akkurat naa */
function oeversteDag(el){
  const topp = el.getBoundingClientRect().top;
  const seksjoner = el.querySelectorAll('.plan-sec');
  for(let i = 0; i < seksjoner.length; i++){
    if(seksjoner[i].getBoundingClientRect().bottom > topp + 4){
      return { dato: seksjoner[i].dataset.dato,
               avvik: seksjoner[i].getBoundingClientRect().top - topp };
    }
  }
  return null;
}

/* Ruller tilbake til samme dag etter at lista er tegnet paa nytt */
function rullTilDag(el, anker){
  if(!anker) return;
  const sec = el.querySelector('.plan-sec[data-dato="' + anker.dato + '"]');
  if(!sec) return;
  el.scrollTop = sec.offsetTop - (anker.avvik || 0);
}

function listeRulling(){
  const el = $('plan');
  if(!el || S.vis !== 'liste' || listeUtvider) return;

  /* fyllFraCache foerst: avtalene for de nye dagene ligger som regel
     allerede i cachen. Uten dette ble dagene tegnet tomme, hoppet over,
     og lista saa ut til aa staa stille til hentingen var ferdig. */
  const ned = el.scrollTop + el.clientHeight > el.scrollHeight - 400;
  const opp = el.scrollTop < 300;
  if(!ned && !opp) return;

  listeUtvider = true;

  /* Utvid perioden foerst, saa vi kan se om noe faktisk maa hentes. */
  if(ned) listeVindu += LISTE_BOLK;
  else    listeBak   += LISTE_BAK_BOLK;

  const maaHente = !cacheDekker();
  /* Merket vises foer arbeidet starter, og ombyggingen utsettes ett
     bilde. Uten det rakk ikke nettleseren aa tegne merket. */
  if(maaHente) visLaster(true, true);

  requestAnimationFrame(function(){
    fyllFraCache();
    renderListe();          /* holder selv blikket paa samme dag */

    if(!maaHente){          /* alt laa lokalt - ingen grunn til mer */
      listeUtvider = false;
      return;
    }
    lasterStraks = true;
    Promise.resolve(last(false)).catch(function(){}).then(function(){
      visLaster(false);
      listeUtvider = false;
    });
  });
}

function listeStart(){
  const d = new Date(S.sel.getFullYear(), S.sel.getMonth(), S.sel.getDate());
  return plussDager(d, -listeBak);
}

function listePeriode(){
  const start = listeStart();
  const a = [];
  for(let i = 0; i < listeBak + listeVindu; i++) a.push(plussDager(start, i));
  return a;
}

let listeLyttes = false;

function renderListe(){
  const wrap = $('plan');
  if(!listeLyttes){
    wrap.addEventListener('scroll', listeRulling, {passive:true});
    listeLyttes = true;
  }

  /* Lista tegnes ogsaa naar en henting blir ferdig. Uten dette hoppet
     den tilbake til toppen midt i rullingen. Ankeret hentes alltid -
     staar man helt oeverst og lista utvides bakover, er det nettopp da
     posisjonen maa holdes. */
  const anker = oeversteDag(wrap);

  wrap.innerHTML = '';
  const dager = listePeriode();
  const hoppTomme = true;   /* rullende liste: bare dager med avtaler */
  let noe = false;

  dager.forEach(function(d){
    const evs = planEvs(d);
    if(hoppTomme && !evs.length) return;
    noe = true;

    const sec = document.createElement('div');
    sec.className = 'plan-sec' + (sameDay(d, new Date()) ? ' idag' : '');
    sec.dataset.dato = dato2str(d);
    const head = document.createElement('div');
    const hd = helligdag(d);
    head.className = 'plan-dhead';
    head.innerHTML = '<span class="plan-uke">Uke ' + ukeNr(d) + '</span> · '
      + esc(DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase())
      + (hd ? ' <span class="plan-helg">· '+esc(hd)+'</span>' : '');
    if(hd) sec.classList.add('helligdag');
    sec.appendChild(head);

    if(!evs.length){
      const tom = document.createElement('div');
      tom.className = 'plan-tom';
      tom.textContent = '—';
      sec.appendChild(tom);
    } else {
      /* Regnes én gang per dag, ikke én gang per rad */
      const koll = planKollisjoner(evs);
      evs.forEach(function(e){ sec.appendChild(planItem(e, koll)); });
    }
    wrap.appendChild(sec);
  });

  if(!noe){
    const tom = document.createElement('div');
    tom.className = 'plan-tom';
    tom.style.padding = '16px 4px';
    tom.textContent = 'Ingen avtaler i perioden.';
    wrap.appendChild(tom);
  }

  rullTilDag(wrap, anker);
}

function tittel(){
  /* Lista ruller framover fra dagen man staar paa */
  if(S.vis === 'liste'){
    const d = S.sel, idag = new Date();
    return (sameDay(d, idag) ? 'Fra i dag' : 'Fra ' + d.getDate() + '. '
      + MND[d.getMonth()].toLowerCase());
  }
  if(S.modus === 'month') return MND[S.view.getMonth()] + ' ' + S.view.getFullYear();
  if(S.modus === 'day'){
    return DAG[S.sel.getDay()] + ' ' + S.sel.getDate() + '. ' + MND[S.sel.getMonth()].toLowerCase()
      + ' · Uke ' + ukeNr(S.sel);
  }
  const m = mandag(S.sel), s = plussDager(m, 6);
  const sm = m.getMonth() === s.getMonth()
    ? m.getDate() + '.–' + s.getDate() + '. ' + MND[s.getMonth()].toLowerCase()
    : m.getDate() + '. ' + MND[m.getMonth()].toLowerCase().slice(0,3)
      + ' – ' + s.getDate() + '. ' + MND[s.getMonth()].toLowerCase().slice(0,3);
  return 'Uke ' + ukeNr(m) + ' · ' + sm;
}

function bla(n){
  /* I lista blar vi en uke om gangen fra startdagen */
  if(S.vis === 'liste'){
    S.sel = plussDager(S.sel, 7*n);
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
    naviger();
    return;
  }
  if(S.modus === 'month'){
    S.view = new Date(S.view.getFullYear(), S.view.getMonth()+n, 1);
    /* la valgt dag følge med inn i den nye måneden */
    const idag = new Date();
    S.sel = (idag.getFullYear() === S.view.getFullYear() && idag.getMonth() === S.view.getMonth())
      ? idag
      : new Date(S.view.getFullYear(), S.view.getMonth(), 1);
  } else if(S.modus === 'week'){
    S.sel = plussDager(S.sel, 7*n);
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  } else {
    S.sel = plussDager(S.sel, n);
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  }
  naviger();
}

/* ============================================================
   Sveip til side for å bytte måned
   ============================================================ */
let skjulTrykk = false;   /* undertrykker klikk rett etter sveip/langt trykk */
let dagpopEl   = null;

/* Fanger og forkaster ETT klikk (det syntetiske som følger en berøring),
   slik at et langt trykk ikke straks lukker dialogen det nettopp åpnet. */
function svelgNesteKlikk(){
  function svelg(e){
    e.stopPropagation(); e.preventDefault();
    document.removeEventListener('click', svelg, true);
    clearTimeout(t);
  }
  document.addEventListener('click', svelg, true);
  const t = setTimeout(function(){
    document.removeEventListener('click', svelg, true);
  }, 700);
}

/* Langt trykk (hold ~0,5 s) på et element. Fungerer med både berøring og mus. */
function langtTrykk(el, handler){
  let timer = null, x0 = 0, y0 = 0;
  function start(e){
    const pt = e.touches ? e.touches[0] : e;
    x0 = pt.clientX; y0 = pt.clientY;
    stopp();
    timer = setTimeout(function(){
      timer = null;
      skjulTrykk = true;
      svelgNesteKlikk();
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(_){} }
      handler();
      setTimeout(function(){ skjulTrykk = false; }, 450);
    }, 480);
  }
  function beveg(e){
    const pt = e.touches ? e.touches[0] : e;
    if(Math.abs(pt.clientX - x0) > 12 || Math.abs(pt.clientY - y0) > 12) stopp();
  }
  function stopp(){ if(timer){ clearTimeout(timer); timer = null; } }
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove',  beveg, {passive:true});
  el.addEventListener('touchend',   stopp, {passive:true});
  el.addEventListener('touchcancel',stopp, {passive:true});
  el.addEventListener('mousedown',  start);
  el.addEventListener('mousemove',  beveg);
  el.addEventListener('mouseup',    stopp);
  el.addEventListener('mouseleave', stopp);
  el.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
}

/* ============================================================
   Dagpanel

   Naar hoeyrekolonnen er borte (Maaned+Kalender og Uke+Plan) vises
   dagen man trykker paa i et panel som dekker halve skjermen. Panelet
   legger seg paa motsatt side av dagen, saa dagen forblir synlig.
   ============================================================ */
let dagPanelEl = null;

/* midtX er senterpunktet til det man trykket paa, maalt FOER render().
   Etter render() er elementet byttet ut, og maalingen ville gitt 0 -
   som gjorde at panelet alltid havnet paa hoeyre side. */
function apneDagPanel(dato, midtX){
  lukkDagPanel();

  const tilHoyre = (typeof midtX === 'number')
    ? (midtX < window.innerWidth / 2)
    : true;

  const bak = document.createElement('div');
  bak.className = 'dagpanel-bak';
  bak.onclick = lukkSidepaneler;

  const panel = document.createElement('div');
  panel.className = 'dagpanel ' + (tilHoyre ? 'hoyre' : 'venstre');

  document.body.appendChild(bak);
  document.body.appendChild(panel);
  dagPanelEl = { panel: panel, bak: bak };
  tegnDagPanel();
}

function tegnDagPanel(){
  if(!dagPanelEl) return;
  const d = S.sel, today = new Date();
  const evs = eventsOn(d);

  const topp = document.createElement('div');
  topp.className = 'dagpanel-topp';

  const tit = document.createElement('div');
  tit.className = 'dagpanel-tittel';
  tit.textContent = sameDay(d, today)
    ? 'I dag'
    : DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase();
  topp.appendChild(tit);

  const tilbake = document.createElement('button');
  tilbake.type = 'button';
  tilbake.className = 'dagpanel-tilbake';
  tilbake.innerHTML = '&larr; Lukk';
  tilbake.onclick = lukkDagPanel;
  topp.insertBefore(tilbake, topp.firstChild);

  const tall = document.createElement('span');
  tall.className = 'dagpanel-tall';
  tall.textContent = evs.length ? evs.length + (evs.length === 1 ? ' avtale' : ' avtaler') : '';
  topp.appendChild(tall);

  const liste = document.createElement('div');
  liste.className = 'dagpanel-liste';
  if(!evs.length){
    liste.innerHTML = '<div class="msg">Ingen avtaler denne dagen.</div>';
  } else {
    liste.innerHTML = evs.map(function(e){
      const time = e.allDay
        ? 'Hele<br>dagen'
        : pad(e.start.getHours())+'.'+pad(e.start.getMinutes())
          + '<br>' + pad(e.end.getHours())+'.'+pad(e.end.getMinutes());
      const meta = e.where || '';
      return '<div class="ev klikk" style="background:'+dusFast(e.color,.18)+';border-color:'+dus(e.color,.62)+'" onclick="visBoble(\''+e.id+'\', event)">'
        + '<div class="ev-stor-ini" style="background:'+e.color+'" title="'+esc(e.calName||'')+'">'
        +   esc(initialFor(e.calId, e.calName))+'</div>'
        + '<div class="ev-time">'+time+'</div>'
        + '<div class="ev-body">'
        +   '<div class="ev-title">'+esc(e.title)+klipsHtml(e)+'</div>'
        +   (meta ? '<div class="ev-meta">'+esc(meta)+'</div>' : '')
        + '</div></div>';
    }).join('');
  }

  const ny = document.createElement('button');
  ny.className = 'dagpanel-ny';
  ny.textContent = '+ Ny avtale';
  ny.onclick = function(){ lukkDagPanel(); nyAvtale(); };

  dagPanelEl.panel.innerHTML = '';
  dagPanelEl.panel.appendChild(topp);
  dagPanelEl.panel.appendChild(liste);
  dagPanelEl.panel.appendChild(ny);
}

function lukkDagPanel(){
  if(!dagPanelEl) return;
  dagPanelEl.panel.remove();
  dagPanelEl.bak.remove();
  dagPanelEl = null;
}

/* Meny som spretter opp ved langt trykk på en dag:
   ingen avtaler → rett til ny; ellers «Ny avtale» + liste å redigere fra. */
function dagMeny(d){
  lukkDagMeny();
  const evs = eventsOn(d);
  if(!evs.length){ S.sel = d; render(); nyAvtale(); return; }

  const veil = document.createElement('div');
  veil.className = 'dagpop';
  veil.onclick = function(e){ if(e.target === veil) lukkDagMeny(); };

  const card = document.createElement('div');
  card.className = 'dagpop-card';

  const head = document.createElement('div');
  head.className = 'dagpop-head';
  head.textContent = DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase();
  card.appendChild(head);

  const ny = document.createElement('button');
  ny.className = 'dagpop-ny';
  ny.textContent = '+ Ny avtale';
  ny.onclick = function(){ lukkDagMeny(); S.sel = d; render(); nyAvtale(); };
  card.appendChild(ny);

  /* Overskrift over lista, saa det er tydelig at et trykk her gaar
     rett til redigering og ikke bare viser detaljene. */
  const endreTit = document.createElement('div');
  endreTit.className = 'dagpop-bolk';
  endreTit.textContent = 'Endre';
  card.appendChild(endreTit);

  const liste = document.createElement('div');
  liste.className = 'dagpop-liste';
  evs.forEach(function(e){
    const row = document.createElement('button');
    row.className = 'dagpop-ev';
    const tid = e.allDay ? 'Hele dagen'
      : tid2str(e.start) + '–' + tid2str(e.end);
    row.innerHTML = '<span class="dagpop-ini" style="background:'+e.color+'" title="'
      + esc(e.calName || '')+'">'+esc(initialFor(e.calId, e.calName))+'</span>'
      + '<span class="dagpop-tid">'+esc(tid)+'</span>'
      + '<span class="dagpop-navn">'+esc(e.title)+klipsHtml(e)+'</span>';
    row.onclick = function(){ lukkDagMeny(); endreAvtale(e.id); };
    liste.appendChild(row);
  });
  card.appendChild(liste);

  veil.appendChild(card);
  document.body.appendChild(veil);
  dagpopEl = veil;
}
function lukkDagMeny(){
  if(dagpopEl){ dagpopEl.remove(); dagpopEl = null; }
}

(function sveip(){
  let x0 = 0, y0 = 0, aktiv = false;

  function start(e){
    if(e.touches.length !== 1){ aktiv = false; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    aktiv = true;
  }
  function slutt(e){
    if(!aktiv) return;
    aktiv = false;
    const t  = e.changedTouches[0];
    const dx = t.clientX - x0;
    const dy = t.clientY - y0;
    if(Math.abs(dx) < 60) return;                    /* for kort til å være sveip */
    if(Math.abs(dx) < Math.abs(dy) * 1.5) return;    /* mest opp/ned — la rulling gå */
    skjulTrykk = true;
    bla(dx < 0 ? 1 : -1);
    setTimeout(function(){ skjulTrykk = false; }, 400);
  }

  const panel = document.querySelector('.cal-panel');
  if(panel){
    /* capture-fasen: fanges selv om brikker stopper bobling for langt trykk */
    panel.addEventListener('touchstart', start, {passive:true, capture:true});
    panel.addEventListener('touchend',   slutt, {passive:true, capture:true});
  }
})();

/* Juster antall linjer per rute når vinduet endrer størrelse */
/* Naar vinduet endrer stoerrelse - typisk fordi telefonen snus - maa
   det som er regnet ut i piksler regnes om. Hurtigvelgeren har et
   fast antall kolonner satt i JS; uten dette ble kolonnene fra
   liggende visning staaende og dyttet toppen ut av stilling. */
let rzTimer;
function etterEndring(){
  if(!(S.token || S.refresh)) return;
  renderHurtigKal();
  fyllAvtaler();
}
window.addEventListener('resize', function(){
  clearTimeout(rzTimer);
  rzTimer = setTimeout(etterEndring, 180);
});
window.addEventListener('orientationchange', function(){
  clearTimeout(rzTimer);
  rzTimer = setTimeout(etterEndring, 220);
});

/* Andre etappe av utloggingen: rydder Access-sesjonen naar vi er
   tilbake fra Microsoft. Maa kjoere foer alt annet paa siden. */
(function fullfoerUtlogging(){
  let flagg = null;
  try{ flagg = sessionStorage.getItem('fh_ut'); }catch(_){}
  if(!flagg) return;
  try{ sessionStorage.removeItem('fh_ut'); }catch(_){}
  location.replace('/cdn-cgi/access/logout');
})();

(async function init(){
  /* Vis et eventuelt lagret navn straks, saa det ikke staar tomt mens
     Graph-kallet paagaar. Overskrives naar det ekte svaret kommer. */
  try{
    const lagret = localStorage.getItem('fh_navn');
    if(lagret){
      const el = $('brandNavn');
      if(el) el.textContent = String(lagret).trim().split(/\s+/)[0] || '';
    }
  }catch(e){}

  const q = new URLSearchParams(location.search);

  if(q.get('error')){
    $('gateNote').textContent = 'Microsoft svarte: ' + (q.get('error_description') || q.get('error'));
    history.replaceState({}, '', REDIRECT);
    render();
    return;
  }

  if(q.get('code')){
    const verifier = sessionStorage.getItem('fh_verifier');
    const expect   = sessionStorage.getItem('fh_state');
    history.replaceState({}, '', REDIRECT);
    if(!verifier || q.get('state') !== expect){
      $('gateNote').textContent = 'Innloggingen ble avbrutt. Prøv på nytt.';
      render();
      return;
    }
    try{
      const d = await exchange({
        grant_type:'authorization_code',
        code:q.get('code'),
        code_verifier:verifier,
        scope:CFG.scopes
      });
      saveTokens(d);
      sessionStorage.removeItem('fh_verifier');
      sessionStorage.removeItem('fh_state');
    }catch(err){
      $('gateNote').textContent = err.message;
      render();
      return;
    }
  } else {
    loadTokens();
  }

  /* Access-identiteten er uavhengig av Microsoft-tokenet, så navnet under
     logoen vises også før man har logget inn i selve kalenderen. */
  const identitet = hentIdentitet();

  render();
  if(S.token || S.refresh){
    /* Vis det vi hadde sist med én gang. Da staar ikke appen tom mens
       Microsoft svarer - og oppfriskningen skjer stille i bakgrunnen. */
    const harLokalt = lesLokalt();
    if(harLokalt){
      fyllFraCache();
      render();
      lasterStille = true;
    }

    /* Identitet og felles farger hentes samtidig med brukerinfo —
       de er små kall og skal ikke forsinke kalenderlastingen. */
    await Promise.all([
      loadMe().catch(function(){}),
      identitet,
      hentFarger(),
      hentTildeling()
    ]);

    /* Delt iPad: Access-sesjonen og Microsoft-tokenet er to uavhengige
       identiteter, og de kan komme i utakt ved brukerbytte. Vi logger
       avviket, men kaster ingenting — det er ikke gitt hvilken av dem
       som er den utdaterte. Utloggingen i index.html rydder begge. */
    if(minEpost && S.me){
      const graphEpost = normEpost(S.me.mail || S.me.userPrincipalName || '');
      if(graphEpost && graphEpost !== minEpost){
        console.warn('Identiteter i utakt — Access: ' + minEpost + ', Microsoft: ' + graphEpost);
      }
    }
    render();
    try{ await refresh(); }
    finally{ lasterStille = false; }
  }
})();

document.addEventListener('visibilitychange', function(){
  if(!document.hidden) refresh();
});
