       iPad   700-1300  display og betjening, leses paa avstand
       PC     > 1300    oversikt, taaler tett informasjon
     --t-rute er tekst inne i rutenettet: ukedagsforkortelser, ukenummer,
     helgemerker, initialer og chips. Den finnes fordi maaneds- og
     ukevisningen har celler med fast hoeyde - rundes den opp til
     etikettstoerrelse, flyter innholdet ut av cellene.
     Samme skala som de andre filene - hold dem like. */
  --t-rute:10px;
  --t-etikett:11px;
  --t-meta:13px;
  --t-brod:15px;
  --t-stor:20px;
  --t-display:46px;
  --t-pil:20px;
  --t-ikon:28px;

  --bg-1:#F5F5F5; --bg-2:#FAFAFA; --paper:#FFFFFF;
  --ink:#2C3E50; --ink-soft:#5A6C7D;
  --line:rgba(44,62,80,.10);
  --grid:rgba(44,62,80,.20);
  --shadow:0 2px 10px rgba(0,0,0,.08);
  --radius:18px;
  /* Handlingsfarger, samme som i handleliste og oppskrifter:
     groenn skaper noe, blaa gjoer noe med det som finnes. */
  --handling-ny:#4F8F5F;
  --blaa:#4A7FA8;
}
/* iPad: leses paa avstand, alt et hakk opp */
@media(min-width:700px){
  :root{
    --t-rute:11px; --t-etikett:12px; --t-meta:14px; --t-brod:17px;
    --t-stor:22px; --t-display:60px; --t-pil:22px; --t-ikon:32px;
  }
}
/* PC: naert oeye, taaler tett informasjon - tilbake til mobilskalaen. */
@media(min-width:1300px){
  :root{
    --t-rute:10px; --t-etikett:11px; --t-meta:13px; --t-brod:15px;
    --t-stor:20px; --t-display:60px; --t-pil:20px; --t-ikon:28px;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{width:100%;height:100%}
body{
  font-family:'Archivo',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg-1),var(--bg-2));
  background-attachment:fixed;
  -webkit-user-select:none;user-select:none;
  overflow:hidden;
}
.shell{
  height:100%;height:100dvh;
  max-width:1600px;margin:0 auto;
  padding:16px 20px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;
}

/* ---------- Topplinje ---------- */
.top{
  display:flex;align-items:center;gap:16px;flex-shrink:0;
  padding-bottom:12px;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0;text-decoration:none;color:inherit}
.brand-icon{
  width:52px;height:52px;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:7px;
  box-shadow:0 3px 12px rgba(0,0,0,.26);
}
.brand-icon img{width:100%;height:auto;display:block}
.brand-title{font-size:var(--t-stor);font-weight:700;text-transform:uppercase;letter-spacing:.05em;line-height:1.15}
.brand-sub{
  font-size:var(--t-etikett);color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.1em;font-weight:600;margin-top:2px;
}
.brand-navn{color:var(--ink);font-weight:700}
.brand-navn:not(:empty)::before{content:'\00b7';margin:0 5px;font-weight:600;color:var(--ink-soft)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.who{font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);text-align:right;line-height:1.45}
.who b{display:block;font-family:'Archivo',sans-serif;font-size:var(--t-brod);color:var(--ink);font-weight:700}

/* ---------- Knapper ---------- */
.btn{
  font-family:'Archivo',sans-serif;font-size:var(--t-meta);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;color:var(--ink);cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn:active{transform:scale(.97)}
@media(hover:hover){.btn:hover{box-shadow:var(--shadow)}}
.btn.ghost{background:none;color:var(--ink-soft);font-size:var(--t-etikett);padding:6px 14px}
.btn.big{padding:14px 30px;font-size:var(--t-brod);background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- Hovedrutenett ---------- */
.grid{
  flex:1;min-height:0;
  display:grid;grid-template-columns:1fr 300px;gap:14px;
}
/* Uke + Plan er den ene kombinasjonen som trenger all bredden: syv
   kronologiske soeyler side om side. Alle andre visninger beholder
   hoeyrekolonnen, som viser dagen man trykker paa. */
.grid.uten-side{grid-template-columns:1fr}
.grid.uten-side .side{display:none}
.panel{
  background:var(--paper);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);
}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-shrink:0}
.panel-title{font-size:var(--t-meta);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft)}
.panel-note{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);opacity:.75}

.cal-panel{display:flex;flex-direction:column;min-height:0}
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.side .panel{display:flex;flex-direction:column;min-height:0}
.side .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.side-day{flex:1 1 55%}
.side-cals{flex:1 1 45%}

/* ---------- Månedsnavigasjon ---------- */
.mnav{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-bottom:12px;flex-shrink:0}
.mnav-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mnav-title{font-size:var(--t-stor);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.mnav-btns{margin-left:auto;display:flex;gap:8px}
.mnav-btns button{
  height:34px;min-width:34px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--bg-2);color:var(--ink);
  font-family:'Archivo',sans-serif;font-size:var(--t-brod);cursor:pointer;line-height:1;
}
.mnav-btns button.txt{font-size:var(--t-etikett);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mnav-btns button:active{transform:scale(.94)}

/* ---------- Kalenderrutenett ---------- */
.cal{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:26px repeat(7,1fr);
  grid-template-rows:auto repeat(6,1fr);
  gap:1px;background:var(--grid);
  border:1px solid var(--grid);border-radius:12px;overflow:hidden;
}
.cal-dow{
  background:var(--bg-2);
  text-align:center;font-size:var(--t-etikett);font-weight:700;
  color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;
  padding:8px 0;
}
.cal-cell{
  background:var(--paper);
  padding:6px 7px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;gap:3px;
  transition:background .12s ease;
}
.cal-cell.blank{background:var(--bg-2);cursor:default}
.cal-wk{
  background:var(--bg-2);display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-rute);color:var(--ink-soft);
}
.uke.endag .uke-row{min-height:74px}

/* Helligdager (røde dager) */
.cal-cell.helligdag{background:rgba(180,68,58,.09)}
.cal-cell.helligdag.sel{background:var(--ink)}
.cal-helg{
  font-size:var(--t-rute);font-weight:700;line-height:1.05;color:#B4443A;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;
}
.cal-cell.sel .cal-helg{color:#F3B0A8}
.uke-dcol.helligdag,.uke-cell.helligdag,.tg-dcol.helligdag{background:rgba(180,68,58,.08)}
.uke-helg,.tg-helg{
  font-size:var(--t-rute);font-weight:700;color:#B4443A;line-height:1.1;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;
}
.plan-helg{color:#B4443A;font-weight:700}
@media(hover:hover){.cal-cell:not(.blank):hover{background:#F2F5F7}}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-cell.sel{background:var(--ink)}
.cal-cell.sel:hover{background:var(--ink)}
.cal-cell.sel .cal-num,.cal-cell.sel .cal-ev,
.cal-cell.sel .cal-ev-t,.cal-cell.sel .cal-more{color:#fff}
.cal-num{font-size:var(--t-brod);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;flex-shrink:0}
.cal-cell.weekend .cal-num{color:var(--ink-soft)}

.cal-evs{display:flex;flex-direction:column;gap:3px;overflow:hidden;min-height:0}
.cal-ev{
  font-family:'Archivo',sans-serif;
  font-size:var(--t-etikett);font-weight:600;line-height:1.28;
  display:flex;gap:5px;align-items:flex-start;
}
.cal-ev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.cal-ev-x{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cal-ev-t{font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-right:3px}
.cal-more{font-size:var(--t-etikett);font-weight:700;color:var(--ink-soft);letter-spacing:.03em;padding-left:11px}

/* ---------- Avtaleliste ---------- */
.ev{display:flex;gap:12px;padding:11px 0}
.ev:first-child{padding-top:0}
.ev + .ev{border-top:1px solid var(--line)}
.ev-time{
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-meta);color:var(--ink-soft);
  min-width:48px;padding-top:2px;font-variant-numeric:tabular-nums;line-height:1.5;
}
.ev-body{flex:1;min-width:0}
.ev-title{font-size:var(--t-brod);font-weight:700;line-height:1.35}
.ev-meta{font-size:var(--t-meta);color:var(--ink-soft);margin-top:3px;font-weight:500}
.ev-who{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* ---------- Kalenderfiltre ---------- */
.cal-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:var(--t-brod);cursor:pointer}
.cal-row + .cal-row{border-top:1px solid var(--line)}
.cal-row.off{opacity:.38}
.cal-swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0}
button.cal-swatch{width:16px;height:16px;border:none;padding:0;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.cal-rad + .cal-rad{border-top:1px solid var(--line)}
.cal-rad .cal-row + .cal-row{border-top:none}
.cal-palett{display:flex;flex-wrap:wrap;gap:8px;padding:2px 2px 10px 26px}
.cal-palett[hidden]{display:none}
.cal-palett .farge{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);
  box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;transition:transform .1s ease;
}
.cal-palett .farge:active{transform:scale(.88)}
.cal-palett .farge.valgt{box-shadow:0 0 0 2px var(--ink)}
.cal-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft)}
.cal-toggle{
  margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  font-size:var(--t-etikett);font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-soft);cursor:pointer;background:none;border:none;
  font-family:'Archivo',sans-serif;text-align:left;width:100%;
}

/* ---------- Tidsrutenett: uke og dag ---------- */
.tg{
  flex:1;min-height:0;display:flex;flex-direction:column;
  border:1px solid var(--grid);border-radius:12px;overflow:hidden;background:var(--paper);
}
.tg-head,.tg-all,.tg-inner{display:grid}
.tg-head{
  background:var(--bg-2);border-bottom:1px solid var(--grid);flex-shrink:0;
}
.tg-corner{border-right:1px solid var(--grid)}
.tg-dcol{
  padding:7px 4px 8px;text-align:center;cursor:pointer;
  border-left:1px solid var(--grid);transition:background .12s ease;
}
.tg-dcol:first-of-type{border-left:none}
@media(hover:hover){.tg-dcol:hover{background:#EDF1F4}}
.tg-dcol.idag .tg-dnum{
  background:var(--ink);color:#fff;border-radius:999px;
  display:inline-block;min-width:28px;padding:1px 7px;
}
.tg-dcol.sel{background:#EDF1F4;box-shadow:inset 0 -3px 0 var(--ink)}
.tg-dow{
  font-size:var(--t-rute);font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-soft);
}
.tg-dnum{font-size:var(--t-stor);font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}

.tg-all{
  background:var(--bg-2);border-bottom:1px solid var(--grid);flex-shrink:0;
  max-height:74px;overflow-y:auto;
}
.tg-all-lab{
  border-right:1px solid var(--grid);
  font-size:var(--t-rute);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);padding:7px 6px 0;text-align:right;
}
.tg-all-col{border-left:1px solid var(--grid);padding:5px 4px;display:flex;flex-direction:column;gap:3px}
.tg-all-col:first-of-type{border-left:none}
.tg-chip{
  font-size:var(--t-etikett);font-weight:700;color:#fff;border-radius:5px;
  padding:3px 6px;cursor:pointer;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.tg-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.tg-inner{position:relative}
.tg-gut{position:relative;border-right:1px solid var(--grid)}
.tg-gut span{
  position:absolute;right:7px;transform:translateY(-50%);
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-rute);color:var(--ink-soft);
}
.tg-col{position:relative;border-left:1px solid var(--grid)}
.tg-col:first-of-type{border-left:none}
.tg-col.helg{background:rgba(44,62,80,.022)}
.tg-ev{
  position:absolute;border-radius:7px;padding:4px 7px;overflow:hidden;
  cursor:pointer;color:#fff;box-shadow:0 1px 3px rgba(44,62,80,.22);
  border-left:3px solid rgba(255,255,255,.45);
}
.tg-ev-t{font-size:var(--t-rute);font-weight:700;opacity:.88;font-variant-numeric:tabular-nums}
.tg-ev-n{font-size:var(--t-etikett);font-weight:700;line-height:1.25}
.tg-ev-w{font-size:var(--t-rute);opacity:.85;margin-top:1px;line-height:1.2}
.tg-naa{position:absolute;left:0;right:0;height:2px;background:#B4443A;z-index:4;pointer-events:none}
.tg-naa::before{
  content:'';position:absolute;left:-4px;top:-3px;
  width:8px;height:8px;border-radius:50%;background:#B4443A;
}

/* Visningsvelger */
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{
  font-family:'Archivo',sans-serif;font-size:var(--t-etikett);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;
  border:none;background:none;color:var(--ink-soft);
  padding:7px 14px;border-radius:999px;cursor:pointer;
}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px rgba(44,62,80,.14)}

/* ---------- Meldinger ---------- */
.msg{font-size:var(--t-brod);color:var(--ink-soft);padding:8px 0;line-height:1.55}
.msg.err{color:#B4443A}

/* ---------- Dialogvindu ---------- */
/* ---------- Detaljboble ---------- */
.boble-bak{position:fixed;inset:0;z-index:70;background:transparent}
.boble{
  position:fixed;z-index:71;
  background:var(--paper);border-radius:16px;
  padding:18px 20px 20px;width:min(340px,calc(100vw - 32px));
  box-shadow:0 12px 38px rgba(0,0,0,.24);
}
/* Selve boblen scroller ikke — da ville krysset og pekeren forsvunnet.
   Innholdet scroller i stedet, saa lukkeknappen alltid er innen rekkevidde. */
#bobleInn{
  max-height:min(56vh,400px);overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.boble::after{
  content:'';position:absolute;width:14px;height:14px;
  background:var(--paper);transform:rotate(45deg);
}
.boble[data-side="ned"]::after{top:-6px;left:var(--peker,24px)}
.boble[data-side="opp"]::after{bottom:-6px;left:var(--peker,24px)}
.boble-lukk{
  position:absolute;top:9px;right:11px;background:none;border:none;
  font-size:var(--t-pil);line-height:1;color:var(--ink-soft);cursor:pointer;
  padding:2px 7px;font-family:inherit;
}
.boble-topp{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.boble-prikk{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.boble-kal{font-size:var(--t-rute);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.boble-tittel{font-size:var(--t-stor);font-weight:700;line-height:1.25;padding-right:26px}
.boble-tid{font-size:var(--t-brod);font-weight:600;color:#4A7FA8;margin-top:4px;font-variant-numeric:tabular-nums}
.boble-sted{font-size:var(--t-meta);color:var(--ink-soft);margin-top:5px}
.boble-notat{
  margin-top:13px;padding-top:12px;border-top:1px solid var(--line);
  font-size:var(--t-brod);line-height:1.5;white-space:pre-wrap;word-wrap:break-word;
}
.boble-notat.ingen{color:var(--ink-soft);font-style:italic}
.boble-knapp{
  margin-top:15px;width:100%;background:var(--ink);color:#fff;border:none;
  border-radius:999px;padding:11px;font-family:inherit;font-size:var(--t-meta);
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;
}
.boble-knapp:active{opacity:.85}

.veil{
  position:fixed;inset:0;background:rgba(44,62,80,.45);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:90;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.veil[hidden]{display:none}
.dlg{
  background:var(--paper);border-radius:18px;width:100%;max-width:460px;
  max-height:92dvh;display:flex;flex-direction:column;
  box-shadow:0 20px 50px rgba(44,62,80,.3);
}
.dlg-head{
  display:flex;align-items:center;gap:12px;
  padding:18px 20px 14px;border-bottom:1px solid var(--line);flex-shrink:0;
}
.dlg-title{font-size:var(--t-brod);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.dlg-x{
  margin-left:auto;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg-2);color:var(--ink-soft);
  font-size:var(--t-pil);line-height:1;cursor:pointer;
}
.dlg-body{padding:18px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dlg-foot{
  display:flex;align-items:center;gap:10px;
  padding:14px 20px 18px;border-top:1px solid var(--line);flex-shrink:0;
}
.dlg-foot .right{margin-left:auto;display:flex;gap:10px}

.fld{margin-bottom:14px}
.fld:last-child{margin-bottom:0}
.fld label{
  display:block;font-size:var(--t-etikett);font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--ink-soft);margin-bottom:6px;
}
.fld input[type=text],.fld input[type=date],.fld input[type=time],
.fld select,.fld textarea{
  width:100%;font-family:'Archivo',sans-serif;font-size:var(--t-brod);color:var(--ink);
  background:var(--bg-2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;-webkit-appearance:none;appearance:none;
}
.fld select{background-image:none}
.fld textarea{resize:vertical;min-height:70px;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:var(--ink);background:var(--paper);
}
.fld-row{display:flex;gap:10px}
.fld-row > *{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:var(--t-brod);font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--ink);cursor:pointer}
.dlg-msg{font-size:var(--t-meta);color:#B4443A;line-height:1.5;margin-top:12px}
.dlg-msg[hidden]{display:none}

.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.fare{color:#B4443A;border-color:rgba(180,68,58,.35);background:none}
.btn[disabled]{opacity:.5;pointer-events:none}

.ev.klikk{cursor:pointer;border-radius:8px;transition:background .12s ease}
@media(hover:hover){.ev.klikk:hover{background:var(--bg-2)}}

/* ---------- Innlogging ---------- */
.gate-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.gate{text-align:center;padding:40px 22px;max-width:520px}
.gate-icon{
  width:88px;height:88px;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;padding:12px;
  margin:0 auto 20px;box-shadow:0 3px 12px rgba(0,0,0,.18);
}
.gate-icon img{width:100%;height:auto;display:block}
.gate h2{font-size:var(--t-stor);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.gate p{font-size:var(--t-brod);color:var(--ink-soft);margin:12px auto 26px;line-height:1.6}
.gate small{display:block;margin-top:22px;font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);opacity:.8;line-height:1.7}

/* ---------- Bunn ---------- */
footer{
  flex-shrink:0;padding-top:10px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);
}
footer .btn{margin-left:auto}

/* ---------- Ukevisning: kalendere som rader ---------- */
.uke{flex:1;min-height:0;display:flex;flex-direction:column}
.uke-head{display:grid;background:var(--bg-2);border-bottom:1px solid var(--grid);flex-shrink:0}
.uke-corner{
  border-right:1px solid var(--grid);display:flex;align-items:center;gap:6px;
  padding:0 10px;font-size:var(--t-rute);font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);
}
.uke-dcol{
  padding:7px 4px 8px;text-align:center;cursor:pointer;
  border-left:1px solid var(--grid);transition:background .12s ease;
}
.uke-dcol:first-of-type{border-left:none}
@media(hover:hover){.uke-dcol:hover{background:#EDF1F4}}
.uke-dcol.idag .uke-dnum{
  background:var(--ink);color:#fff;border-radius:999px;
  display:inline-block;min-width:26px;padding:1px 6px;
}
.uke-dcol.sel{background:#EDF1F4;box-shadow:inset 0 -3px 0 var(--ink)}
.uke-dow{font-size:var(--t-rute);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.uke-dnum{font-size:var(--t-stor);font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}

.uke-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.uke-row{display:grid;border-bottom:1px solid var(--line);min-height:58px}
.uke-row:last-child{border-bottom:none}
.uke-lab{
  border-right:1px solid var(--grid);background:var(--bg-2);
  display:flex;align-items:center;gap:8px;padding:8px 10px;
}
.uke-swatch{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.uke-navn{
  font-size:var(--t-meta);font-weight:700;line-height:1.2;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.uke-cell{
  border-left:1px solid var(--grid);padding:5px;cursor:pointer;min-width:0;
  display:flex;flex-direction:column;gap:4px;
}
.uke-cell:first-of-type{border-left:none}
.uke-cell.helg{background:rgba(44,62,80,.03)}
.uke-cell.idag{background:rgba(184,217,71,.12)}
.uke-chip{
  color:#fff;border-radius:7px;padding:4px 7px;cursor:pointer;
  font-size:var(--t-etikett);font-weight:700;line-height:1.28;overflow:hidden;
  box-shadow:0 1px 2px rgba(44,62,80,.18);
}
.uke-chip.hel{border-left:3px solid rgba(255,255,255,.5)}
.uke-chip-t{font-variant-numeric:tabular-nums;opacity:.9;margin-right:5px;font-size:var(--t-etikett)}

/* ---------- Heldags / fleredags bånd (måned) ---------- */
.cal-bars{display:flex;flex-direction:column;gap:2px;margin:0 -7px 3px}
.cal-band{
  height:16px;display:flex;align-items:center;color:#fff;
  font-size:var(--t-etikett);font-weight:700;line-height:1;padding:0 6px;
  overflow:hidden;white-space:nowrap;
}
.cal-band.tom{background:transparent!important}
.cal-band.s{border-top-left-radius:6px;border-bottom-left-radius:6px}
.cal-band.e{border-top-right-radius:6px;border-bottom-right-radius:6px}
.cal-cell.sel .cal-band{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}

/* ---------- Heldags / fleredags bånd (uke) ---------- */
.uke-band{
  margin:0 -5px 0;padding:5px 7px;color:#fff;
  font-size:var(--t-etikett);font-weight:700;line-height:1.2;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;
}
.uke-band.s{border-top-left-radius:7px;border-bottom-left-radius:7px}
.uke-band.e{border-top-right-radius:7px;border-bottom-right-radius:7px}

/* ---------- Planvisning (Dagsplan / Ukeplan) ---------- */
.plan{flex:1;min-height:0;overflow-y:auto;padding:2px 2px 8px}
.plan-dhead{
  font-family:'Archivo',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;font-size:var(--t-meta);color:var(--ink);
  padding:12px 4px 8px;position:sticky;top:0;background:var(--paper);z-index:1;
}
.plan-sec.idag .plan-dhead{box-shadow:inset 3px 0 0 #b8d947;padding-left:9px}
.plan-sec.idag .plan-dhead::after{content:' · i dag';color:var(--ink-soft);font-weight:600}
.plan-item{
  display:flex;gap:12px;align-items:flex-start;
  padding:11px 13px;margin:0 0 8px;background:var(--paper);
  border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;
  cursor:pointer;transition:background .12s ease;
}
@media(hover:hover){.plan-item:hover{background:#F5F7F4}}
.plan-time{
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);
  min-width:48px;text-align:right;line-height:1.35;font-variant-numeric:tabular-nums;flex-shrink:0;
}
.plan-main{min-width:0;flex:1}
.plan-title{font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--t-brod);line-height:1.25;overflow-wrap:anywhere}
.plan-meta{font-size:var(--t-etikett);color:var(--ink-soft);margin-top:3px}
.plan-note{
  font-size:var(--t-meta);line-height:1.4;color:var(--ink);margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.plan-item.open .plan-note{-webkit-line-clamp:unset;overflow:visible}
.plan-item.har-note .plan-note{position:relative}
.plan-item.har-note::after{
  content:'\2304';color:var(--ink-soft);font-size:var(--t-brod);line-height:1;
  align-self:center;flex-shrink:0;margin-left:2px;transition:transform .15s ease;
}
.plan-item.har-note.open::after{transform:rotate(180deg)}
.plan-tom{color:var(--ink-soft);font-size:var(--t-meta);padding:2px 4px 12px}

/* Notat i uke-brikker (Uke + Plan) */
.uke-chip-note{
  margin-top:3px;font-size:var(--t-etikett);font-weight:600;line-height:1.3;color:#fff;opacity:.92;
  white-space:pre-wrap;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.uke-chip.open .uke-chip-note{-webkit-line-clamp:unset;overflow:visible}

/* Notat i måned-ruter (Måned + Plan) — én linje */
.cal-ev-note{
  font-family:'Archivo',sans-serif;font-size:var(--t-rute);font-weight:600;line-height:1.2;
  color:var(--ink-soft);margin:-1px 0 2px 11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cal-cell.sel .cal-ev-note{color:rgba(255,255,255,.82)}


/* ---------- Kalendervelger (dropdown i topplinjen) ---------- */
.caldrop{position:relative}
.caldrop-btn{
  font-family:'Archivo',sans-serif;font-size:var(--t-meta);font-weight:700;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  padding:9px 14px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.caldrop-btn:active{transform:scale(.98)}
.caldrop-car{font-size:var(--t-etikett);color:var(--ink-soft);font-weight:700}
.caldrop-panel{
  position:fixed;right:20px;z-index:47;
  bottom:calc(88px + env(safe-area-inset-bottom));
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 16px 40px rgba(44,62,80,.22);padding:8px 14px;
  min-width:240px;max-width:300px;max-height:60vh;overflow-y:auto;
}
.caldrop-panel[hidden]{display:none}
@media(max-width:900px){ .caldrop-panel{right:auto;left:0} }

/* Kalenderlista bor nå i toppmenyen */
#app .side-cals{display:none}
#app .side-day{flex:1 1 100%}

/* ---------- Handlingsknapper nede til hoeyre ----------
   Samme moenster som handleliste og oppskrifter: runde knapper stablet
   i hjoernet i stedet for spredt utover topplinja og bunnlinja. */
.bottom-bar{
  position:fixed;right:20px;z-index:46;
  bottom:calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:10px;
  pointer-events:none;
}
.bottom-bar > *{pointer-events:auto}
.fab{
  position:relative;width:48px;height:48px;border-radius:50%;
  border:none;padding:0;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 14px rgba(44,62,80,.18);
  touch-action:manipulation;color:#fff;
}
.fab:active{transform:scale(.95)}
.fab.ny{background:var(--handling-ny);font-size:var(--t-pil);line-height:1}
.fab.blaa{background:var(--blaa)}
.fab svg{width:21px;height:21px;display:block}
/* Snurrer mens oppdateringen gaar */
.fab.gaar svg{animation:fabSnurr .9s linear infinite}
@keyframes fabSnurr{ to{transform:rotate(360deg)} }

/* ---------- Dagpanel (trykk paa dag naar hoeyrekolonnen er borte) ----------
   Dekker halve skjermen. Siden velges ut fra hvor dagen ligger: trykker
   du paa en dag i venstre halvdel, legger panelet seg til hoeyre, slik at
   dagen du valgte fortsatt er synlig ved siden av. */
.dagpanel{
  position:fixed;top:0;bottom:0;width:50vw;z-index:70;
  background:var(--paper);
  display:flex;flex-direction:column;
  box-shadow:0 0 40px rgba(44,62,80,.22);
  animation:dagpanelInn .18s ease;
}
.dagpanel.hoyre{right:0;border-radius:18px 0 0 18px}
.dagpanel.venstre{left:0;border-radius:0 18px 18px 0}
@keyframes dagpanelInn{ from{opacity:0} to{opacity:1} }
.dagpanel-bak{position:fixed;inset:0;z-index:69;background:rgba(44,62,80,.28)}
.dagpanel-topp{
  display:flex;align-items:center;gap:12px;
  padding:18px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0;
}
.dagpanel-tittel{font-size:var(--t-stor);font-weight:700;line-height:1.2}
.dagpanel-tall{
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);
  color:var(--ink-soft);
}
.dagpanel-lukk{
  margin-left:auto;flex-shrink:0;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);background:none;color:var(--ink-soft);
  font-size:var(--t-pil);line-height:1;cursor:pointer;
}
.dagpanel-lukk:active{background:var(--bg-2)}
.dagpanel-liste{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px}
.dagpanel-ny{
  margin:0 14px 14px;flex-shrink:0;
  font-family:'Archivo',sans-serif;font-size:var(--t-meta);font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  background:var(--ink);color:#fff;border:none;border-radius:999px;
  padding:12px 18px;cursor:pointer;
}
.dagpanel-ny:active{transform:scale(.98)}
/* Smal skjerm: halv bredde blir for trangt - da dekker panelet alt */
@media(max-width:700px){
  .dagpanel{width:100%;border-radius:0}
}

/* ---------- Dagmeny (langt trykk) ---------- */
.dagpop{
  position:fixed;inset:0;background:rgba(44,62,80,.45);z-index:60;
  display:flex;align-items:center;justify-content:center;padding:22px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
}
.dagpop-card{
  background:var(--paper);border-radius:16px;width:100%;max-width:340px;
  max-height:78dvh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 50px rgba(44,62,80,.32);
}
.dagpop-head{
  padding:15px 18px 12px;font-size:var(--t-meta);font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);
}
.dagpop-ny{
  margin:12px 14px 4px;padding:12px;border:none;border-radius:11px;
  background:var(--ink);color:#fff;font-family:'Archivo',sans-serif;
  font-size:var(--t-brod);font-weight:700;cursor:pointer;text-align:center;
}
.dagpop-ny:active{transform:scale(.98)}
.dagpop-liste{padding:4px 8px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dagpop-ev{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  background:none;border:none;border-radius:9px;padding:11px 10px;cursor:pointer;
  font-family:'Archivo',sans-serif;color:var(--ink);
}
@media(hover:hover){.dagpop-ev:hover{background:var(--bg-2)}}
.dagpop-ev:active{background:var(--bg-2)}
.dagpop-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dagpop-tid{
  font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink-soft);
  min-width:40px;font-variant-numeric:tabular-nums;
}
.dagpop-navn{
  font-size:var(--t-brod);font-weight:600;line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}

/* ---------- Fullskjerm ---------- */
.fs-logo{
  position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;z-index:45;
  width:46px;height:46px;border-radius:50%;background:var(--paper);
  border:none;padding:6px;cursor:pointer;display:none;
  box-shadow:0 3px 12px rgba(0,0,0,.26);
}
.fs-logo:active{transform:scale(.94)}
.fs-logo img{width:100%;height:auto;display:block;border-radius:50%}
#fsBtn{display:inline-flex;align-items:center;justify-content:center;padding:0 11px}
#fsBtn svg{display:block}

.shell.fullscreen .top{display:none}
.shell.fullscreen .side{display:none}
.shell.fullscreen footer{display:none}
.shell.fullscreen .grid{grid-template-columns:1fr}
.shell.fullscreen{padding-top:8px}
.shell.fullscreen .fs-logo{display:block}
.shell.fullscreen .mnav{padding-left:54px}
@media(max-width:900px){
  .shell.fullscreen .mnav{padding-left:52px}
}

/* ---------- Smale skjermer ---------- */
@media(max-width:900px){
  body{overflow:auto}
  .shell{height:auto;min-height:100dvh;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .grid{display:flex;flex-direction:column}
  .cal{height:auto;grid-template-rows:auto repeat(6,minmax(76px,auto))}
  .side-day,.side-cals{flex:none}
  .side .scroll{overflow:visible}
  .brand-icon{width:46px;height:46px;padding:6px}
  .who{display:none}
  .cal-cell{padding:5px}
  .tg{min-height:72dvh}
  .uke-lab{position:sticky;left:0;z-index:2}
}

  /* ---------- Plan: kronologiske dagsoeyler ----------
     Ingen navnekolonne. Farget kantstripe og initial baerer hvem det
     gjelder, saa tomme rader per person slutter aa spise hoeyde. */
  .pu-rad{display:grid;align-items:start;min-height:100%}
  .pu-kol{
    border-left:1px solid var(--grid);padding:6px 5px 12px;cursor:pointer;
    min-width:0;display:flex;flex-direction:column;gap:5px;
  }
  .pu-kol:first-of-type{border-left:none}
  .pu-kol.helg{background:var(--bg-2)}
  .pu-kol.helligdag{background:rgba(180,68,58,.08)}
  .pu-kol.idag{background:rgba(184,217,71,.10)}
  .pu-kol.rolig{opacity:.55}          /* rolige dager skal faktisk se rolige ut */

  /* Fyll og rammefarge settes i JS fra kalenderfargen. */
  .pu-ev{
    border:1px solid transparent;border-radius:9px;
    padding:6px 8px;overflow:hidden;
  }
  .pu-topp{display:flex;align-items:center;gap:5px;margin-bottom:2px}
  .pu-ini{
    width:16px;height:16px;border-radius:50%;color:#fff;flex-shrink:0;
    font-family:'Archivo',sans-serif;font-size:var(--t-rute);font-weight:700;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .pu-tid{
    font-family:'IBM Plex Mono',monospace;font-size:var(--t-etikett);color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.75;
  }
  .pu-tittel{
    font-family:'Archivo',sans-serif;font-weight:700;font-size:var(--t-meta);
    line-height:1.25;overflow-wrap:anywhere;
  }
  /* Liten prikk = det finnes sted eller notat aa se i boblen. */
  .pu-mer{
    width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-left:auto;
  }
  /* Kollisjon: to avtaler ligger oppaa hverandre i tid. Markeres med en solid
     ring i personens egen farge, ikke med stiplet ramme. */
  .pu-ev.kollisjon .pu-tid{font-weight:700;color:var(--ink)}
  .pu.endag .pu-tittel{font-size:var(--t-brod)}
  .pu.endag .pu-tid{font-size:var(--t-meta)}
  .pu.endag .pu-ini{width:19px;height:19px;font-size:var(--t-etikett)}
  @media(hover:hover){ .pu-ev:hover{filter:brightness(.96)} }

/* ---------- Laast ramme ----------
   Siden skal ikke kunne dras sidelengs eller zoomes ved uhell.
   Merk: iOS Safari overstyrer user-scalable og slipper knipezoom likevel -
   det som faktisk virker er touch-action mot dobbelttrykk, og 16px i
   skjemafelt saa iOS ikke zoomer inn naar man trykker i dem. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{touch-action:manipulation}
input,select,textarea{font-size:16px}
</style>
</head>
<body>
<div class="shell">

  <button class="fs-logo" id="fsLogo" onclick="toggleFull()" title="Avslutt fullskjerm" aria-label="Avslutt fullskjerm"><img alt=""></button>

<script>
/* ============================================================
   Konfigurasjon — Azure app-registrering
   ============================================================ */
const CFG = {
  clientId : 'ccab6959-abc2-4d09-9212-4b33c0db025c',
  tenantId : '9fcd8ee6-9b49-4904-ae55-117ba14373c3',
  authority: 'common',
  scopes   : 'openid profile offline_access User.Read Calendars.Read Calendars.ReadWrite'
};
const REDIRECT  = location.origin + location.pathname;
const AUTH_BASE = 'https://login.microsoftonline.com/' + CFG.authority + '/oauth2/v2.0';
const GRAPH     = 'https://graph.microsoft.com/v1.0';

const PALETTE = ['#2C3E50','#B4443A','#3E7C5A','#8A6BB1','#C08A2E','#4A7FA8','#A05A7A','#5A6C7D'];
const FARGER  = ['#2C3E50','#4A7FA8','#2E8B8B','#3E7C5A','#5AA469','#C08A2E','#D98032','#B4443A','#C65B7C','#8A6BB1','#7A8B2E','#5A6C7D'];

/* Standardfarger — brukes til en admin eventuelt overstyrer dem.
   Nøkkelen er kalendernavnet, ikke id-en: hver bruker ser de delte
   kalenderne med ulik id, men samme navn. */
const FASTE_FARGER = {
  'Familie': '#2C3E50',
  'Magne'  : '#4A7FA8',
  'Nina'   : '#B4443A',
  'Emma'   : '#8A6BB1',
  'Andrea' : '#C65B7C'
};

/* Bare disse kan endre farger. Alle andre ser dem, men kan ikke røre dem. */
const FARGE_ADMIN = ['sys@neam.no', 'magne@neam.no'];
const FARGE_KEY   = 'kal-farger';        /* i KV: fh:kal-farger */

let fargeOverstyring = {};   /* navn -> hex, hentet fra Cloudflare KV */
let erFargeAdmin    = false;
let minEpost        = null;

/* Gjeldende farge for en kalender: overstyring → standard → palett */
function kalenderFarge(navn, i){
  return fargeOverstyring[navn] || FASTE_FARGER[navn] || PALETTE[i % PALETTE.length];
}

/* Microsoft oppgir av og til gjeste-format som «magne_neam.no#EXT#@...».
   Vi normaliserer til vanlig e-post før vi sammenligner identiteter. */
function normEpost(s){
  s = String(s || '').toLowerCase().trim();
  const ext = s.indexOf('#ext#');
  if(ext !== -1){
    s = s.slice(0, ext);
    const i = s.lastIndexOf('_');
    if(i !== -1) s = s.slice(0, i) + '@' + s.slice(i + 1);
  }
  return s;
}

/* ---- Identitet (kun til rettigheter) ----
   Graph foerst: Access-sesjonen kan henge igjen som forrige bruker ved
   brukerbytte paa delt iPad, og da ville feil person faatt fargevelgeren. */
function settRettigheter(){
  erFargeAdmin = !!minEpost && FARGE_ADMIN.indexOf(minEpost) !== -1;
}
async function hentIdentitet(){
  if(minEpost){ settRettigheter(); return; }
  try{
    const r = await fetch('/cdn-cgi/access/get-identity?_=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const d = await r.json();
    minEpost = normEpost(d.email || '');
    settRettigheter();
  }catch(e){ /* uten Access: ingen admin-rettigheter */ }
}

/* Fornavn under logoen. Kilden er Microsoft Graph, ikke Access —
   Access-sesjonen kan henge igjen som forrige bruker ved brukerbytte,
   mens Graph-navnet er riktig hver gang. Lagres slik at oppskrifter
   og handleliste kan bruke det ogsaa. */
function visNavn(fulltNavn){
  const fullt = String(fulltNavn || '').trim();
  const el = $('brandNavn');
  if(el) el.textContent = fullt.split(/\s+/)[0] || '';
  try{ if(fullt) localStorage.setItem('fh_navn', fullt); }catch(e){}
}

/* ---- Felles farger i Cloudflare KV ---- */
async function hentFarger(){
  try{
    const r = await fetch('/api/data?key=' + FARGE_KEY, {cache:'no-store'});
    if(!r.ok) return;                      /* 404 = ikke satt ennå, bruk standard */
    const txt = await r.text();
    if(!txt) return;
    let d = JSON.parse(txt);
    if(d && typeof d === 'object' && d.value !== undefined){
      d = (typeof d.value === 'string') ? JSON.parse(d.value) : d.value;
    }
    if(d && typeof d === 'object') fargeOverstyring = d;
  }catch(e){ console.warn('Kunne ikke hente farger:', e.message); }
}
async function lagreFarger(){
  try{
    await fetch('/api/data?key=' + FARGE_KEY, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(fargeOverstyring)
    });
  }catch(e){ console.warn('Kunne ikke lagre farger:', e.message); }
}

/* Husk hvilke kalendere som er slått på/av, per enhet. */
const KAL_VALG_KEY = 'fh_cal_valgt';
let kalenderValg = {};
try{ kalenderValg = JSON.parse(localStorage.getItem(KAL_VALG_KEY) || '{}') || {}; }catch(e){ kalenderValg = {}; }
function lagreKalenderValg(){
  try{ localStorage.setItem(KAL_VALG_KEY, JSON.stringify(kalenderValg)); }catch(e){}
}

const S = {
  token:null, expires:0, refresh:null,
  me:null,
  modus:'month',          /* month | week | day */
  view:new Date(),
  sel:new Date(),
  calendars:[],
  events:[],             /* avtaler for gjeldende visning (utsnitt av cachen) */
  all:[],                /* cache: alle hentede avtaler i det lastede vinduet */
  loaded:null,           /* [start,slutt] for vinduet som ligger i cachen */
  loadedIds:null,        /* Set av kalender-id-er som var på ved henting */
  loading:false,
  ventende:false,        /* en ny last kom mens vi holdt på — kjør på nytt */
  visAlle:false,
  vis:'kal'            /* visning: kal | plan | liste */
};

const TIME_H = 46;        /* høyde per time i tidsrutenettet */

const MND = ['Januar','Februar','Mars','April','Mai','Juni','Juli','August','September','Oktober','November','Desember'];
const DOW = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];
const DAG = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];

const $   = id => document.getElementById(id);
const pad = n  => String(n).padStart(2,'0');
const key = d  => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const sameDay = (a,b) => key(a)===key(b);

function mandag(d){
  const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
  return m;
}
function plussDager(d, n){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
function ukeNr(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const nyttaar = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil((((t - nyttaar) / 86400000) + 1) / 7);
}
function minutter(d){ return d.getHours()*60 + d.getMinutes(); }

/* ---- Norske helligdager (røde dager) ---- */
function paske(y){
  const a=y%19, b=Math.floor(y/100), c=y%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, mm=Math.floor((a+11*h+22*l)/451),
        mnd=Math.floor((h+l-7*mm+114)/31), dag=((h+l-7*mm+114)%31)+1;
  return new Date(y, mnd-1, dag);
}
let _helgCache = {};
function helligKart(y){
  if(_helgCache[y]) return _helgCache[y];
  const H = {}, pa = paske(y);
  const set = function(dt, navn){ const k = key(dt); if(!H[k]) H[k] = navn; };
  set(new Date(y,0,1), 'Nyttårsdag');
  set(plussDager(pa,-3), 'Skjærtorsdag');
  set(plussDager(pa,-2), 'Langfredag');
  set(pa, 'Første påskedag');
  set(plussDager(pa,1), 'Andre påskedag');
  set(new Date(y,4,1), 'Offentlig høytidsdag');
  set(new Date(y,4,17), 'Grunnlovsdag');
  set(plussDager(pa,39), 'Kristi himmelfartsdag');
  set(plussDager(pa,49), 'Første pinsedag');
  set(plussDager(pa,50), 'Andre pinsedag');
  set(new Date(y,11,25), 'Første juledag');
  set(new Date(y,11,26), 'Andre juledag');
  _helgCache[y] = H;
  return H;
}
function helligdag(d){ return helligKart(d.getFullYear())[key(d)] || null; }

function msg(el, text, isErr){
  el.hidden = !text;
  el.className = 'msg' + (isErr ? ' err' : '');
  el.textContent = text || '';
}
function esc(s){
  return String(s||'').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}

/* ============================================================
   PKCE-innlogging
   ============================================================ */
function randStr(n){
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return Array.from(a, b => ('0'+b.toString(16)).slice(-2)).join('');
}
async function challenge(verifier){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function login(){
  const verifier = randStr(48);
  const stateTok = randStr(8);
  sessionStorage.setItem('fh_verifier', verifier);
  sessionStorage.setItem('fh_state', stateTok);
  const p = new URLSearchParams({
    client_id: CFG.clientId,
    response_type: 'code',
    redirect_uri: REDIRECT,
    response_mode: 'query',
    scope: CFG.scopes,
    state: stateTok,
    code_challenge: await challenge(verifier),
    code_challenge_method: 'S256',
    prompt: 'select_account'
  });
  location.href = AUTH_BASE + '/authorize?' + p;
}

async function exchange(body){
  const base = { client_id: CFG.clientId, redirect_uri: REDIRECT };
  for(const k in body) base[k] = body[k];
  const r = await fetch(AUTH_BASE + '/token', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams(base)
  });
  const txt = await r.text();
  let data;
  try{ data = JSON.parse(txt); }catch(e){ throw new Error('Uventet svar fra Microsoft'); }
  if(!r.ok) throw new Error(data.error_description || data.error || 'Innlogging feilet');
  return data;
}

function saveTokens(d){
  S.token   = d.access_token;
  S.refresh = d.refresh_token || S.refresh;
  S.expires = Date.now() + (d.expires_in || 3600)*1000 - 60000;
  try{
    localStorage.setItem('fh_cal_auth', JSON.stringify({refresh:S.refresh, token:S.token, expires:S.expires}));
  }catch(e){}
}
function loadTokens(){
  try{
    const raw = localStorage.getItem('fh_cal_auth');
    if(!raw) return false;
    const d = JSON.parse(raw);
    S.token = d.token; S.refresh = d.refresh; S.expires = d.expires || 0;
    return !!(S.token || S.refresh);
  }catch(e){ return false; }
}
let fornyelsePågår = null;
async function validToken(){
  if(S.token && Date.now() < S.expires) return S.token;
  if(!S.refresh) return null;
  /* Flere kalendere kan be om token samtidig — gjenbruk samme
     fornyelse i stedet for å sende flere refresh-kall parallelt. */
  if(!fornyelsePågår){
    fornyelsePågår = exchange({grant_type:'refresh_token', refresh_token:S.refresh, scope:CFG.scopes})
      .then(function(d){ saveTokens(d); return S.token; })
      .finally(function(){ fornyelsePågår = null; });
  }
  return fornyelsePågår;
}
/* Rydder bare vår egen tilstand. Brukes naar tokenet har gaatt ut —
   da skal vi tilbake til innloggingsskjermen, ikke kastes ut av Access. */
function nullstillLokalt(){
  localStorage.removeItem('fh_cal_auth');
  sessionStorage.clear();
  S.token = null; S.refresh = null; S.me = null; S.expires = 0;
  S.calendars = []; S.events = [];
  settFull(false);
  render();
}

/* «Logg ut» betyr det samme her som paa de andre sidene: helt ut.
   To sesjoner maa avsluttes — Microsoft-kontoen og Cloudflare Access.
   Vi kan ikke sende Microsoft rett til /cdn-cgi/access/logout, for den
   URL-en maa vaere registrert i Azure. I stedet returnerer vi til vaar
   egen side, som allerede er registrert, og tar Access-utloggingen der. */
function loggUt(){
  nullstillLokalt();
  try{ localStorage.removeItem('fh_navn'); }catch(_){}
  const el = $('brandNavn');
  if(el) el.textContent = '';
  try{ sessionStorage.setItem('fh_ut', '1'); }catch(_){}
  location.href = 'https://login.microsoftonline.com/common/oauth2/v2.0/logout?post_logout_redirect_uri=' +
    encodeURIComponent(location.origin + location.pathname);
}
function toggleAuth(){ (S.token || S.refresh) ? loggUt() : login(); }

/* ---------- Fullskjerm: skjul topplinje, sidepanel og bunn ---------- */
function settFull(på){
  const shell = document.querySelector('.shell');
  shell.classList.toggle('fullscreen', på);
  const btn = $('fsBtn');
  if(btn) btn.title = på ? 'Avslutt fullskjerm' : 'Fullskjerm';
  const logo = $('fsLogo');
  if(på && logo){
    const kilde = document.querySelector('.brand-icon img');
    const bilde = logo.querySelector('img');
    if(kilde && bilde && !bilde.getAttribute('src')) bilde.src = kilde.src;
  }
  if(S.token || S.refresh) render();   /* la kalenderen fylle den nye bredden */
}
function toggleFull(){
  settFull(!document.querySelector('.shell').classList.contains('fullscreen'));
}

/* ============================================================
   Microsoft Graph
   ============================================================ */
const TZ = 'Europe/Oslo';

async function graph(path, method, payload){
  const t = await validToken();
  if(!t) throw new Error('Ikke innlogget');
  const opt = {
    method: method || 'GET',
    headers: {
      Authorization: 'Bearer ' + t,
      Prefer: 'outlook.timezone="' + TZ + '"'
    }
  };
  if(payload){
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(payload);
  }

  /* Microsoft struper oss (429) naar flere kalendere hentes samtidig.
     Da venter vi tiden de ber om og proever igjen, i stedet for aa la
     kalenderen falle ut av visningen. Kun for lesing — vi vil ikke
     risikere aa opprette samme avtale to ganger. */
  const kanProeveIgjen = !method || method === 'GET';
  let forsoek = 0;
  let r;
  while(true){
    r = await fetch(GRAPH + path, opt);
    if(!kanProeveIgjen || forsoek >= 3) break;
    if(r.status !== 429 && r.status !== 503 && r.status !== 504) break;
    const vent = parseInt(r.headers.get('Retry-After') || '', 10);
    const ms = (isFinite(vent) && vent > 0) ? Math.min(vent * 1000, 8000)
                                            : 500 * Math.pow(2, forsoek);
    await new Promise(function(ok){ setTimeout(ok, ms); });
    forsoek++;
  }

  if(r.status === 204) return null;                 // sletting gir tomt svar
  const txt = await r.text();
  if(!txt) return null;
  let data;
  try{ data = JSON.parse(txt); }catch(e){ throw new Error('Uventet svar fra Microsoft Graph'); }
  if(!r.ok) throw new Error((data.error && data.error.message) || 'Graph-feil');
  return data;
}
async function loadMe(){
  S.me = await graph('/me');
  visNavn(S.me && S.me.displayName);
  /* Graph er fasit for hvem som er innlogget — sett rettighetene herfra. */
  const fra = normEpost((S.me && (S.me.mail || S.me.userPrincipalName)) || '');
  if(fra){ minEpost = fra; settRettigheter(); render(); }
}

async function loadCalendars(){
  const d = await graph('/me/calendars?$top=50');
  const prev = {};
  S.calendars.forEach(function(c){ prev[c.id] = c.on; });
  S.calendars = (d.value||[]).map(function(c,i){
    const husket = kalenderValg[c.id];
    return {
      id:c.id, name:c.name, color: kalenderFarge(c.name, i),
      kanEndre: c.canEdit !== false,
      on: prev[c.id] !== undefined ? prev[c.id] : (husket !== undefined ? husket : true)
    };
  });
}

/* Hvilken periode som skal hentes, ut fra valgt visning */
function periode(){
  if(S.modus === 'week'){
    const m = mandag(S.sel);
    return [m, plussDager(m, 7)];
  }
  if(S.modus === 'day'){
    const d = new Date(S.sel.getFullYear(), S.sel.getMonth(), S.sel.getDate());
    return [d, plussDager(d, 1)];
  }
  const y = S.view.getFullYear(), m = S.view.getMonth();
  return [new Date(y, m, 1), new Date(y, m+1, 1)];
}

/* Bredere vindu enn selve visningen — så nabo-måneder/uker allerede
   ligger i cachen når man blar, og bladding blir umiddelbar. */
function ønsketVindu(){
  if(S.modus === 'week'){
    const m = mandag(S.sel);
    return [plussDager(m,-7), plussDager(m,14)];        /* 3 uker */
  }
  if(S.modus === 'day'){
    const d = new Date(S.sel.getFullYear(), S.sel.getMonth(), S.sel.getDate());
    return [plussDager(d,-3), plussDager(d,4)];         /* uke rundt dagen */
  }
  const y = S.view.getFullYear(), m = S.view.getMonth();
  return [new Date(y, m-1, 1), new Date(y, m+2, 1)];    /* 3 måneder */
}

/* Henter alle påslåtte kalendere for [a,b).
   Returnerer ett resultat per kalender, med om hentingen faktisk lyktes —
   en kalender som feilet skal ikke forveksles med en som er tom. */
/* Notatfeltet fra Graph kommer som HTML naar avtalen er laget i Outlook.
   Vi viser ren tekst: DOMParser kjoerer ingen skript og vi setter aldri
   HTML-en inn i siden, saa ingenting fra en avtale kan kjoere hos oss.
   bodyPreview kan ikke brukes — Microsoft kutter den ved ~255 tegn. */
function htmlTilTekst(innhold, type){
  const s = String(innhold || '');
  if(!s) return '';
  if(String(type).toLowerCase() !== 'html') return s.trim();
  try{
    const doc = new DOMParser().parseFromString(s, 'text/html');
    doc.querySelectorAll('br').forEach(function(b){ b.replaceWith('\n'); });
    doc.querySelectorAll('p,div,li,tr,h1,h2,h3,h4,h5,h6').forEach(function(b){
      b.append('\n');
    });
    return (doc.body.textContent || '')
      .replace(/\u00a0/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }catch(e){
    /* Reserve om DOMParser ikke er tilgjengelig: gjoer blokkslutt til
       linjeskift foer taggene fjernes, ellers klistres avsnitt sammen. */
    return s.replace(/<\/(p|div|li|tr|h[1-6])>/gi, '\n')
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<[^>]*>/g, '')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
  }
}

async function hentVindu(a, b){
  const q = '?startDateTime=' + a.toISOString() + '&endDateTime=' + b.toISOString()
          + '&$orderby=start/dateTime&$top=400'
          + '&$select=subject,isAllDay,start,end,location,body,seriesMasterId,type';
  const aktive = S.calendars.filter(function(c){ return c.on; });

  async function hentEn(c){
    try{
      const d = await graph('/me/calendars/' + c.id + '/calendarView' + q);
      const events = (d.value||[]).map(function(e){
        return {
          id:e.id,
          title:e.subject || '(uten tittel)',
          allDay:!!e.isAllDay,
          start:new Date(e.start.dateTime + (e.start.timeZone==='UTC'?'Z':'')),
          end:new Date(e.end.dateTime + (e.end.timeZone==='UTC'?'Z':'')),
          where:(e.location && e.location.displayName) || '',
          note: htmlTilTekst(e.body && e.body.content, e.body && e.body.contentType),
          serie:!!e.seriesMasterId || e.type==='occurrence' || e.type==='exception',
          calId:c.id, color:c.color, calName:c.name, kanEndre:c.kanEndre
        };
      });
      return { calId:c.id, ok:true, events:events };
    }catch(err){
      console.warn('Kalender «'+c.name+'»:', err.message);
      return { calId:c.id, ok:false, events:[] };
    }
  }

  /* Parallelt, men ikke alle på én gang — for mange samtidige kall mot
     Graph gir struping, som var årsaken til at avtaler forsvant. */
  const GRENSE = 3;
  const resultater = [];
  for(let i = 0; i < aktive.length; i += GRENSE){
    const bolk = aktive.slice(i, i + GRENSE);
    const svar = await Promise.all(bolk.map(hentEn));
    svar.forEach(function(s){ resultater.push(s); });
  }
  return resultater;
}

/* Dekker cachen gjeldende visning? (riktig periode + alle påslåtte kalendere) */
function cacheDekker(){
  if(!S.loaded || !S.loadedIds) return false;
  const omr = periode();
  if(!(S.loaded[0] <= omr[0] && S.loaded[1] >= omr[1])) return false;
  return S.calendars.every(function(c){ return !c.on || S.loadedIds.has(c.id); });
}

/* Sørger for at cachen dekker gjeldende visning. Henter kun ved behov.
   Returnerer true hvis det faktisk ble gjort et nettkall. */
async function sikreCache(force){
  if(!force && cacheDekker()) return false;
  const v = ønsketVindu();
  const resultater = await hentVindu(v[0], v[1]);

  /* En kalender som feilet skal ikke tømmes i visningen. Vi beholder det
     vi hadde fra før, og lar den staa som ikke-lastet slik at neste
     oppdatering forsoeker paa nytt. Uten dette forsvant avtaler og kom
     tilbake igjen tilsynelatende tilfeldig. */
  const feilet = {};
  resultater.forEach(function(r){ if(!r.ok) feilet[r.calId] = 1; });

  const nye = [];
  resultater.forEach(function(r){
    if(r.ok) r.events.forEach(function(e){ nye.push(e); });
  });
  if(Object.keys(feilet).length){
    (S.all || []).forEach(function(e){
      if(feilet[e.calId]) nye.push(e);
    });
  }

  S.all = nye;
  S.loaded = v;
  S.loadedIds = new Set(resultater.filter(function(r){ return r.ok; })
                                  .map(function(r){ return r.calId; }));
  return true;
}

/* Plukker ut avtalene for gjeldende visning fra cachen og legger dem i
   S.events — helt uten nettkall. Filtrerer også bort avslåtte kalendere. */
function fyllFraCache(){
  const omr = periode(), a = omr[0], b = omr[1];
  const på = {};
  S.calendars.forEach(function(c){ if(c.on) på[c.id] = 1; });
  S.events = S.all.filter(function(e){
    return på[e.calId] && e.start < b && e.end > a;
  }).sort(function(x,y){
    if(x.allDay !== y.allDay) return x.allDay ? -1 : 1;
    return x.start - y.start;
  });
}

function eventsOn(d){
  return S.events.filter(function(e){
    if(e.allDay){
      const s = new Date(e.start), t = new Date(e.end);
      return d >= new Date(s.getFullYear(),s.getMonth(),s.getDate())
          && d <  new Date(t.getFullYear(),t.getMonth(),t.getDate());
    }
    return sameDay(e.start, d);
  });
}

/* ---- Bånd-avtaler: heldags ELLER fleredags (uansett klokkeslett) ---- */
function bandStart(e){
  const s = new Date(e.start);
  return new Date(s.getFullYear(), s.getMonth(), s.getDate());
}
function bandSlutt(e){                 /* siste dag avtalen dekker (inklusiv) */
  const s = bandStart(e);
  const t = new Date(e.end);
  let last = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const midnatt = (t.getHours()===0 && t.getMinutes()===0 && t.getSeconds()===0);
  if(e.allDay || midnatt) last = new Date(last.getTime() - 86400000);   /* slutt er eksklusiv */
  if(last.getTime() < s.getTime()) last = s;
  return last;
}
function erFlerdags(e){ return bandSlutt(e).getTime() > bandStart(e).getTime(); }
function erBånd(e){ return !!e.allDay || erFlerdags(e); }
function dekkerDag(e, d){
  const d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return d0 >= bandStart(e).getTime() && d0 <= bandSlutt(e).getTime();
}

/* Kart over bånd-avtaler per dag i månedsvisningen (fylles i renderCal) */
let mndKart = null;
let visNotat = false;   /* Plan-modus i måned: vis én linje av notatet */

/* Hvor mange avtaler får plass i én rute — ut fra faktisk rutehøyde */
function evsPerCell(){
  const cell = document.querySelector('.cal-cell:not(.blank)');
  if(!cell) return 3;
  const h = cell.clientHeight - 24;
  return Math.max(1, Math.min(5, Math.floor(h / 21)));
}

function fyllAvtaler(){
  if(!mndKart) return;
  const MAX_BANER = 4;
  const bokser = document.querySelectorAll('.cal-evs');
  bokser.forEach(function(box){
    box.innerHTML = '';
    const d = new Date(+box.dataset.t);
    const col = (mndKart.lead + d.getDate() - 1) % 7;
    const info = mndKart.celle[+d] || { multi: [], maxLane: -1, enkelt: [] };

    const bygg = function(e, rundBegge){
      const band = document.createElement('div');
      band.className = 'cal-band';
      band.style.background = e.color;
      const erStart = rundBegge || (col === 0) || !dekkerDag(e, plussDager(d, -1));
      const erSlutt = rundBegge || (col === 6) || !dekkerDag(e, plussDager(d, 1));
      if(erStart) band.classList.add('s');
      if(erSlutt) band.classList.add('e');
      if(erStart) band.textContent = e.title;      /* tittel ved start/ukestart */
      band.title = e.title;
      band.style.cursor = 'pointer';
      band.onclick = function(ev){ ev.stopPropagation(); if(skjulTrykk) return; visBoble(e.id, ev); };
      band.addEventListener('touchstart', function(ev){ ev.stopPropagation(); }, {passive:true});
      band.addEventListener('mousedown',  function(ev){ ev.stopPropagation(); });
      return band;
    };

    /* --- Bånd: fleredags i faste baner, heldags-endags rett under --- */
    let linjer = 0;
    if(info.maxLane >= 0 || info.enkelt.length){
      const bars = document.createElement('div');
      bars.className = 'cal-bars';
      for(let lane = 0; lane <= info.maxLane && linjer < MAX_BANER; lane++){
        const e = info.multi[lane];
        if(e){ bars.appendChild(bygg(e, false)); }
        else {
          const tom = document.createElement('div');
          tom.className = 'cal-band tom';
          bars.appendChild(tom);
        }
        linjer++;
      }
      info.enkelt.forEach(function(e){
        if(linjer < MAX_BANER){ bars.appendChild(bygg(e, true)); linjer++; }
      });
      if(bars.children.length) box.appendChild(bars);
    }

    /* --- Tidsbestemte (én-dags) avtaler --- */
    const timed = S.events
      .filter(function(e){ return !erBånd(e) && sameDay(e.start, d); })
      .sort(function(a, b){ return a.start - b.start; });
    if(timed.length){
      const rest = visNotat
        ? Math.max(1, Math.ceil((evsPerCell() - linjer) / 2))
        : Math.max(1, evsPerCell() - linjer);
      const vis = timed.slice(0, rest);
      vis.forEach(function(e){
        const row = document.createElement('div');
        row.className = 'cal-ev';
        const dot = document.createElement('span');
        dot.className = 'cal-ev-dot';
        dot.style.background = e.color;
        const txt = document.createElement('span');
        txt.className = 'cal-ev-x';
        const t = document.createElement('span');
        t.className = 'cal-ev-t';
        t.textContent = pad(e.start.getHours())+'.'+pad(e.start.getMinutes());
        txt.appendChild(t);
        txt.appendChild(document.createTextNode(e.title));
        row.appendChild(dot);
        row.appendChild(txt);
        box.appendChild(row);
        const note = visNotat ? (e.note || '').trim() : '';
        if(note){
          const nl = document.createElement('div');
          nl.className = 'cal-ev-note';
          nl.textContent = note;
          box.appendChild(nl);
        }
      });
      if(timed.length > vis.length){
        const more = document.createElement('div');
        more.className = 'cal-more';
        more.textContent = '+' + (timed.length - vis.length) + ' til';
        box.appendChild(more);
      }
    }
  });
}

function renderCal(medNotat){
  visNotat = !!medNotat;
  const y = S.view.getFullYear(), m = S.view.getMonth();

  const grid = $('cal');
  grid.innerHTML = '';
  grid.appendChild(Object.assign(document.createElement('div'), {className:'cal-wk cal-wk-h'}));
  DOW.forEach(function(d){
    const h = document.createElement('div');
    h.className = 'cal-dow';
    h.textContent = d;
    grid.appendChild(h);
  });

  const lead  = (new Date(y, m, 1).getDay() + 6) % 7;
  const days  = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const trailing = (7 - ((lead + days) % 7)) % 7;
  const rows = (lead + days + trailing) / 7;

  for(let r=0; r<rows; r++){
    const mandagIRad = new Date(y, m, 1 - lead + r*7);
    const wk = document.createElement('div');
    wk.className = 'cal-wk';
    wk.textContent = ukeNr(mandagIRad);
    grid.appendChild(wk);

    for(let c=0; c<7; c++){
      const dnum = r*7 + c - lead + 1;              /* dag i måneden */
      if(dnum < 1 || dnum > days){
        const b = document.createElement('div');
        b.className = 'cal-cell blank';
        grid.appendChild(b);
        continue;
      }
      const date = new Date(y, m, dnum);
      const cell = document.createElement('div');
      cell.className = 'cal-cell'
        + (sameDay(date,today) ? ' today' : '')
        + (sameDay(date,S.sel) ? ' sel' : '')
        + ((date.getDay()===0 || date.getDay()===6) ? ' weekend' : '');

      const num = document.createElement('div');
      num.className = 'cal-num';
      num.textContent = dnum;
      cell.appendChild(num);

      const hnavn = helligdag(date);
      if(hnavn){
        cell.classList.add('helligdag');
        const hn = document.createElement('div');
        hn.className = 'cal-helg';
        hn.textContent = hnavn;
        hn.title = hnavn;
        cell.appendChild(hn);
      }

      const box = document.createElement('div');
      box.className = 'cal-evs';
      box.dataset.t = +date;
      cell.appendChild(box);

      cell.onclick = function(){
        if(skjulTrykk) return;
        S.sel = date;
        render();
        // Uten hoeyrekolonne har dagen ingen annen plass aa vises paa
        if($('app').classList.contains('uten-side')) apneDagPanel(date, cell);
      };
      langtTrykk(cell, function(){ dagMeny(date); });
      grid.appendChild(cell);
    }
  }

  /* --- Legg bånd-avtaler i faste baner, uke for uke --- */
  const bånd  = S.events.filter(erBånd);
  const celle = {};
  const dagI  = function(d){ return new Date(y, m, d); };
  const colOf = function(d){ return (lead + d - 1) % 7; };
  for(let d=1; d<=days; d++){ celle[+dagI(d)] = { multi: [], maxLane: -1, enkelt: [] }; }

  const antUker = Math.ceil((lead + days) / 7);
  for(let w=0; w<antUker; w++){
    const wDays = [];
    for(let d=1; d<=days; d++){ if(Math.floor((lead + d - 1) / 7) === w) wDays.push(d); }
    if(!wDays.length) continue;

    const iUka = function(e){ return wDays.some(function(d){ return dekkerDag(e, dagI(d)); }); };
    const fler = bånd.filter(function(e){ return erFlerdags(e) && iUka(e); });
    const enk  = bånd.filter(function(e){ return !erFlerdags(e) && iUka(e); });

    fler.sort(function(a, b){
      const da = wDays.find(function(d){ return dekkerDag(a, dagI(d)); });
      const db = wDays.find(function(d){ return dekkerDag(b, dagI(d)); });
      return (colOf(da) - colOf(db)) || (bandSlutt(b) - bandSlutt(a)) || (a.calId < b.calId ? -1 : 1);
    });

    const laner = [];                       /* laner[i] = liste av [c0,c1] */
    fler.forEach(function(e){
      const cols = wDays.filter(function(d){ return dekkerDag(e, dagI(d)); }).map(colOf);
      const c0 = Math.min.apply(null, cols), c1 = Math.max.apply(null, cols);
      let lane = 0;
      while(laner[lane] && laner[lane].some(function(r){ return c0 <= r[1] && c1 >= r[0]; })) lane++;
      if(!laner[lane]) laner[lane] = [];
      laner[lane].push([c0, c1]);
      wDays.forEach(function(d){
        if(dekkerDag(e, dagI(d))){
          const info = celle[+dagI(d)];
          info.multi[lane] = e;
          if(lane > info.maxLane) info.maxLane = lane;
        }
      });
    });

    enk.forEach(function(e){
      wDays.forEach(function(d){
        if(dekkerDag(e, dagI(d))) celle[+dagI(d)].enkelt.push(e);
      });
    });
  }
  mndKart = { lead: lead, days: days, celle: celle };

  fyllAvtaler();
}

function renderDay(){
  const d = S.sel, today = new Date();
  $('dayTitle').textContent = sameDay(d,today)
    ? 'I dag'
    : DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase();

  const evs = eventsOn(d);
  $('dayCount').textContent = evs.length ? evs.length + (evs.length===1 ? ' avtale' : ' avtaler') : '';

  const list = $('dayList');
  if(!evs.length){
    list.innerHTML = '<div class="msg">Ingen avtaler denne dagen.</div>';
    return;
  }
  list.innerHTML = evs.map(function(e){
    const time = e.allDay
      ? 'Hele<br>dagen'
      : pad(e.start.getHours())+'.'+pad(e.start.getMinutes())
        + '<br>' + pad(e.end.getHours())+'.'+pad(e.end.getMinutes());
    const meta = [e.calName, e.where].filter(Boolean).join(' · ');
    return '<div class="ev klikk" onclick="visBoble(\''+e.id+'\', event)">'
      + '<div class="ev-time">'+time+'</div>'
      + '<div class="ev-body">'
      +   '<div class="ev-title">'+esc(e.title)+'</div>'
      +   '<div class="ev-meta"><span class="ev-who" style="background:'+e.color+'"></span>'+esc(meta)+'</div>'
      + '</div></div>';
  }).join('');
}

function tell(c){
  return S.events.filter(function(e){ return e.calId===c.id; }).length;
}

  const på = S.calendars.filter(function(c){ return c.on; }).length;

      ? ('Kalendere (' + på + '/' + S.calendars.length + ')')

    return;
  }
  const vis = S.calendars;

  let html = vis.map(function(c){
    /* Bare sys@ og magne@ får fargevelger — alle andre ser bare prikken. */
    const swatch = erFargeAdmin
      ? '<button class="cal-swatch" style="background:'+c.color+'" title="Endre farge"'
        + ' onclick="event.stopPropagation(); vekslPalett(this)"></button>'

function render(){
  const inn = !!(S.token || S.refresh);
  $('gate').hidden = inn;
  $('app').hidden  = !inn;
  $('who').hidden = !inn || !S.me;
  $('caldrop').hidden = !inn;
  $('bottomBar').hidden = !inn;
  if(S.me) $('who').innerHTML = '<b>'+esc(S.me.displayName||'')+'</b>'+esc(S.me.userPrincipalName||'');
  if(!inn) return;

  /* Kalender / Plan / Liste — uavhengig av Måned/Uke/Dag */
  const vb = $('visSeg').children;
  for(let i=0;i<vb.length;i++) vb[i].classList.toggle('on', vb[i].dataset.v === S.vis);

  $('monthTitle').textContent = tittel();

  const liste = (S.vis === 'liste');
  const plan  = (S.vis === 'plan');
  /* To kombinasjoner bruker hele bredden: Uke+Plan (syv kronologiske
     soeyler) og Maaned+Kalender (rutenettet fortjener plassen). I begge
     tilfeller er hoeyrekolonnen borte, og dagen man trykker paa vises
     som en halvsides popup i stedet. */
  const bredPlan = plan && S.modus === 'week';
  const bredKal  = !liste && !plan && (S.modus === 'month' || S.modus === 'week');
  const bred     = bredPlan || bredKal;
  $('app').classList.toggle('uten-side', bred);
  $('cal').hidden  = liste || S.modus !== 'month';
  $('tg').hidden   = liste || S.modus === 'month';
  $('plan').hidden = !liste;

  if(liste){
    renderListe();
  } else if(S.modus === 'month'){
    renderCal(plan);
  } else if(S.modus === 'week'){
    if(plan) renderUkePlan();
    else renderUke(false);
  } else {                                  /* dag */
    if(plan) renderUkePlan([S.sel]);
    else renderTid();
  }

  if(!bred) renderDay();
  else if(dagPanelEl) tegnDagPanel();   /* holder en aapen popup i takt */
  renderCalList();
}

async function toggleCal(id){
  const c = S.calendars.filter(function(x){ return x.id===id; })[0];
  if(!c) return;
  c.on = !c.on;
  kalenderValg[id] = c.on;
  lagreKalenderValg();
  fyllFraCache();          /* av-slag vises straks; på-slag hentes under */
  render();
  last(false);             /* henter kun hvis en ny kalender mangler i cachen */
}
function goToday(){
  const t = new Date();

async function last(force){
  if(!(S.token || S.refresh)) return;
  if(S.loading){ S.ventende = S.ventende || force; return; }   /* slå sammen kall */
  S.loading = true;
  msg($('calMsg'), '');
  try{
    if(!S.calendars.length) await loadCalendars();

function visBoble(id, klikk){
  const e = S.events.filter(function(x){ return x.id === id; })[0];
  if(!e) return;

  const tid = e.allDay
    ? 'Hele dagen'
    : tid2str(e.start) + '–' + tid2str(e.end);

  let html = '<div class="boble-topp">'
    + '<span class="boble-prikk" style="background:' + e.color + '"></span>'
    + '<span class="boble-kal">' + esc(e.calName) + '</span>'
    + '</div>'
    + '<div class="boble-tittel">' + esc(e.title) + '</div>'
    + '<div class="boble-tid">' + esc(tid) + '</div>'
    + (e.where ? '<div class="boble-sted">' + esc(e.where) + '</div>' : '')
    + (e.note
        ? '<div class="boble-notat">' + esc(e.note) + '</div>'
        : '<div class="boble-notat ingen">Ingen notater.</div>');

  if(e.kanEndre){
    html += '<button class="boble-knapp" onclick="lukkBoble(); endreAvtale(\''
      + e.id.replace(/'/g, "\\'") + '\')">Endre avtale</button>';
  }

  const b = $('boble');
  $('bobleInn').innerHTML = html;
  $('bobleBak').hidden = false;
  b.hidden = false;

  /* Plasser boblen ved siden av det som ble trykket, og hold den
     innenfor skjermen. Peker settes der det er plass. */
  const mål = (klikk && (klikk.currentTarget || klikk.target)) || null;
  const r = mål && mål.getBoundingClientRect ? mål.getBoundingClientRect() : null;
  const bb = b.getBoundingClientRect();
  const marg = 10;

  let venstre = r ? (r.left + r.width/2 - bb.width/2) : (innerWidth/2 - bb.width/2);
  venstre = Math.max(marg, Math.min(venstre, innerWidth - bb.width - marg));

  let topp, side;
  if(r && (r.bottom + bb.height + 14 < innerHeight)){
    topp = r.bottom + 10; side = 'ned';
  } else if(r && (r.top - bb.height - 14 > 0)){
    topp = r.top - bb.height - 10; side = 'opp';
  } else {
    topp = Math.max(marg, innerHeight/2 - bb.height/2); side = 'ned';
  }

  b.style.left = Math.round(venstre) + 'px';
  b.style.top  = Math.round(topp) + 'px';
  b.dataset.side = side;
  const senter = r ? (r.left + r.width/2 - venstre) : bb.width/2;
  b.style.setProperty('--peker', Math.round(Math.max(16, Math.min(senter - 7, bb.width - 30))) + 'px');
}

function bygg(){
  const tittel = $('fTitle').value.trim();
  if(!tittel) throw new Error('Gi avtalen et navn.');

  const heleDagen = $('fAllDay').checked;
  const d1 = $('fDate').value;
  if(!d1) throw new Error('Velg en dato.');

  const p = {
    subject: tittel,
    isAllDay: heleDagen,
    location: { displayName: $('fWhere').value.trim() }
  };

  /* Notatet sendes bare naar det faktisk er endret. Rikt formaterte
     notater fra Outlook ville ellers blitt flatet ut til ren tekst
     hver eneste gang noen justerte klokkeslettet. */
  const notatNaa = $('fNote').value.trim();
  if(!redigerer || notatNaa !== String(redigerer.note || '').trim()){
    p.body = { contentType:'text', content: notatNaa };
  }

  if(heleDagen){
    const d2 = $('fDate2').value || d1;
    if(d2 < d1) throw new Error('Sluttdato kan ikke være før startdato.');
    const dagEtter = new Date(d2 + 'T00:00:00');
    dagEtter.setDate(dagEtter.getDate() + 1);
    p.start = { dateTime: d1 + 'T00:00:00', timeZone: TZ };
    p.end   = { dateTime: dato2str(dagEtter) + 'T00:00:00', timeZone: TZ };
  } else {
    const t1 = $('fFrom').value, t2 = $('fTo').value;
    if(!t1 || !t2) throw new Error('Fyll inn klokkeslett.');
    let d2 = $('fDate2').value || d1;
    if(d2 < d1) d2 = d1;
    if(d1 === d2 && t2 <= t1) throw new Error('Sluttidspunktet må være etter starten.');
    p.start = { dateTime: d1 + 'T' + t1 + ':00', timeZone: TZ };
    p.end   = { dateTime: d2 + 'T' + t2 + ':00', timeZone: TZ };
  }
  return p;
}

/* Fordeler avtaler som overlapper i side-om-side-spor */
function spor(evs){
  const sortert = evs.slice().sort(function(a,b){
    return (a.f - b.f) || (b.t - b.f) - (a.t - a.f);
  });
  const ut = [];
  let klynge = [], klyngeSlutt = -1;

  function avslutt(){
    if(!klynge.length) return;
    const baner = [];
    klynge.forEach(function(e){
      let i = 0;
      while(i < baner.length && baner[i] > e.f) i++;
      if(i === baner.length) baner.push(0);
      baner[i] = e.t;
      e.bane = i;
    });
    klynge.forEach(function(e){ e.baner = baner.length; ut.push(e); });
    klynge = []; klyngeSlutt = -1;
  }

  sortert.forEach(function(e){
    if(klynge.length && e.f >= klyngeSlutt) avslutt();
    klynge.push(e);
    klyngeSlutt = Math.max(klyngeSlutt, e.t);
  });
  avslutt();
  return ut;
}

/* ---------------- Plan: uke og dag ----------------
   Plan svarer paa et annet spoersmaal enn Kalender: hvordan flyter uka?
   Derfor ingen navnekolonne og ingen rad per person - hver dag er én
   kronologisk soeyle med alle paaslaatte kalendere blandet. Fargestripe
   og initial forteller hvem det gjelder. Kalender-visningen bruker
   fortsatt renderUke og er uroert. */
/* Kalenderfargen som gjennomsiktig fyll. Teksten blir staaende moerk mot en
   lys tone av personens egen farge, saa hvem det gjelder leses uten forklaring. */
function rgbAv(hex){
  const h = String(hex || '').replace('#','').trim();
  const full = h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h;
  if(!/^[0-9a-fA-F]{6}$/.test(full)) return {r:44, g:62, b:80};   /* faller tilbake paa blekk */
  return {
    r: parseInt(full.slice(0,2),16),
    g: parseInt(full.slice(2,4),16),
    b: parseInt(full.slice(4,6),16)
  };
}
function dus(hex, a){
  const c = rgbAv(hex);
  return 'rgba('+c.r+','+c.g+','+c.b+','+a+')';
}

  el.addEventListener('mousedown',  function(ev){ ev.stopPropagation(); });

/* Merker avtaler som overlapper i tid. Poenget med planvisningen er aa se
   kollisjoner - hvem kjoerer naar en vakt og en trening ligger oppaa
   hverandre - saa de maa se annerledes ut enn avtaler som bare foelger
   etter hverandre. */
function planKollisjoner(evs){
  const kolliderer = new Set();
  for(let i=0;i<evs.length;i++){
    for(let j=i+1;j<evs.length;j++){
      const a = evs[i], b = evs[j];
      if(a.allDay || b.allDay) continue;
      if(a.start < b.end && b.start < a.end){ kolliderer.add(a.id); kolliderer.add(b.id); }
    }
  }
  return kolliderer;
}

      S.sel = d;

      if($('app').classList.contains('uten-side')) apneDagPanel(d, c);
    };
    langtTrykk(c, function(){ dagMeny(d); });
    head.appendChild(c);
  });
  wrap.appendChild(head);

  const scroll = document.createElement('div');
  scroll.className = 'uke-scroll';

  if(!Object.keys(paa).length){
    scroll.innerHTML = '<div class="msg" style="padding:16px">'
      + 'Ingen kalendere er på. Slå på en kalender i lista.</div>';
    wrap.appendChild(scroll);
    tg.appendChild(wrap);
    return;
  }

  const rad = document.createElement('div');
  rad.className = 'pu-rad';
  rad.style.gridTemplateColumns = kols;

  dager.forEach(function(d){
    const kol = document.createElement('div');
    kol.className = 'pu-kol'
      + (sameDay(d, idag) ? ' idag' : '')
      + ((d.getDay()===0 || d.getDay()===6) ? ' helg' : '')
      + (helligdag(d) ? ' helligdag' : '');

    /* Alle paaslaatte kalendere blandet, heldags foerst, saa kronologisk. */
    const evs = S.events.filter(function(e){
      if(!paa[e.calId]) return false;
      return erBånd(e) ? dekkerDag(e, d) : sameDay(e.start, d);
    }).sort(function(a, b){

      return a.start - b.start;
    });

    if(!evs.length) kol.classList.add('rolig');

    const kolliderer = planKollisjoner(evs);
    evs.forEach(function(e){

      if(erBånd(e)) el.classList.add('heldags');
      if(kolliderer.has(e.id)){

  });

  scroll.appendChild(rad);
  wrap.appendChild(scroll);
  tg.appendChild(wrap);

        .filter(function(e){ return e.calId === c.id && !erBånd(e) && sameDay(e.start, d); })
