}

/* Hvilken periode som skal hentes, ut fra valgt visning */
function periode(){
  if(S.vis === 'liste'){
    const d = listeStart();
    return [d, plussDager(d, listeBak + listeVindu)];
  }
  if(S.modus === 'week'){
    const m = mandag(S.sel);
    return [m, plussDager(m, 7)];
  }
  if(S.modus === 'day'){
    const d = new Date(S.sel.getFullYear(), S.sel.getMonth(), S.sel.getDate());
    return [d, plussDager(d, 1)];
  }
  /* Maanedsrutenettet viser hele uker, ogsaa dagene som hoerer til
     nabomaanedene. De maa hentes med, ellers staar de tomme. */
  const y = S.view.getFullYear(), m = S.view.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const days = new Date(y, m+1, 0).getDate();
  const trailing = (7 - ((lead + days) % 7)) % 7;
  return [new Date(y, m, 1 - lead), new Date(y, m, days + trailing + 1)];
}

/* Bredere vindu enn selve visningen — så nabo-måneder/uker allerede
   ligger i cachen når man blar, og bladding blir umiddelbar. */
function ønsketVindu(){
  /* Lista henter det den faktisk viser, med litt margin i hver ende
     saa neste bolk allerede ligger klar naar man ruller videre. */
  if(S.vis === 'liste'){
    const omr = periode();
    return [plussDager(omr[0], -7), plussDager(omr[1], 7)];
  }
  if(S.modus === 'week'){
    const m = mandag(S.sel);
    return [plussDager(m,-7), plussDager(m,14)];        /* 3 uker */
  }
  if(S.modus === 'day'){
    const d = new Date(S.sel.getFullYear(), S.sel.getMonth(), S.sel.getDate());
    return [plussDager(d,-3), plussDager(d,4)];         /* uke rundt dagen */
  }
  const y = S.view.getFullYear(), m = S.view.getMonth();
  return [new Date(y, m-1, 1), new Date(y, m+2, 1)];    /* 3 måneder */
}

/* Henter alle påslåtte kalendere for [a,b).
   Returnerer ett resultat per kalender, med om hentingen faktisk lyktes —
   en kalender som feilet skal ikke forveksles med en som er tom. */
/* Notatfeltet fra Graph kommer som HTML naar avtalen er laget i Outlook.
   Vi viser ren tekst: DOMParser kjoerer ingen skript og vi setter aldri
   HTML-en inn i siden, saa ingenting fra en avtale kan kjoere hos oss.
   bodyPreview kan ikke brukes — Microsoft kutter den ved ~255 tegn. */
function htmlTilTekst(innhold, type){
  const s = String(innhold || '');
  if(!s) return '';
  if(String(type).toLowerCase() !== 'html') return s.trim();
  try{
    const doc = new DOMParser().parseFromString(s, 'text/html');
    doc.querySelectorAll('br').forEach(function(b){ b.replaceWith('\n'); });
    doc.querySelectorAll('p,div,li,tr,h1,h2,h3,h4,h5,h6').forEach(function(b){
      b.append('\n');
    });
    return (doc.body.textContent || '')
      .replace(/\u00a0/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }catch(e){
    /* Reserve om DOMParser ikke er tilgjengelig: gjoer blokkslutt til
       linjeskift foer taggene fjernes, ellers klistres avsnitt sammen. */
    return s.replace(/<\/(p|div|li|tr|h[1-6])>/gi, '\n')
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<[^>]*>/g, '')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
  }
}

async function hentVindu(a, b){
  const q = '?startDateTime=' + a.toISOString() + '&endDateTime=' + b.toISOString()
          + '&$orderby=start/dateTime&$top=400'
          + '&$select=subject,isAllDay,start,end,location,body,seriesMasterId,type,hasAttachments';
  const aktive = S.calendars.filter(function(c){ return c.on; });

  async function hentEn(c){
    try{
      /* Graph gir maks noen hundre av gangen. Uten aa foelge nextLink
         ble eldre avtaler klipt bort naar vinduet vokste, og lista saa
         ut til aa stoppe paa en tilfeldig dato. */
      let sti = '/me/calendars/' + c.id + '/calendarView' + q;
      let raa = [];
      for(let side = 0; side < 25 && sti; side++){
        const d = await graph(sti);
        (d.value || []).forEach(function(e){ raa.push(e); });
        const neste = d['@odata.nextLink'];
        sti = neste ? neste.replace(/^https:\/\/graph\.microsoft\.com\/v1\.0/, '') : null;
      }
      const events = raa.map(function(e){
        return {
          id:e.id,
          title:e.subject || '(uten tittel)',
          allDay:!!e.isAllDay,
          start:new Date(e.start.dateTime + (e.start.timeZone==='UTC'?'Z':'')),
          end:new Date(e.end.dateTime + (e.end.timeZone==='UTC'?'Z':'')),
          where:(e.location && e.location.displayName) || '',
          note: htmlTilTekst(e.body && e.body.content, e.body && e.body.contentType),
          serie:!!e.seriesMasterId || e.type==='occurrence' || e.type==='exception',
          calId:c.id, color:c.color, calName:c.name, kanEndre:c.kanEndre,
          vedlegg:!!e.hasAttachments
        };
      });
      return { calId:c.id, ok:true, events:events };
    }catch(err){
      console.warn('Kalender «'+c.name+'»:', err.message);
      return { calId:c.id, ok:false, events:[] };
    }
  }

  /* Parallelt, men ikke alle på én gang — for mange samtidige kall mot
     Graph gir struping, som var årsaken til at avtaler forsvant. */
  const GRENSE = 3;
  const resultater = [];
  for(let i = 0; i < aktive.length; i += GRENSE){
    const bolk = aktive.slice(i, i + GRENSE);
    const svar = await Promise.all(bolk.map(hentEn));
    svar.forEach(function(s){ resultater.push(s); });
  }
  return resultater;
}

/* Dekker cachen gjeldende visning? (riktig periode + alle påslåtte kalendere) */
function cacheDekker(){
  if(!S.loaded || !S.loadedIds) return false;
  const omr = periode();
  if(!(S.loaded[0] <= omr[0] && S.loaded[1] >= omr[1])) return false;
  return S.calendars.every(function(c){ return !c.on || S.loadedIds.has(c.id); });
}

/* Sørger for at cachen dekker gjeldende visning. Henter kun ved behov.
   Returnerer true hvis det faktisk ble gjort et nettkall. */
async function sikreCache(force){
  if(!force && cacheDekker()) return false;
  const v = ønsketVindu();
  const resultater = await hentVindu(v[0], v[1]);

  /* En kalender som feilet skal ikke tømmes i visningen. Vi beholder det
     vi hadde fra før, og lar den staa som ikke-lastet slik at neste
     oppdatering forsoeker paa nytt. Uten dette forsvant avtaler og kom
     tilbake igjen tilsynelatende tilfeldig. */
  const feilet = {};
  resultater.forEach(function(r){ if(!r.ok) feilet[r.calId] = 1; });

  const nye = [];
  resultater.forEach(function(r){
    if(r.ok) r.events.forEach(function(e){ nye.push(e); });
  });
  if(Object.keys(feilet).length){
    (S.all || []).forEach(function(e){
      if(feilet[e.calId]) nye.push(e);
    });
  }

  S.all = nye;
  S.loaded = v;
  S.loadedIds = new Set(resultater.filter(function(r){ return r.ok; })
                                  .map(function(r){ return r.calId; }));
  return true;
}

/* Plukker ut avtalene for gjeldende visning fra cachen og legger dem i
   S.events — helt uten nettkall. Filtrerer også bort avslåtte kalendere. */
function fyllFraCache(){
  const omr = periode(), a = omr[0], b = omr[1];
  const på = {};
  S.calendars.forEach(function(c){ if(c.on) på[c.id] = 1; });
  S.events = S.all.filter(function(e){
    return på[e.calId] && e.start < b && e.end > a;
  }).sort(function(x,y){
    if(x.allDay !== y.allDay) return x.allDay ? -1 : 1;
    return x.start - y.start;
  });
}

/* ============================================================
   Visning
   ============================================================ */
function eventsOn(d){
  return S.events.filter(function(e){
    if(e.allDay){
      const s = new Date(e.start), t = new Date(e.end);
      return d >= new Date(s.getFullYear(),s.getMonth(),s.getDate())
          && d <  new Date(t.getFullYear(),t.getMonth(),t.getDate());
    }
    return sameDay(e.start, d);
  });
}

/* ---- Bånd-avtaler: heldags ELLER fleredags (uansett klokkeslett) ---- */
function bandStart(e){
  const s = new Date(e.start);
  return new Date(s.getFullYear(), s.getMonth(), s.getDate());
}
function bandSlutt(e){                 /* siste dag avtalen dekker (inklusiv) */
  const s = bandStart(e);
  const t = new Date(e.end);
  let last = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const midnatt = (t.getHours()===0 && t.getMinutes()===0 && t.getSeconds()===0);
  if(e.allDay || midnatt) last = new Date(last.getTime() - 86400000);   /* slutt er eksklusiv */
  if(last.getTime() < s.getTime()) last = s;
  return last;
}
function erFlerdags(e){ return bandSlutt(e).getTime() > bandStart(e).getTime(); }
function erBånd(e){ return !!e.allDay || erFlerdags(e); }
function dekkerDag(e, d){
  const d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return d0 >= bandStart(e).getTime() && d0 <= bandSlutt(e).getTime();
}

/* Kart over bånd-avtaler per dag i månedsvisningen (fylles i renderCal) */
let mndKart = null;

/* Hvor mange avtaler får plass i én rute — ut fra faktisk rutehøyde */
function evsPerCell(){
  const cell = document.querySelector('.cal-cell');
  if(!cell) return 3;
  const h = cell.clientHeight - 24;
  return Math.max(1, Math.min(5, Math.floor(h / 21)));
}

function fyllAvtaler(){
  if(!mndKart) return;
  const MAX_BANER = 4;
  const bokser = document.querySelectorAll('.cal-evs');
  bokser.forEach(function(box){
    box.innerHTML = '';
    const d = new Date(+box.dataset.t);
    const col = (mndKart.lead + d.getDate() - 1) % 7;
    const info = mndKart.celle[+d] || { multi: [], maxLane: -1, enkelt: [] };

    const bygg = function(e, rundBegge){
      const band = document.createElement('div');
      band.className = 'cal-band';
      band.style.background = e.color;
      const erStart = rundBegge || (col === 0) || !dekkerDag(e, plussDager(d, -1));
      const erSlutt = rundBegge || (col === 6) || !dekkerDag(e, plussDager(d, 1));
      if(erStart) band.classList.add('s');
      if(erSlutt) band.classList.add('e');

      /* Alle segmentene i samme strekk merkes likt, saa titlene kan
         legges paa tvers av dem etterpaa. Uka skiller strekkene, siden
         et baand aldri gaar over en linjeskift i rutenettet. */
      const rad = Math.floor((mndKart.lead + d.getDate() - 1) / 7);
      band.dataset.strekk = e.id + '|' + rad;
      band.dataset.tittel = e.title;
      if(erStart) band.dataset.start = '1';
      band.title = e.title;
      band.style.cursor = 'pointer';
      band.onclick = function(ev){ ev.stopPropagation(); if(skjulTrykk) return; visBoble(e.id, ev); };
      band.addEventListener('touchstart', function(ev){ ev.stopPropagation(); }, {passive:true});
      band.addEventListener('mousedown',  function(ev){ ev.stopPropagation(); });
      return band;
    };

    /* --- Bånd: fleredags i faste baner, heldags-endags rett under --- */
    let linjer = 0;
    if(info.maxLane >= 0 || info.enkelt.length){
      const bars = document.createElement('div');
      bars.className = 'cal-bars';
      for(let lane = 0; lane <= info.maxLane && linjer < MAX_BANER; lane++){
        const e = info.multi[lane];
        if(e){ bars.appendChild(bygg(e, false)); }
        else {
          const tom = document.createElement('div');
          tom.className = 'cal-band tom';
          bars.appendChild(tom);
        }
        linjer++;
      }
      info.enkelt.forEach(function(e){
        if(linjer < MAX_BANER){ bars.appendChild(bygg(e, true)); linjer++; }
      });
      if(bars.children.length) box.appendChild(bars);
    }

    /* --- Tidsbestemte avtaler: én brikke per kalender med antall ---
       Rutenettet skal svare paa "hvem har noe i dag, og hvor mye", ikke
       ramse opp titlene. Kalendere uten avtaler den dagen staar over. */
    const timed = S.events
      .filter(function(e){ return !erBånd(e) && sameDay(e.start, d); })
      .sort(function(a, b){ return a.start - b.start; });

    /* --- Tidsbestemte (én-dags) avtaler --- */
    if(timed.length){
      const rest = Math.max(1, evsPerCell() - linjer);
      const vis = timed.slice(0, rest);
      vis.forEach(function(e){
        const row = document.createElement('div');
        row.className = 'cal-ev';
        const dot = document.createElement('span');
        dot.className = 'cal-ev-dot';
        dot.style.background = e.color;
        dot.textContent = initialFor(e.calId, e.calName);
        dot.title = e.calName || '';
        const txt = document.createElement('span');
        txt.className = 'cal-ev-x';
        const t = document.createElement('span');
        t.className = 'cal-ev-t';
        t.textContent = pad(e.start.getHours())+'.'+pad(e.start.getMinutes());
        txt.appendChild(t);
        txt.appendChild(document.createTextNode(e.title));
        if(e.vedlegg){
          const kl = document.createElement('span');
          kl.className = 'vedlegg-merke';
          kl.textContent = ' 📎';
          txt.appendChild(kl);
        }
        row.appendChild(dot);
        row.appendChild(txt);
        box.appendChild(row);
      });
      if(timed.length > vis.length){
        const more = document.createElement('div');
        more.className = 'cal-more';
        more.textContent = '+' + (timed.length - vis.length) + ' til';
        box.appendChild(more);
      }
    }
  });

  /* Titlene tegnes etter at cellene har faatt plass, saa vi kan maale
     hvor bredt hvert strekk faktisk er. */
  requestAnimationFrame(tegnBaandtitler);
}

/* ============================================================
   Titler paa fleredagsbaand

   Cellene klipper innholdet sitt, saa en tittel som skulle gaa over
   flere dager ble kuttet ved foerste dagsgrense. Titlene legges derfor
   i et eget lag oppaa rutenettet, der de kan strekke seg fritt.
   ============================================================ */
function tegnBaandtitler(){
  const grid = $('cal');
  if(!grid || grid.hidden) return;

  let lag = grid.querySelector('.cal-titler');
  if(!lag){
    lag = document.createElement('div');
    lag.className = 'cal-titler';
    grid.appendChild(lag);
  }
  lag.innerHTML = '';

  const gr = grid.getBoundingClientRect();
  const strekk = {};

  grid.querySelectorAll('.cal-band[data-strekk]').forEach(function(b){
    const n = b.dataset.strekk;
    if(!strekk[n]) strekk[n] = [];
    strekk[n].push(b);
  });

  Object.keys(strekk).forEach(function(n){
    const deler = strekk[n];
    const foerste = deler[0], siste = deler[deler.length - 1];
    const a = foerste.getBoundingClientRect();
    const z = siste.getBoundingClientRect();
    if(!a.width) return;

    const el = document.createElement('div');
    el.className = 'cal-tittel';
    /* Starter strekket her, staar initialen foerst - ellers fortsetter
       det fra forrige uke, og da skal bare navnet staa. */
    if(foerste.dataset.start){
      const ini = document.createElement('span');
      ini.className = 'cal-band-ini';
      ini.style.background = 'rgba(255,255,255,.35)';
      ini.textContent = foerste.dataset.ini || '';
      el.appendChild(ini);
    }
    const tekst = document.createElement('span');
    tekst.className = 'cal-tittel-tekst';
    tekst.textContent = (foerste.dataset.tittel || '')
      + (foerste.dataset.klips ? ' 📎' : '');
    el.appendChild(tekst);

    el.style.left   = (a.left - gr.left) + 'px';
    el.style.top    = (a.top  - gr.top)  + 'px';
    el.style.width  = (z.right - a.left) + 'px';
    el.style.height = a.height + 'px';

    /* Ett segment = én dag. Da leses navnet best fra venstre. Gaar det
       over flere dager, midtstilles det - men bare hvis det faktisk er
       plass, ellers begynner det fra venstre saa starten er lesbar. */
    lag.appendChild(el);
    /* Ett segment = én dag: navnet leses best fra venstre. Gaar det over
       flere dager, midtstilles det - men bare hvis hele navnet faktisk
       faar plass, ellers begynner det fra venstre saa starten er lesbar. */
    const flere = deler.length > 1;
    const passer = tekst.scrollWidth <= tekst.clientWidth + 1;
    el.classList.toggle('midt', flere && passer);
  });
}

/* Titlene er posisjonert i piksler, saa de maa regnes om naar vinduet
   endrer stoerrelse. */
let titlerTimer = null;
window.addEventListener('resize', function(){
  clearTimeout(titlerTimer);
  titlerTimer = setTimeout(tegnBaandtitler, 120);
});

function renderCal(){
  const y = S.view.getFullYear(), m = S.view.getMonth();

  const grid = $('cal');
  grid.innerHTML = '';
  grid.appendChild(Object.assign(document.createElement('div'), {className:'cal-wk cal-wk-h'}));
  DOW.forEach(function(d){
    const h = document.createElement('div');
    h.className = 'cal-dow';
    h.textContent = d;
    grid.appendChild(h);
  });

  const lead  = (new Date(y, m, 1).getDay() + 6) % 7;
  const days  = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const trailing = (7 - ((lead + days) % 7)) % 7;
  const rows = (lead + days + trailing) / 7;
  /* Antall uker varierer med maaneden. Uten dette staar de ubrukte
     radene igjen som et graatt felt nederst. */
  grid.style.gridTemplateRows = 'auto repeat(' + rows + ',minmax(0,1fr))';

  for(let r=0; r<rows; r++){
    const mandagIRad = new Date(y, m, 1 - lead + r*7);
    const wk = document.createElement('div');
    wk.className = 'cal-wk';
    wk.textContent = ukeNr(mandagIRad);
    grid.appendChild(wk);

    for(let c=0; c<7; c++){
      const dnum = r*7 + c - lead + 1;              /* dag i måneden */
      const utenfor = (dnum < 1 || dnum > days);     /* nabomaaned, samme uke */
      const date = new Date(y, m, dnum);
      const cell = document.createElement('div');
      cell.className = 'cal-cell'
        + (utenfor ? ' utenfor' : '')
        + (sameDay(date,today) ? ' today' : '')
        + (sameDay(date,S.sel) ? ' sel' : '')
        + ((date.getDay()===0 || date.getDay()===6) ? ' weekend' : '');

      const num = document.createElement('div');
      num.className = 'cal-num';
      num.textContent = date.getDate();
      cell.appendChild(num);

      const hnavn = helligdag(date);
      if(hnavn){
        cell.classList.add('helligdag');
        const hn = document.createElement('div');
        hn.className = 'cal-helg';
        hn.textContent = hnavn;
        hn.title = hnavn;
        cell.appendChild(hn);
      }

      const box = document.createElement('div');
      box.className = 'cal-evs';
      box.dataset.t = +date;
      cell.appendChild(box);

      cell.onclick = function(){
        if(skjulTrykk) return;
        const r = cell.getBoundingClientRect();   /* maal foer render() */
        const midt = r.left + r.width / 2;
        S.sel = date;
        render();
        // Uten hoeyrekolonne har dagen ingen annen plass aa vises paa
        if($('app').classList.contains('uten-side')) apneDagPanel(date, midt);
      };
      langtTrykk(cell, function(){ dagMeny(date); });
      grid.appendChild(cell);
    }
  }

  /* --- Legg bånd-avtaler i faste baner, uke for uke --- */
  const bånd  = S.events.filter(erBånd);
  const celle = {};
  const dagI  = function(d){ return new Date(y, m, d); };
  const colOf = function(d){ return (lead + d - 1) % 7; };
  for(let d=1; d<=days; d++){ celle[+dagI(d)] = { multi: [], maxLane: -1, enkelt: [] }; }

  const antUker = Math.ceil((lead + days) / 7);
  for(let w=0; w<antUker; w++){
    const wDays = [];
    for(let d=1; d<=days; d++){ if(Math.floor((lead + d - 1) / 7) === w) wDays.push(d); }
    if(!wDays.length) continue;

    const iUka = function(e){ return wDays.some(function(d){ return dekkerDag(e, dagI(d)); }); };
    const fler = bånd.filter(function(e){ return erFlerdags(e) && iUka(e); });
    const enk  = bånd.filter(function(e){ return !erFlerdags(e) && iUka(e); });

    fler.sort(function(a, b){
      const da = wDays.find(function(d){ return dekkerDag(a, dagI(d)); });
      const db = wDays.find(function(d){ return dekkerDag(b, dagI(d)); });
      return (colOf(da) - colOf(db)) || (bandSlutt(b) - bandSlutt(a)) || (a.calId < b.calId ? -1 : 1);
    });

    const laner = [];                       /* laner[i] = liste av [c0,c1] */
    fler.forEach(function(e){
      const cols = wDays.filter(function(d){ return dekkerDag(e, dagI(d)); }).map(colOf);
      const c0 = Math.min.apply(null, cols), c1 = Math.max.apply(null, cols);
      let lane = 0;
      while(laner[lane] && laner[lane].some(function(r){ return c0 <= r[1] && c1 >= r[0]; })) lane++;
      if(!laner[lane]) laner[lane] = [];
      laner[lane].push([c0, c1]);
      wDays.forEach(function(d){
        if(dekkerDag(e, dagI(d))){
          const info = celle[+dagI(d)];
          info.multi[lane] = e;
          if(lane > info.maxLane) info.maxLane = lane;
        }
      });
    });

    enk.forEach(function(e){
      wDays.forEach(function(d){
        if(dekkerDag(e, dagI(d))) celle[+dagI(d)].enkelt.push(e);
      });
    });
  }
  mndKart = { lead: lead, days: days, celle: celle };

  fyllAvtaler();
}

/* ============================================================
   Hurtigvelger

   null betyr "vis alle". Ellers er det et utvalg: foerste trykk velger
   én kalender alene, neste trykk legger til, trykk paa en som allerede
   er valgt tar den ut igjen.
   ============================================================ */
let hurtigUtvalg = null;

function hurtigVelg(id){
  if(!hurtigUtvalg){
    hurtigUtvalg = {};
    hurtigUtvalg[id] = true;
  } else if(hurtigUtvalg[id]){
    delete hurtigUtvalg[id];
    if(!Object.keys(hurtigUtvalg).length) hurtigUtvalg = null;   /* tomt = alle */
  } else {
    hurtigUtvalg[id] = true;
  }
  brukHurtigUtvalg();
}

/* Er alt paa, slaar knappen alt av - og motsatt. Da fungerer den som
   en av/paa-bryter i stedet for en doed knapp naar alt alt er valgt. */
function visAlleKal(){
  hurtigUtvalg = hurtigUtvalg ? null : {};
  brukHurtigUtvalg();
}

function brukHurtigUtvalg(){
  S.calendars.forEach(function(c){
    const med = iStrip(c.id);
    c.on = med && (hurtigUtvalg ? !!hurtigUtvalg[c.id] : true);
    kalenderValg[c.id] = c.on;
  });
  lagreKalenderValg();
  fyllFraCache();
  render();
  last(false);
}

function renderHurtigKal(){
  const el = $('hurtigKal');
  if(!el) return;
  if(!S.calendars.length){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = '';

  /* Husstanden foerst, i den rekkefoelgen de staar i INITIAL_PRI,
     saa de fem viktigste ligger paa samme plass hver gang. */
  const rang = function(c){
    const n = String(c.name || '').replace(/[<(].*$/, '').trim().toLowerCase();
    const i = INITIAL_PRI.findIndex(function(p){ return n.indexOf(p.toLowerCase()) === 0; });
    return i === -1 ? INITIAL_PRI.length : i;
  };

  S.calendars.filter(function(c){ return iStrip(c.id); })
    .sort(function(a, b){
    return (rang(a) - rang(b)) || String(a.name||'').localeCompare(String(b.name||''), 'no');
  }).forEach(function(c){
    const b = document.createElement('button');
    b.className = 'hk-ini'
      + (c.on ? '' : ' av')
      + ((hurtigUtvalg && hurtigUtvalg[c.id]) ? ' valgt' : '');
    b.style.background = c.color;
    b.title = c.name;
    b.textContent = initialFor(c.id, c.name);
    b.onclick = function(){ hurtigVelg(c.id); };
    el.appendChild(b);
  });

  const ingenPaa = hurtigUtvalg && !Object.keys(hurtigUtvalg).length;
  const alle = document.createElement('button');
  alle.className = 'hk-alle' + (hurtigUtvalg ? '' : ' pa');
  alle.title = ingenPaa ? 'Vis alle kalendere' : 'Skjul alle kalendere';
  alle.textContent = ingenPaa ? 'ALLE' : 'INGEN';
  alle.onclick = visAlleKal;
  el.appendChild(alle);
}

  naviger();

  /* I lista holder det ikke aa sette datoen - man maa ogsaa rulle dit.

    const gaa = function(){
      const el = $('plan');
      if(!el) return;
      const sec = el.querySelector('.plan-sec.idag');
      el.scrollTop = sec ? Math.max(0, sec.offsetTop - 8) : 0;
    };
    gaa();
    requestAnimationFrame(gaa);
    setTimeout(gaa, 80);

async function last(force){
  if(!(S.token || S.refresh)) return;
  if(S.loading){ S.ventende = S.ventende || force; return; }   /* slå sammen kall */
  S.loading = true;
  msg($('calMsg'), '');
  try{
    if(!S.calendars.length) await loadCalendars();
    const hentet = await sikreCache(force);
    fyllFraCache();
    render();
    if(hentet){
      sistHentet = new Date().toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
      const rb = $('refreshBtn');
      if(rb) rb.title = 'Sist oppdatert ' + sistHentet;
    }
  }catch(err){
    console.error(err);
    msg($('calMsg'), err.message, true);
    if(/Ikke innlogget|invalid_grant|expired/i.test(err.message)) nullstillLokalt();
  }finally{
    S.loading = false;
    if(S.ventende){ S.ventende = false; last(false); }
  }
}
/* Foerste trykk viser naar lista sist ble hentet, andre trykk henter paa
   nytt. Lukker seg selv etter noen sekunder. */
let sistHentet = null;
let oppdaterTimer = null;

function lukkOppdater(){
  clearTimeout(oppdaterTimer); oppdaterTimer = null;
  const b = $('refreshBtn');
  if(b) b.classList.remove('aapen');
}

function oppdaterTrykk(){
  const b = $('refreshBtn');
  if(!b) return;

  if(b.classList.contains('aapen')){   /* andre trykk - hent */
    lukkOppdater();
    refresh();
    return;
  }

  const t = $('refreshTekst');
  if(t){
    t.textContent = sistHentet
      ? ('Sist oppdatert ' + sistHentet)
      : 'Ikke oppdatert ennå';
  }
  b.classList.add('aapen');
  oppdaterTimer = setTimeout(lukkOppdater, 4000);
}

async function refresh(){
  // Ikonet snurrer saa lenge hentingen gaar - ellers ser knappen doed ut
  const b = $('refreshBtn');
  if(b) b.classList.add('gaar');
  try { return await last(true); }
  finally { if(b) b.classList.remove('gaar'); }
}

/* ---------- Detaljboble ----------
   Viser hele notatet uten aa aapne redigeringsskjemaet. */
/* Trykk utenfor panelene lukker alt som staar aapent, saa man slipper
   aa trykke to ganger naar bade dagen og en avtale er framme. */
function lukkSidepaneler(){
  lukkBoble();
  lukkDagPanel();
}

function lukkBoble(){
  apenAvtaleId = null;
  const b = $('boble');
  b.hidden = true;
  b.style.background = '';
  b.classList.remove('side', 'hoyre', 'venstre');
  $('bobleBak').hidden = true;
}

let apenAvtaleId = null;

function visBoble(id, klikk){
  const e = S.events.filter(function(x){ return x.id === id; })[0];
  if(!e) return;

  /* Samme avtale en gang til lukker den igjen */
  if(apenAvtaleId === id && !$('boble').hidden){
    lukkBoble();
    return;
  }
  apenAvtaleId = id;

  const tid = e.allDay
    ? 'Hele dagen'
    : tid2str(e.start) + '–' + tid2str(e.end);

  // Endre avtale staar oeverst - det er det man som regel kom hit for
  let html = '';
  if(e.kanEndre){
    html += '<button class="boble-knapp" onclick="lukkBoble(); endreAvtale(\''
      + e.id.replace(/'/g, "\\'") + '\')">Endre avtale</button>';
  }
  html += '<button class="boble-tilbake" onclick="lukkBoble()">&larr; Lukk</button>';
  html += '<div class="boble-topp">'
    + '<span class="boble-ini" style="background:' + e.color + '" title="'
    + esc(e.calName || '') + '">' + esc(initialFor(e.calId, e.calName)) + '</span>'
    + '</div>'
    + '<div class="boble-tittel">' + esc(e.title) + klipsHtml(e) + '</div>'
    + '<div class="boble-tid">' + esc(tid) + '</div>'
    + (e.where ? '<div class="boble-sted">' + esc(e.where) + '</div>' : '')
    + (e.note
        ? '<div class="boble-notat">' + esc(e.note) + '</div>'
        : '<div class="boble-notat ingen">Ingen notater.</div>')
    + '<div class="boble-vedlegg" id="bobleVedlegg" hidden></div>';

  const b = $('boble');
  $('bobleInn').innerHTML = html;
  $('bobleBak').hidden = false;
  b.hidden = false;
  /* Panelet baerer avtalens farge, men maa vaere ugjennomsiktig -
     det ligger oppaa kalenderen. */
  b.style.background = dusFast(e.color, .16);
  b.style.borderLeft = '';
  vedleggIVisning(e);

  const mål = (klikk && (klikk.currentTarget || klikk.target)) || null;
  const r = mål && mål.getBoundingClientRect ? mål.getBoundingClientRect() : null;

  /* Uten hoeyrekolonne vises avtalen som et sidepanel */
  const somPanel = $('app').classList.contains('uten-side');
  b.classList.toggle('side', somPanel);
  b.classList.remove('hoyre', 'venstre');
  $('bobleBak').classList.remove('dempet');
  if(somPanel){
    /* Kommer trykket fra dagpanelet, legger avtalen seg paa motsatt
       side, saa begge kan staa aapne samtidig. Ellers velges siden ut
       fra hvor paa skjermen man trykket. */
    let tilHoyre;
    if(dagPanelEl && dagPanelEl.panel.contains(mål)){
      tilHoyre = dagPanelEl.panel.classList.contains('venstre');
    } else {
      tilHoyre = r ? ((r.left + r.width / 2) < innerWidth / 2) : true;
      lukkDagPanel();        /* trykket kom utenfra - bare avtalen vises */
    }
    b.classList.add(tilHoyre ? 'hoyre' : 'venstre');
    $('bobleBak').classList.toggle('dempet', !dagPanelEl);
    b.style.left = ''; b.style.top = '';
    b.dataset.side = '';
    return;
  }

  /* Plasser boblen ved siden av det som ble trykket, og hold den
     innenfor skjermen. Peker settes der det er plass. */
  const bb = b.getBoundingClientRect();
  const marg = 10;

  let venstre = r ? (r.left + r.width/2 - bb.width/2) : (innerWidth/2 - bb.width/2);
  venstre = Math.max(marg, Math.min(venstre, innerWidth - bb.width - marg));

  let topp, side;
  if(r && (r.bottom + bb.height + 14 < innerHeight)){
    topp = r.bottom + 10; side = 'ned';
  } else if(r && (r.top - bb.height - 14 > 0)){
    topp = r.top - bb.height - 10; side = 'opp';
  } else {
    topp = Math.max(marg, innerHeight/2 - bb.height/2); side = 'ned';
  }

  b.style.left = Math.round(venstre) + 'px';
  b.style.top  = Math.round(topp) + 'px';
  b.dataset.side = side;
  const senter = r ? (r.left + r.width/2 - venstre) : bb.width/2;
  b.style.setProperty('--peker', Math.round(Math.max(16, Math.min(senter - 7, bb.width - 30))) + 'px');
}

function endreAvtale(id){
  const e = S.events.filter(function(x){ return x.id===id; })[0];
  if(!e) return;

  redigerer = e;
  $('dlgTitle').textContent = 'Endre avtale';
  $('fTitle').value = e.title;
  $('fAllDay').checked = e.allDay;
  $('fWhere').value = e.where;
  $('fNote').value  = e.note;
  vedleggNullstill();
  if(e.vedlegg) lastVedlegg(e.id);   /* hentes i bakgrunnen */

  if(e.allDay){
    const sisteDag = new Date(e.end.getTime() - 86400000);  // Graph slutter dagen etter
    $('fDate').value  = dato2str(e.start);
    $('fDate2').value = dato2str(sisteDag);
    $('fFrom').value  = '09:00';
    $('fTo').value    = '10:00';
  } else {
    $('fDate').value  = dato2str(e.start);
    $('fDate2').value = dato2str(e.end);
    $('fFrom').value  = tid2str(e.start);
    $('fTo').value    = tid2str(e.end);
  }

  fyllKalendervalg(e.calId);
  $('fCal').disabled = true;              // flytting mellom kalendere støttes ikke
  $('btnSlett').hidden = !e.kanEndre;
  $('btnLagre').disabled = !e.kanEndre;
  allDagToggle();

  dlgFeil(!e.kanEndre
    ? 'Denne kalenderen er skrivebeskyttet — avtalen kan bare leses.'
    : (e.serie ? 'Dette er én gjentakelse i en serie. Endringen gjelder bare denne dagen.' : ''));
  if(e.serie && e.kanEndre) $('dlgMsg').style.color = 'var(--ink-soft)';

  $('veil').hidden = false;
}

function dlgFeil(t){
  const el = $('dlgMsg');
  el.hidden = !t;
  el.style.color = '#B4443A';
  el.textContent = t || '';
}

function lukk(){
  $('veil').hidden = true;
  $('fCal').disabled = false;
  redigerer = null;
}

function bygg(){
  const tittel = $('fTitle').value.trim();
  if(!tittel) throw new Error('Gi avtalen et navn.');

  const heleDagen = $('fAllDay').checked;
  const d1 = $('fDate').value;
  if(!d1) throw new Error('Velg en dato.');

  const p = {
    subject: tittel,
    isAllDay: heleDagen,
    location: { displayName: $('fWhere').value.trim() }
  };

  /* Notatet sendes bare naar det faktisk er endret. Rikt formaterte
     notater fra Outlook ville ellers blitt flatet ut til ren tekst
     hver eneste gang noen justerte klokkeslettet. */
  const notatNaa = $('fNote').value.trim();
  if(!redigerer || notatNaa !== String(redigerer.note || '').trim()){
    p.body = { contentType:'text', content: notatNaa };
  }

  if(heleDagen){
    const d2 = $('fDate2').value || d1;
    if(d2 < d1) throw new Error('Sluttdato kan ikke være før startdato.');
    const dagEtter = new Date(d2 + 'T00:00:00');
    dagEtter.setDate(dagEtter.getDate() + 1);
    p.start = { dateTime: d1 + 'T00:00:00', timeZone: TZ };
    p.end   = { dateTime: dato2str(dagEtter) + 'T00:00:00', timeZone: TZ };
  } else {
    const t1 = $('fFrom').value, t2 = $('fTo').value;
    if(!t1 || !t2) throw new Error('Fyll inn klokkeslett.');
    let d2 = $('fDate2').value || d1;
    if(d2 < d1) d2 = d1;
    if(d1 === d2 && t2 <= t1) throw new Error('Sluttidspunktet må være etter starten.');
    p.start = { dateTime: d1 + 'T' + t1 + ':00', timeZone: TZ };
    p.end   = { dateTime: d2 + 'T' + t2 + ':00', timeZone: TZ };
  }
  return p;
}

/* ============================================================
   Vedlegg

   Filer lastes opp til avtalen i Graph. Smaa filer gaar i ett kall;
   Graph tar imot inntil 3 MB den veien. Stoerre filer maa gjennom en
   opplastingsoekt, som vi ikke stoetter her - da sier vi fra i stedet
   for aa la det feile stille.
   ============================================================ */
const VEDLEGG_MAKS = 3 * 1024 * 1024;

let vedleggFinnes = [];   // {id, name, size} som allerede ligger paa avtalen
let vedleggNye = [];      // File-objekter valgt i skjemaet
let vedleggSlett = [];    // id-er som skal fjernes ved lagring

function vedleggNullstill(){
  vedleggFinnes = []; vedleggNye = []; vedleggSlett = [];
  tegnVedlegg();
}

function filStr(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return Math.round(n/1024) + ' kB';
  return (n/1024/1024).toFixed(1).replace('.', ',') + ' MB';
}

function valgteFiler(liste){
  Array.prototype.slice.call(liste).forEach(function(f){
    if(f.size > VEDLEGG_MAKS){
      dlgFeil('«' + f.name + '» er for stor. Grensen er 3 MB.');
      return;
    }
    vedleggNye.push(f);
  });
  document.getElementById('fFil').value = '';
  tegnVedlegg();
}

function tegnVedlegg(){
  const c = $('vedleggListe');
  if(!c) return;
  c.innerHTML = '';

  vedleggFinnes.forEach(function(v){
    if(vedleggSlett.indexOf(v.id) !== -1) return;
    const rad = vedleggRad(v.name, v.size, function(){
      vedleggSlett.push(v.id);
      tegnVedlegg();
    }, function(ev){ aapneVedlegg(v, ev.currentTarget); });
    c.appendChild(rad);
  });

  vedleggNye.forEach(function(f, i){
    const rad = vedleggRad(f.name, f.size, function(){
      vedleggNye.splice(i, 1);
      tegnVedlegg();
    }, function(){
      /* Ikke lastet opp ennaa - aapnes rett fra fila paa maskinen */
      const url = URL.createObjectURL(f);
      window.open(url, '_blank');
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    });
    rad.classList.add('ny');
    c.appendChild(rad);
  });

}

function vedleggRad(navn, str, fjern, aapne){
  const rad = document.createElement('div');
  rad.className = 'vedlegg-rad';

  const n = document.createElement('button');
  n.type = 'button';
  n.className = 'vedlegg-navn';
  n.textContent = navn;
  n.title = 'Åpne ' + navn;
  if(aapne) n.onclick = aapne;

  const t = document.createElement('span');
  t.className = 'vedlegg-str';
  t.textContent = filStr(str || 0);

  const x = document.createElement('button');
  x.type = 'button';
  x.className = 'vedlegg-fjern';
  x.title = 'Fjern';
  x.innerHTML = '&times;';
  x.onclick = fjern;

  rad.appendChild(n); rad.appendChild(t); rad.appendChild(x);
  return rad;
}

// Henter lista over vedlegg som allerede ligger paa avtalen
async function lastVedlegg(eventId){
  vedleggFinnes = [];
  try{
    const d = await graph('/me/events/' + eventId + '/attachments?$select=id,name,size');
    vedleggFinnes = (d.value || []).map(function(a){
      return { id:a.id, name:a.name, size:a.size };
    });
  }catch(err){ /* uten vedlegg, eller ingen tilgang - vis tomt */ }
  tegnVedlegg();
}

/* Henter innholdet fra Graph og aapner det. Filen kommer som base64 og
   gjoeres om til en blob, saa nettleseren kan vise eller laste den ned. */
function aapneVedlegg(v, knapp){
  return aapneVedleggFra(redigererId(), v, knapp);
}

async function aapneVedleggFra(eventId, v, knapp){
  if(knapp) knapp.disabled = true;
  try{
    const a = await graph('/me/events/' + eventId + '/attachments/' + v.id);
    if(!a.contentBytes) throw new Error('Vedlegget kunne ikke hentes.');

    const bin = atob(a.contentBytes);
    const buf = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const blob = new Blob([buf], { type: a.contentType || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);

    /* Last ned med riktig filnavn. Nettleseren aapner det den kan vise. */
    const lenke = document.createElement('a');
    lenke.href = url;
    lenke.download = a.name || v.name;
    document.body.appendChild(lenke);
    lenke.click();
    lenke.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }catch(err){
    if(knapp) knapp.title = 'Klarte ikke åpne: ' + err.message;
    dlgFeil('Klarte ikke åpne vedlegget: ' + err.message);
  }finally{
    if(knapp) knapp.disabled = false;
  }
}

function redigererId(){ return redigerer ? redigerer.id : ''; }

/* Binders naar avtalen har vedlegg. Legges paa et element som allerede
   har tittelen som tekst. */
function klipsPaa(el, e){
  if(!e.vedlegg) return el;
  const k = document.createElement('span');
  k.className = 'vedlegg-merke';
  k.title = 'Har vedlegg';
  k.textContent = ' 📎';
  el.appendChild(k);
  return el;
}

/* Binders naar avtalen har vedlegg. Brukes overalt der tittelen vises. */
function klipsHtml(e){
  return e.vedlegg ? ' <span class="vedlegg-merke" title="Har vedlegg">📎</span>' : '';
}

function erBilde(a){
  /* Bare vanlige filvedlegg kan vises. En avtale eller e-post lagt ved
     har en helt annen form. */
  const type = a['@odata.type'] || '';
  if(type && type.indexOf('fileAttachment') === -1) return false;

  if(a.contentType && /^image\//i.test(a.contentType)) return true;
  /* Outlook sender av og til bilder som generisk filtype, saa navnet
     faar avgjoere naar typen ikke sier noe. */
  return /\.(png|jpe?g|gif|webp|heic|heif|bmp|tiff?)$/i.test(a.name || '');
}

/* Tegner et bilde vi allerede har innholdet til */
function tegnBilde(a, boks){
  const ramme = document.createElement('figure');
  ramme.className = 'vedlegg-bilde';

  const img = document.createElement('img');
  img.src = 'data:' + (a.contentType || 'image/png') + ';base64,' + a.contentBytes;
  img.alt = a.name || '';
  img.loading = 'lazy';
  img.onclick = function(ev){
    ev.stopPropagation();
    const v = window.open('', '_blank');
    if(v){
      v.document.write('<title>' + esc(a.name || 'Bilde') + '</title>'
        + '<body style="margin:0;background:#111;display:flex;align-items:center;'
        + 'justify-content:center;min-height:100vh"><img src="' + img.src
        + '" style="max-width:100%;max-height:100vh"></body>');
      v.document.close();
    }
  };

  const tekst = document.createElement('figcaption');
  tekst.textContent = a.name || '';

  ramme.appendChild(img);
  ramme.appendChild(tekst);
  boks.appendChild(ramme);
  return ramme;
}

/* Henter bildet foerst hvis innholdet ikke fulgte med i lista */
async function visBilde(eventId, a, boks){
  try{
    const d = await graph('/me/events/' + eventId + '/attachments/' + a.id);
    if(!d.contentBytes) return;
    tegnBilde(d, boks);
  }catch(err){ /* uten innhold vises det ingenting - bedre enn en feil */ }
}

/* Viser vedleggene i avtalevisningen, med lenke for aa aapne dem.
   Hentes i bakgrunnen, saa panelet vises med det samme. Teller sikrer
   at et treigt svar fra en tidligere avtale ikke skriver over den man
   ser paa naa. */
let vedleggOekt = 0;

async function vedleggIVisning(e){
  const boks = document.getElementById('bobleVedlegg');
  if(!boks) return;
  vedleggOekt++;
  const min = vedleggOekt;
  boks.innerHTML = '';
  if(!e.vedlegg){ boks.hidden = true; return; }

  boks.hidden = false;
  boks.textContent = 'Henter vedlegg …';
  try{
    const d = await graph('/me/events/' + e.id + '/attachments');
    if(min !== vedleggOekt) return;      /* en annen avtale er aapnet */
    const liste = d.value || [];
    boks.innerHTML = '';
    if(!liste.length){ boks.hidden = true; return; }

    liste.forEach(function(a){
      /* Bilder vises som bilde. Har vi allerede innholdet, slipper vi
         et ekstra kall. */
      if(erBilde(a)){
        if(a.contentBytes) tegnBilde(a, boks);
        else visBilde(e.id, a, boks);
        return;
      }

      const rad = document.createElement('div');
      rad.className = 'vedlegg-rad';

      const n = document.createElement('button');
      n.type = 'button';
      n.className = 'vedlegg-navn';
      n.textContent = a.name;
      n.title = 'Åpne ' + a.name;
      n.onclick = function(ev){
        ev.stopPropagation();
        aapneVedleggFra(e.id, a, ev.currentTarget);
      };

      const t = document.createElement('span');
      t.className = 'vedlegg-str';
      t.textContent = filStr(a.size || 0);

      rad.appendChild(n); rad.appendChild(t);
      boks.appendChild(rad);
    });
  }catch(err){
    boks.textContent = 'Klarte ikke hente vedlegg.';
  }
}

function filTilBase64(f){
  return new Promise(function(ok, feil){
    const r = new FileReader();
    r.onload = function(){ ok(String(r.result).split(',')[1]); };
    r.onerror = function(){ feil(new Error('Klarte ikke lese ' + f.name)); };
    r.readAsDataURL(f);
  });
}

async function lagreVedlegg(eventId){
  for(const id of vedleggSlett){
    try{ await graph('/me/events/' + eventId + '/attachments/' + id, 'DELETE'); }
    catch(err){ /* alt fjernet fra foer - ikke noe aa gjoere */ }
  }
  for(const f of vedleggNye){
    const data = await filTilBase64(f);
    await graph('/me/events/' + eventId + '/attachments', 'POST', {
      '@odata.type': '#microsoft.graph.fileAttachment',
      name: f.name,
      contentType: f.type || 'application/octet-stream',
      contentBytes: data
    });
  }
}

async function lagreAvtale(){

   Tidsrutenett — uke og dag
   ============================================================ */

/* Fordeler avtaler som overlapper i side-om-side-spor */
function spor(evs){
  const sortert = evs.slice().sort(function(a,b){
    return (a.f - b.f) || (b.t - b.f) - (a.t - a.f);
  });
  const ut = [];
  let klynge = [], klyngeSlutt = -1;

  function avslutt(){
    if(!klynge.length) return;
    const baner = [];
    klynge.forEach(function(e){
      let i = 0;
      while(i < baner.length && baner[i] > e.f) i++;
      if(i === baner.length) baner.push(0);
      baner[i] = e.t;
      e.bane = i;
    });
    klynge.forEach(function(e){ e.baner = baner.length; ut.push(e); });
    klynge = []; klyngeSlutt = -1;
  }

  sortert.forEach(function(e){
    if(klynge.length && e.f >= klyngeSlutt) avslutt();
    klynge.push(e);
    klyngeSlutt = Math.max(klyngeSlutt, e.t);
  });
  avslutt();
  return ut;
}

/* ---------------- Plan: uke og dag ----------------
   Plan svarer paa et annet spoersmaal enn Kalender: hvordan flyter uka?
   Derfor ingen navnekolonne og ingen rad per person - hver dag er én
   kronologisk soeyle med alle paaslaatte kalendere blandet. Fargestripe
   og initial forteller hvem det gjelder. Kalender-visningen bruker
   fortsatt renderUke og er uroert. */
/* Kalenderfargen som gjennomsiktig fyll. Teksten blir staaende moerk mot en
   lys tone av personens egen farge, saa hvem det gjelder leses uten forklaring. */
function rgbAv(hex){
  const h = String(hex || '').replace('#','').trim();
  const full = h.length === 3 ? h[0]+h[0]+h[1]+h[1]+h[2]+h[2] : h;
  if(!/^[0-9a-fA-F]{6}$/.test(full)) return {r:44, g:62, b:80};   /* faller tilbake paa blekk */
  return {
    r: parseInt(full.slice(0,2),16),
    g: parseInt(full.slice(2,4),16),
    b: parseInt(full.slice(4,6),16)
  };
}
function dus(hex, a){
  const c = rgbAv(hex);
  return 'rgba('+c.r+','+c.g+','+c.b+','+a+')';
}

/* Samme tone, men blandet mot hvitt i stedet for gjennomsiktig. Brukes
   der noe ligger oppaa annet innhold og maa vaere ugjennomsiktig. */
function dusFast(hex, a){
  const c = rgbAv(hex);
  const m = function(v){ return Math.round(v * a + 255 * (1 - a)); };
  return 'rgb('+m(c.r)+','+m(c.g)+','+m(c.b)+')';
}

function planFarget(e){

    ? 'Hele dagen'
    : tid2str(e.start) + '–' + tid2str(e.end);
  topp.appendChild(tid);

  /* Sted og notat vises ikke her - de ligger i boblen ved trykk. En liten
     prikk forteller bare at det finnes mer aa se. */

    const mer = document.createElement('span');

  };

  el.addEventListener('touchstart', function(ev){ ev.stopPropagation(); }, {passive:true});
  el.addEventListener('mousedown',  function(ev){ ev.stopPropagation(); });

}

/* Merker avtaler som overlapper i tid. Poenget med planvisningen er aa se
   kollisjoner - hvem kjoerer naar en vakt og en trening ligger oppaa
   hverandre - saa de maa se annerledes ut enn avtaler som bare foelger
   etter hverandre. */
function planKollisjoner(evs){
  const kolliderer = new Set();
  for(let i=0;i<evs.length;i++){
    for(let j=i+1;j<evs.length;j++){
      const a = evs[i], b = evs[j];
      if(a.allDay || b.allDay) continue;
      if(a.start < b.end && b.start < a.end){ kolliderer.add(a.id); kolliderer.add(b.id); }
    }
  }
  return kolliderer;
}

/* Fordeler avtaler paa parallelle spor: en avtale legges i foerste spor
   der den ikke overlapper noe fra foer. Heldagsavtaler staar oeverst i
   full bredde og teller ikke med. Returnerer en liste med spor. */
function planSpor(evs){
  const spor = [];
  evs.forEach(function(e){
    if(erBånd(e)) return;
    let i = 0;
    while(spor[i] && spor[i].some(function(x){
      return e.start < x.end && x.start < e.end;
    })) i++;
    if(!spor[i]) spor[i] = [];
    spor[i].push(e);
  });
  return spor;
}

/* ============================================================
   Dagvisning med tidsakse

   Timene staar loddrett paa begge sider. Avtalene plasseres etter
   klokkeslett og er like hoeye som de varer. Overlappende avtaler
   fordeles paa parallelle spor.
   ============================================================ */
function renderDagTid(){
  const d = S.sel;
  const paa = {};
  S.calendars.forEach(function(c){ if(c.on) paa[c.id] = true; });

  const tg = $('tg');
  tg.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'dagtid';

  const evs = S.events.filter(function(e){
    if(!paa[e.calId]) return false;
    return erBånd(e) ? dekkerDag(e, d) : sameDay(e.start, d);
  }).sort(function(a, b){ return a.start - b.start; });

  /* Heldags oeverst, utenfor tidsaksen */
  const heldags = evs.filter(erBånd);
  if(heldags.length){
    const rad = document.createElement('div');
    rad.className = 'dagtid-heldag';
    heldags.forEach(function(e){
      const el = planFarget(e);
      el.classList.add('heldags');
      rad.appendChild(el);
    });
    wrap.appendChild(rad);
  }

  const scroll = document.createElement('div');
  scroll.className = 'dagtid-scroll';

  const inner = document.createElement('div');
  inner.className = 'dagtid-inner';
  inner.style.height = (24 * TIME_H) + 'px';

  /* Timeakse paa begge sider, og en strek tvers over for hver time */
  const venstre = document.createElement('div');
  venstre.className = 'dagtid-akse venstre';
  const hoyre = document.createElement('div');
  hoyre.className = 'dagtid-akse hoyre';
  for(let t = 0; t < 24; t++){
    const linje = document.createElement('div');
    linje.className = 'dagtid-linje';
    linje.style.top = (t * TIME_H) + 'px';
    inner.appendChild(linje);

    [venstre, hoyre].forEach(function(akse){
      const lab = document.createElement('span');
      lab.style.top = (t * TIME_H) + 'px';
      lab.textContent = pad(t) + '.00';
      akse.appendChild(lab);
    });
  }

  const felt = document.createElement('div');
  felt.className = 'dagtid-felt';

  const timede = evs.filter(function(e){ return !erBånd(e); });
  const spor = planSpor(timede);
  const antSpor = Math.max(1, spor.length);

  spor.forEach(function(liste, i){
    liste.forEach(function(e){
      const fra = minutter(e.start);
      const til = sameDay(e.end, d) ? minutter(e.end) : 24 * 60;
      const hoyde = (til - fra) / 60 * TIME_H;

      /* Under denne hoeyden er det ikke plass til bade klokkeslett og
         navn. Blokken beholder sin riktige hoeyde, men teksten faar
         henge videre under i en gjennomsiktig hale. */
      const MIN_LESBAR = 40;
      const kort = hoyde < MIN_LESBAR;

      const el = document.createElement('div');
      el.className = 'dagtid-ev' + (kort ? ' kort' : '');
      el.style.top = (fra / 60 * TIME_H) + 'px';
      el.style.height = hoyde + 'px';
      if(kort) el.style.setProperty('--hale', (MIN_LESBAR - hoyde) + 'px');
      el.style.left = (i / antSpor * 100) + '%';
      el.style.width = 'calc(' + (100 / antSpor) + '% - 5px)';
      el.style.background = dus(e.color, .18);
      el.style.borderColor = dus(e.color, .62);

      const rund = document.createElement('div');
      rund.className = 'dagtid-ini';
      rund.style.background = e.color;
      rund.title = e.calName || '';
      rund.textContent = initialFor(e.calId, e.calName);

      const tekst = document.createElement('div');
      tekst.className = 'dagtid-tekst';

      const tid = document.createElement('div');
      tid.className = 'dagtid-ev-t';
      tid.textContent = tid2str(e.start) + '–' + tid2str(e.end);

      const nav = document.createElement('div');
      nav.className = 'dagtid-ev-n';
      nav.textContent = e.title;
      klipsPaa(nav, e);

      tekst.appendChild(tid);
      tekst.appendChild(nav);
      el.appendChild(rund);
      el.appendChild(tekst);
      el.title = e.title;
      el.onclick = function(ev){ ev.stopPropagation(); if(skjulTrykk) return; visBoble(e.id, ev); };
      felt.appendChild(el);
    });
  });

  /* Rød strek for naa, hvis vi ser paa dagen i dag */
  if(sameDay(d, new Date())){
    const naa = document.createElement('div');
    naa.className = 'tg-naa';
    naa.style.top = (minutter(new Date()) / 60 * TIME_H) + 'px';
    felt.appendChild(naa);
  }

  inner.appendChild(venstre);
  inner.appendChild(felt);
  inner.appendChild(hoyre);
  scroll.appendChild(inner);
  wrap.appendChild(scroll);
  tg.appendChild(wrap);

  /* Hopp rett ned til foerste avtale. Har dagen ingen, staar vi paa 8.
     Maa vente til nettleseren har laget ut hoeydene - paa telefon er
     ikke rulleomraadet maalt ennaa naar vi kommer hit. */
  const tidligst = timede.length
    ? timede.reduce(function(a, e){ return Math.min(a, minutter(e.start)); }, 24*60)
    : 8*60;
  const maal = Math.max(0, (tidligst / 60 * TIME_H) - 16);
  const settRull = function(){
    if(!scroll.isConnected) return;
    scroll.scrollTop = maal;
  };
  settRull();
  requestAnimationFrame(settRull);
  setTimeout(settRull, 60);
}

function renderUkePlan(dager){
  if(!dager){
    const s0 = mandag(S.sel);
    dager = [];
    for(let i=0;i<7;i++) dager.push(plussDager(s0, i));
  }
  const nCols = dager.length;
  const idag = new Date();
  const paa = {};
  S.calendars.forEach(function(c){ if(c.on) paa[c.id] = true; });

  const kols = 'repeat(' + nCols + ',minmax(0,1fr))';
  const tg = $('tg');
  tg.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'uke pu' + (nCols === 1 ? ' endag' : '');

  const head = document.createElement('div');
  head.className = 'uke-head';
  head.style.gridTemplateColumns = kols;
  dager.forEach(function(d){
    const c = document.createElement('div');
    const hd = helligdag(d);
    c.className = 'uke-dcol'
      + (sameDay(d, idag) ? ' idag' : '')
      + (sameDay(d, S.sel) ? ' sel' : '')
      + (hd ? ' helligdag' : '');
    c.innerHTML = '<div class="uke-dow">' + DOW[(d.getDay()+6)%7] + '</div>'
                + '<div class="uke-dnum">' + d.getDate() + '</div>'
                + (hd ? '<div class="uke-helg" title="'+esc(hd)+'">'+esc(hd)+'</div>' : '');
    c.onclick = function(){
      if(skjulTrykk) return;
      const r = c.getBoundingClientRect();        /* maal foer render() */
      const midt = r.left + r.width / 2;
      S.sel = d;
      render();
      if($('app').classList.contains('uten-side')) apneDagPanel(d, midt);
    };
    langtTrykk(c, function(){ dagMeny(d); });
    head.appendChild(c);
  });
  wrap.appendChild(head);

  const scroll = document.createElement('div');
  scroll.className = 'uke-scroll';

  if(!Object.keys(paa).length){
    scroll.innerHTML = '<div class="msg" style="padding:16px">'
      + 'Ingen kalendere er på. Slå på en kalender i lista.</div>';
    wrap.appendChild(scroll);
    tg.appendChild(wrap);
    return;
  }

  const rad = document.createElement('div');
  rad.className = 'pu-rad';
  rad.style.gridTemplateColumns = kols;

  dager.forEach(function(d){
    const kol = document.createElement('div');
    kol.className = 'pu-kol'
      + (sameDay(d, idag) ? ' idag' : '')
      + ((d.getDay()===0 || d.getDay()===6) ? ' helg' : '')
      + (helligdag(d) ? ' helligdag' : '');

    /* Alle paaslaatte kalendere blandet, heldags foerst, saa kronologisk. */
    const evs = S.events.filter(function(e){
      if(!paa[e.calId]) return false;
      return erBånd(e) ? dekkerDag(e, d) : sameDay(e.start, d);
    }).sort(function(a, b){
      if(erBånd(a) !== erBånd(b)) return erBånd(a) ? -1 : 1;
      return a.start - b.start;
    });

    if(!evs.length) kol.classList.add('rolig');

    const kolliderer = planKollisjoner(evs);
    const tegn = function(e){
      const el = planFarget(e);
      if(erBånd(e)) el.classList.add('heldags');
      if(kolliderer.has(e.id)) el.classList.add('kollisjon');
      return el;
    };

    /* Dagvisning: overlappende avtaler settes side om side, saa man ser
       at de gaar samtidig i stedet for at de stables under hverandre. */
    const spor = (nCols === 1) ? planSpor(evs) : [];
    if(nCols === 1 && spor.length > 1){
      evs.filter(erBånd).forEach(function(e){ kol.appendChild(tegn(e)); });
      const rader = document.createElement('div');
      rader.className = 'pu-spor';
      rader.style.gridTemplateColumns = 'repeat(' + spor.length + ',minmax(0,1fr))';
      spor.forEach(function(liste){
        const s = document.createElement('div');
        s.className = 'pu-spor-kol';
        liste.forEach(function(e){ s.appendChild(tegn(e)); });
        rader.appendChild(s);
      });
      kol.appendChild(rader);
    } else {
      evs.forEach(function(e){ kol.appendChild(tegn(e)); });
    }

    langtTrykk(kol, function(){ S.sel = d; nyAvtale(); });
    kol.onclick = function(){ if(skjulTrykk) return; S.sel = d; render(); };
    rad.appendChild(kol);
  });

  scroll.appendChild(rad);
  wrap.appendChild(scroll);
  tg.appendChild(wrap);

  /* Kolonner som er fulle skal ikke dytte innholdet nedover. Det som
     ikke faar plass skjules bak "+N avtaler", og kommer fram naar man
     ruller - da er det plass til det. */
  requestAnimationFrame(function(){ klippKolonner(scroll); });
}

/* Ingenting skjules. Kolonnene beholder full hoeyde, saa alt kommer til
   syne naar man ruller. Naar en kolonne rekker under synsranden, henger
   en teller nederst i den og sier hvor mange som er igjen. Telleren
   oppdaterer seg mens man ruller, og forsvinner naar man er i bunnen. */
function klippKolonner(scroll){
  if(!scroll || !scroll.isConnected) return;

  const tell = function(){
    /* Maalt mot skjermen, ikke mot offsetParent. offsetTop pekte paa et
       annet element enn det som ruller, og ga feil tall. */
    const bunn = scroll.getBoundingClientRect().bottom;

    scroll.querySelectorAll('.pu-kol').forEach(function(kol){
      let lapp = kol.querySelector('.pu-mer-lapp');

      let under = 0;
      kol.querySelectorAll('.pu-ev').forEach(function(el){
        if(el.getBoundingClientRect().bottom > bunn - 6) under++;
      });

      if(!under){
        if(lapp) lapp.remove();
        return;
      }
      if(!lapp){
        lapp = document.createElement('button');
        lapp.type = 'button';
        lapp.className = 'pu-mer-lapp';
        /* Trykk ruller ned saa de neste kommer til syne */
        lapp.onclick = function(ev){
          ev.stopPropagation();
          scroll.scrollBy({ top: scroll.clientHeight * 0.7, behavior: 'smooth' });
        };
        kol.appendChild(lapp);
      }
      lapp.textContent = '+' + under + (under === 1 ? ' avtale' : ' avtaler');
    });
  };

  tell();
  if(!scroll.dataset.lytter){
    scroll.dataset.lytter = '1';
    scroll.addEventListener('scroll', tell, {passive:true});
  }
}

/* Fire visninger: Maaned (rutenett), Uke (kolonner), Dag (kolonner) og
   Liste. Liste bruker perioden man sto i, saa den fungerer som foer. */
function settVisning(v){
  const knapper = $('seg').children;
  for(let i=0;i<knapper.length;i++){
    knapper[i].classList.toggle('on', knapper[i].dataset.m === v);
  }

  if(v === 'liste'){
    if(S.vis === 'liste') return;
    S.vis = 'liste';
    /* Lista begynner paa dagen man har valgt. Har man ikke valgt noe
       fram i tid, begynner den paa i dag - pilene tar deg bakover. */
    const idag = new Date();
    const nullstilt = new Date(idag.getFullYear(), idag.getMonth(), idag.getDate());
    if(S.sel < nullstilt) S.sel = nullstilt;
    naviger();
    return;
  }

  const samme = (S.modus === v && S.vis !== 'liste');
  if(samme) return;

  S.modus = v;
  S.vis = (v === 'month') ? 'kal' : 'plan';
  if(v !== 'month'){
    /* hold maanedsvisningen i takt med valgt dag */
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  }
  naviger();
}

/* Avtaler som gjelder en dag (bånd-avtaler dekker hver dag de spenner over) */
function planEvs(d){
  return S.events.filter(function(e){
    return erBånd(e) ? dekkerDag(e, d) : sameDay(e.start, d);
  }).sort(function(a, b){
    if(erBånd(a) !== erBånd(b)) return erBånd(a) ? -1 : 1;
    return a.start - b.start;
  });
}

/* Ett avtalekort med notat: ett trykk utvider notatet, langt trykk redigerer */
/* Under 900px legger rutenettet seg i én kolonne, og hoeyrepanelet
   havner under innholdet i stedet for ved siden av. */
function smalSkjerm(){
  return window.matchMedia('(max-width:900px)').matches;
}

/* Lista begynner paa dagen man staar paa - i dag, eller den man har
   valgt i maaned eller uke - og gaar framover derfra. */
/* Lista rekker to aar fram, men henter tre maaneder om gangen og
   utvider seg naar man ruller mot bunnen. */
/* Ingen yttergrense - lista utvider seg saa langt man orker aa rulle.
   Den henter fortsatt bare en bolk om gangen. */
const LISTE_BOLK = 92;       /* tre maaneder om gangen framover */
const LISTE_BAK_BOLK = 31;   /* en maaned om gangen bakover */
let listeVindu = LISTE_BOLK;
let listeBak = 0;

function nullstillListe(){ listeVindu = LISTE_BOLK; listeBak = 0; }

/* Ruller man mot bunnen hentes flere dager framover, mot toppen flere
   bakover. Ved bakoverutvidelse maa rullingen flyttes like mye, ellers
   ville lista hoppet under fingeren. */
let listeUtvider = false;

/* Dagen som staar oeverst i synsfeltet akkurat naa */
function oeversteDag(el){
  const topp = el.getBoundingClientRect().top;
  const seksjoner = el.querySelectorAll('.plan-sec');
  for(let i = 0; i < seksjoner.length; i++){
    if(seksjoner[i].getBoundingClientRect().bottom > topp + 4){
      return { dato: seksjoner[i].dataset.dato,
               avvik: seksjoner[i].getBoundingClientRect().top - topp };
    }
  }
  return null;
}

/* Ruller tilbake til samme dag etter at lista er tegnet paa nytt */
function rullTilDag(el, anker){
  if(!anker) return;
  const sec = el.querySelector('.plan-sec[data-dato="' + anker.dato + '"]');
  if(!sec) return;
  el.scrollTop = sec.offsetTop - (anker.avvik || 0);
}

function listeRulling(){
  const el = $('plan');
  if(!el || S.vis !== 'liste' || listeUtvider) return;

  if(el.scrollTop + el.clientHeight > el.scrollHeight - 400){
    listeUtvider = true;
    listeVindu += LISTE_BOLK;
    renderListe();
    last(false);
    listeUtvider = false;
    return;
  }

  if(el.scrollTop < 300){
    listeUtvider = true;
    /* Hold blikket paa samme dag. Aa regne paa hoeyde bommet, fordi
       tomme dager faller bort og seksjonene ikke er like hoeye. */
    listeBak += LISTE_BAK_BOLK;
    renderListe();          /* holder selv blikket paa samme dag */
    last(false);
    listeUtvider = false;
  }
}

function listeStart(){
  const d = new Date(S.sel.getFullYear(), S.sel.getMonth(), S.sel.getDate());
  return plussDager(d, -listeBak);
}

function listePeriode(){
  const start = listeStart();
  const a = [];
  for(let i = 0; i < listeBak + listeVindu; i++) a.push(plussDager(start, i));
  return a;
}

let listeLyttes = false;

function renderListe(){
  const wrap = $('plan');
  if(!listeLyttes){
    wrap.addEventListener('scroll', listeRulling, {passive:true});
    listeLyttes = true;
  }

  /* Lista tegnes ogsaa naar en henting blir ferdig. Uten dette hoppet
     den tilbake til toppen midt i rullingen. */
  const anker = wrap.scrollTop > 0 ? oeversteDag(wrap) : null;

  wrap.innerHTML = '';
  const dager = listePeriode();
  const hoppTomme = true;   /* rullende liste: bare dager med avtaler */
  let noe = false;

  dager.forEach(function(d){
    const evs = planEvs(d);
    if(hoppTomme && !evs.length) return;
    noe = true;

    const sec = document.createElement('div');
    sec.className = 'plan-sec' + (sameDay(d, new Date()) ? ' idag' : '');
    sec.dataset.dato = dato2str(d);
    const head = document.createElement('div');
    const hd = helligdag(d);
    head.className = 'plan-dhead';
    head.innerHTML = '<span class="plan-uke">Uke ' + ukeNr(d) + '</span> · '
      + esc(DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase())
      + (hd ? ' <span class="plan-helg">· '+esc(hd)+'</span>' : '');
    if(hd) sec.classList.add('helligdag');
    sec.appendChild(head);

    if(!evs.length){
      const tom = document.createElement('div');
      tom.className = 'plan-tom';
      tom.textContent = '—';
      sec.appendChild(tom);
    } else {
      /* Regnes én gang per dag, ikke én gang per rad */
      const koll = planKollisjoner(evs);
      evs.forEach(function(e){ sec.appendChild(planItem(e, koll)); });
    }
    wrap.appendChild(sec);
  });

  if(!noe){
    const tom = document.createElement('div');
    tom.className = 'plan-tom';
    tom.style.padding = '16px 4px';
    tom.textContent = 'Ingen avtaler i perioden.';
    wrap.appendChild(tom);
  }

  rullTilDag(wrap, anker);
}

function tittel(){
  /* Lista ruller framover fra dagen man staar paa */
  if(S.vis === 'liste'){
    const d = S.sel, idag = new Date();
    return (sameDay(d, idag) ? 'Fra i dag' : 'Fra ' + d.getDate() + '. '
      + MND[d.getMonth()].toLowerCase());
  }
  if(S.modus === 'month') return MND[S.view.getMonth()] + ' ' + S.view.getFullYear();
  if(S.modus === 'day'){
    return DAG[S.sel.getDay()] + ' ' + S.sel.getDate() + '. ' + MND[S.sel.getMonth()].toLowerCase()
      + ' · Uke ' + ukeNr(S.sel);
  }
  const m = mandag(S.sel), s = plussDager(m, 6);
  const sm = m.getMonth() === s.getMonth()
    ? m.getDate() + '.–' + s.getDate() + '. ' + MND[s.getMonth()].toLowerCase()
    : m.getDate() + '. ' + MND[m.getMonth()].toLowerCase().slice(0,3)
      + ' – ' + s.getDate() + '. ' + MND[s.getMonth()].toLowerCase().slice(0,3);
  return 'Uke ' + ukeNr(m) + ' · ' + sm;
}


function bla(n){
  /* I lista blar vi en uke om gangen fra startdagen */
  if(S.vis === 'liste'){
    S.sel = plussDager(S.sel, 7*n);
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
    naviger();
    return;
  }
  if(S.modus === 'month'){
    S.view = new Date(S.view.getFullYear(), S.view.getMonth()+n, 1);
    /* la valgt dag følge med inn i den nye måneden */
    const idag = new Date();
    S.sel = (idag.getFullYear() === S.view.getFullYear() && idag.getMonth() === S.view.getMonth())
      ? idag
      : new Date(S.view.getFullYear(), S.view.getMonth(), 1);
  } else if(S.modus === 'week'){
    S.sel = plussDager(S.sel, 7*n);
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  } else {
    S.sel = plussDager(S.sel, n);
    S.view = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  }
  naviger();
}

/* ============================================================
   Sveip til side for å bytte måned
   ============================================================ */
let skjulTrykk = false;   /* undertrykker klikk rett etter sveip/langt trykk */
let dagpopEl   = null;

/* Fanger og forkaster ETT klikk (det syntetiske som følger en berøring),
   slik at et langt trykk ikke straks lukker dialogen det nettopp åpnet. */
function svelgNesteKlikk(){
  function svelg(e){
    e.stopPropagation(); e.preventDefault();
    document.removeEventListener('click', svelg, true);
    clearTimeout(t);
  }
  document.addEventListener('click', svelg, true);
  const t = setTimeout(function(){
    document.removeEventListener('click', svelg, true);
  }, 700);
}

/* Langt trykk (hold ~0,5 s) på et element. Fungerer med både berøring og mus. */
function langtTrykk(el, handler){
  let timer = null, x0 = 0, y0 = 0;
  function start(e){
    const pt = e.touches ? e.touches[0] : e;
    x0 = pt.clientX; y0 = pt.clientY;
    stopp();
    timer = setTimeout(function(){
      timer = null;
      skjulTrykk = true;
      svelgNesteKlikk();
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(_){} }
      handler();
      setTimeout(function(){ skjulTrykk = false; }, 450);
    }, 480);
  }
  function beveg(e){
    const pt = e.touches ? e.touches[0] : e;
    if(Math.abs(pt.clientX - x0) > 12 || Math.abs(pt.clientY - y0) > 12) stopp();
  }
  function stopp(){ if(timer){ clearTimeout(timer); timer = null; } }
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove',  beveg, {passive:true});
  el.addEventListener('touchend',   stopp, {passive:true});
  el.addEventListener('touchcancel',stopp, {passive:true});
  el.addEventListener('mousedown',  start);
  el.addEventListener('mousemove',  beveg);
  el.addEventListener('mouseup',    stopp);
  el.addEventListener('mouseleave', stopp);
  el.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
}

/* ============================================================
   Dagpanel

   Naar hoeyrekolonnen er borte (Maaned+Kalender og Uke+Plan) vises
   dagen man trykker paa i et panel som dekker halve skjermen. Panelet
   legger seg paa motsatt side av dagen, saa dagen forblir synlig.
   ============================================================ */
let dagPanelEl = null;

/* midtX er senterpunktet til det man trykket paa, maalt FOER render().
   Etter render() er elementet byttet ut, og maalingen ville gitt 0 -
   som gjorde at panelet alltid havnet paa hoeyre side. */
function apneDagPanel(dato, midtX){
  lukkDagPanel();

  const tilHoyre = (typeof midtX === 'number')
    ? (midtX < window.innerWidth / 2)
    : true;

  const bak = document.createElement('div');
  bak.className = 'dagpanel-bak';
  bak.onclick = lukkSidepaneler;

  const panel = document.createElement('div');
  panel.className = 'dagpanel ' + (tilHoyre ? 'hoyre' : 'venstre');

  document.body.appendChild(bak);
  document.body.appendChild(panel);
  dagPanelEl = { panel: panel, bak: bak };
  tegnDagPanel();
}

function tegnDagPanel(){
  if(!dagPanelEl) return;
  const d = S.sel, today = new Date();
  const evs = eventsOn(d);

  const topp = document.createElement('div');
  topp.className = 'dagpanel-topp';

  const tit = document.createElement('div');
  tit.className = 'dagpanel-tittel';
  tit.textContent = sameDay(d, today)
    ? 'I dag'
    : DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase();
  topp.appendChild(tit);

  const tall = document.createElement('span');
  tall.className = 'dagpanel-tall';
  tall.textContent = evs.length ? evs.length + (evs.length === 1 ? ' avtale' : ' avtaler') : '';
  topp.appendChild(tall);

  const liste = document.createElement('div');
  liste.className = 'dagpanel-liste';
  if(!evs.length){
    liste.innerHTML = '<div class="msg">Ingen avtaler denne dagen.</div>';
  } else {
    liste.innerHTML = evs.map(function(e){
      const time = e.allDay
        ? 'Hele<br>dagen'
        : pad(e.start.getHours())+'.'+pad(e.start.getMinutes())
          + '<br>' + pad(e.end.getHours())+'.'+pad(e.end.getMinutes());
      const meta = e.where || '';
      return '<div class="ev klikk" style="background:'+dusFast(e.color,.18)+';border-color:'+dus(e.color,.62)+'" onclick="visBoble(\''+e.id+'\', event)">'
        + '<div class="ev-stor-ini" style="background:'+e.color+'" title="'+esc(e.calName||'')+'">'
        +   esc(initialFor(e.calId, e.calName))+'</div>'
        + '<div class="ev-time">'+time+'</div>'
        + '<div class="ev-body">'
        +   '<div class="ev-title">'+esc(e.title)+klipsHtml(e)+'</div>'
        +   (meta ? '<div class="ev-meta">'+esc(meta)+'</div>' : '')
        + '</div></div>';
    }).join('');
  }

  const ny = document.createElement('button');
  ny.className = 'dagpanel-ny';
  ny.textContent = '+ Ny avtale';
  ny.onclick = function(){ lukkDagPanel(); nyAvtale(); };

  dagPanelEl.panel.innerHTML = '';
  dagPanelEl.panel.appendChild(topp);
  dagPanelEl.panel.appendChild(liste);
  dagPanelEl.panel.appendChild(ny);
}

function lukkDagPanel(){
  if(!dagPanelEl) return;
  dagPanelEl.panel.remove();
  dagPanelEl.bak.remove();
  dagPanelEl = null;
}

/* Meny som spretter opp ved langt trykk på en dag:
   ingen avtaler → rett til ny; ellers «Ny avtale» + liste å redigere fra. */
function dagMeny(d){
  lukkDagMeny();
  const evs = eventsOn(d);
  if(!evs.length){ S.sel = d; render(); nyAvtale(); return; }

  const veil = document.createElement('div');
  veil.className = 'dagpop';
  veil.onclick = function(e){ if(e.target === veil) lukkDagMeny(); };

  const card = document.createElement('div');
  card.className = 'dagpop-card';

  const head = document.createElement('div');
  head.className = 'dagpop-head';
  head.textContent = DAG[d.getDay()] + ' ' + d.getDate() + '. ' + MND[d.getMonth()].toLowerCase();
  card.appendChild(head);

  const ny = document.createElement('button');
  ny.className = 'dagpop-ny';
  ny.textContent = '+ Ny avtale';
  ny.onclick = function(){ lukkDagMeny(); S.sel = d; render(); nyAvtale(); };
  card.appendChild(ny);

  /* Overskrift over lista, saa det er tydelig at et trykk her gaar
     rett til redigering og ikke bare viser detaljene. */
  const endreTit = document.createElement('div');
  endreTit.className = 'dagpop-bolk';
  endreTit.textContent = 'Endre';
  card.appendChild(endreTit);

  const liste = document.createElement('div');
  liste.className = 'dagpop-liste';
  evs.forEach(function(e){
    const row = document.createElement('button');
    row.className = 'dagpop-ev';
    const tid = e.allDay ? 'Hele dagen'
      : tid2str(e.start) + '–' + tid2str(e.end);
    row.innerHTML = '<span class="dagpop-ini" style="background:'+e.color+'" title="'
      + esc(e.calName || '')+'">'+esc(initialFor(e.calId, e.calName))+'</span>'
      + '<span class="dagpop-tid">'+esc(tid)+'</span>'
      + '<span class="dagpop-navn">'+esc(e.title)+klipsHtml(e)+'</span>';
    row.onclick = function(){ lukkDagMeny(); endreAvtale(e.id); };
    liste.appendChild(row);
  });
  card.appendChild(liste);

  veil.appendChild(card);
  document.body.appendChild(veil);
  dagpopEl = veil;
}
function lukkDagMeny(){
  if(dagpopEl){ dagpopEl.remove(); dagpopEl = null; }
}

(function sveip(){
  let x0 = 0, y0 = 0, aktiv = false;

  function start(e){
    if(e.touches.length !== 1){ aktiv = false; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    aktiv = true;
  }
  function slutt(e){
    if(!aktiv) return;
    aktiv = false;
    const t  = e.changedTouches[0];
    const dx = t.clientX - x0;
    const dy = t.clientY - y0;
    if(Math.abs(dx) < 60) return;                    /* for kort til å være sveip */
    if(Math.abs(dx) < Math.abs(dy) * 1.5) return;    /* mest opp/ned — la rulling gå */
    skjulTrykk = true;
    bla(dx < 0 ? 1 : -1);
    setTimeout(function(){ skjulTrykk = false; }, 400);
  }

  const panel = document.querySelector('.cal-panel');
  if(panel){
    /* capture-fasen: fanges selv om brikker stopper bobling for langt trykk */
    panel.addEventListener('touchstart', start, {passive:true, capture:true});
    panel.addEventListener('touchend',   slutt, {passive:true, capture:true});
  }
})();

/* Andre etappe av utloggingen: rydder Access-sesjonen naar vi er
   tilbake fra Microsoft. Maa kjoere foer alt annet paa siden. */
(function fullfoerUtlogging(){
  let flagg = null;
  try{ flagg = sessionStorage.getItem('fh_ut'); }catch(_){}
  if(!flagg) return;
  try{ sessionStorage.removeItem('fh_ut'); }catch(_){}
  location.replace('/cdn-cgi/access/logout');
})();

(async function init(){
  /* Vis et eventuelt lagret navn straks, saa det ikke staar tomt mens
     Graph-kallet paagaar. Overskrives naar det ekte svaret kommer. */
  try{
    const lagret = localStorage.getItem('fh_navn');
    if(lagret){
      const el = $('brandNavn');
      if(el) el.textContent = String(lagret).trim().split(/\s+/)[0] || '';
    }
  }catch(e){}

  const q = new URLSearchParams(location.search);

  if(q.get('error')){
    $('gateNote').textContent = 'Microsoft svarte: ' + (q.get('error_description') || q.get('error'));
    history.replaceState({}, '', REDIRECT);
    render();
    return;
  }

  if(q.get('code')){
    const verifier = sessionStorage.getItem('fh_verifier');
    const expect   = sessionStorage.getItem('fh_state');
    history.replaceState({}, '', REDIRECT);
    if(!verifier || q.get('state') !== expect){
      $('gateNote').textContent = 'Innloggingen ble avbrutt. Prøv på nytt.';
      render();
      return;
    }
    try{
      const d = await exchange({
        grant_type:'authorization_code',
        code:q.get('code'),
        code_verifier:verifier,
        scope:CFG.scopes
      });
      saveTokens(d);
      sessionStorage.removeItem('fh_verifier');
      sessionStorage.removeItem('fh_state');
    }catch(err){
      $('gateNote').textContent = err.message;
      render();
      return;
    }
  } else {
    loadTokens();
  }

  /* Access-identiteten er uavhengig av Microsoft-tokenet, så navnet under
     logoen vises også før man har logget inn i selve kalenderen. */
  const identitet = hentIdentitet();

  render();
  if(S.token || S.refresh){
    /* Identitet og felles farger hentes samtidig med brukerinfo —
       de er små kall og skal ikke forsinke kalenderlastingen. */
    await Promise.all([
      loadMe().catch(function(){}),
      identitet,
      hentFarger()
    ]);

    /* Delt iPad: Access-sesjonen og Microsoft-tokenet er to uavhengige
       identiteter, og de kan komme i utakt ved brukerbytte. Vi logger
       avviket, men kaster ingenting — det er ikke gitt hvilken av dem
       som er den utdaterte. Utloggingen i index.html rydder begge. */
    if(minEpost && S.me){
      const graphEpost = normEpost(S.me.mail || S.me.userPrincipalName || '');
      if(graphEpost && graphEpost !== minEpost){
        console.warn('Identiteter i utakt — Access: ' + minEpost + ', Microsoft: ' + graphEpost);
      }
    }
    render();
    await refresh();
  }
})();

document.addEventListener('visibilitychange', function(){
  if(!document.hidden) refresh();
});
